:root{--ink:#233f3c;--green:#365f52;--cream:#f6f5ef;--muted:#697b73;--line:#dce3db}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fffdf8}.brand{font:600 23px Georgia}.brand span{color:#b27a60}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:white;border-radius:30px;padding:10px 18px;color:var(--ink)}button:hover,button.active{background:var(--green);color:white}main{max-width:1160px;margin:auto;padding:32px 24px 80px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}h1{font:normal clamp(36px,5vw,64px)/1.12 Georgia;margin:16px 0 22px}h2{font:normal 30px/1.2 Georgia}h3{font-size:18px;margin:0 0 8px}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:50px;align-items:center;padding:24px 0 42px}.hero p{max-width:600px;color:var(--muted)}art{display:block;position:relative;background:#e5ece1;border-radius:180px 180px 24px 24px;height:310px;overflow:hidden}.circle{position:absolute;border-radius:50%;width:130px;height:130px;background:#c49b7e;left:55px;top:62px}.circle.two{background:#7d9c83;left:auto;right:55px;top:95px}.arc{position:absolute;left:32px;right:32px;bottom:-80px;height:210px;background:#f4ede1;border-radius:50%}.artlabel{position:absolute;bottom:26px;text-align:center;width:100%;font:italic 25px Georgia}.primary{background:var(--green);color:white}.note{padding:16px 20px;background:#e9eee5;border-radius:14px;font-size:14px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:23px}.card p{color:var(--muted);font-size:14px}.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#97715e}.card button{margin-top:8px}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:25px 0}input,textarea,select{padding:12px;border:1px solid #c7d1c7;border-radius:10px;background:white;color:var(--ink);width:100%}textarea{min-height:100px}label{display:block;margin:16px 0 6px;font-weight:600;font-size:14px}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:24px}.quote{font:24px/1.5 Georgia;border-left:3px solid #b88a70;padding:15px 25px;background:#f7f3eb}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.result{margin-top:20px;padding:22px;border-radius:14px;background:#e9eee5}footer{color:var(--muted);font-size:12px;text-align:center;padding:24px}.hidden{display:none}.step{color:#97715e;font-size:13px}a{color:var(--green)}@media(max-width:760px){header{align-items:flex-start;gap:16px;flex-direction:column}nav button{font-size:13px;padding:8px 12px}.hero,.twoCol{grid-template-columns:1fr}.hero{gap:18px}art{height:220px}.grid{grid-template-columns:1fr}main{padding:22px 18px}.topline{align-items:stretch;flex-direction:column}h1{font-size:42px}}

:root{--ink:#2d174b;--green:#7436d2;--cream:#fff8f5;--muted:#75667e;--line:#eadff0}body{background:radial-gradient(ellipse at 95% 5%,#ffe0db 0,transparent 38%),radial-gradient(ellipse at 0 30%,#f0e3ff 0,transparent 44%),#fff9f6}header{background:#fffaf8eF;position:sticky;top:0;z-index:10;backdrop-filter:blur(15px);border-color:#eedfee}.brand{font-family:system-ui;font-weight:800;letter-spacing:-1px}.brand span{color:#c22f68}nav button{background:transparent;border-color:transparent}button{transition:transform .18s,box-shadow .18s,background .18s;font-weight:650}button:hover{transform:translateY(-2px);box-shadow:0 6px 20px #7436d21a}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c054aa;outline-offset:3px}.hero{gap:45px;min-height:500px;padding:40px 0 55px}.hero h1{font-size:clamp(42px,5.7vw,72px);letter-spacing:-2.5px}.hero h1 em{font-style:normal;color:#bd245c}.hero p{font-size:18px;line-height:1.8;max-width:490px}.eyebrow{color:#8637a8;letter-spacing:1.6px;font-size:11px}.hero .eyebrow{background:#f3e4ff;display:inline-block;padding:8px 13px;border-radius:30px}.primary{background:linear-gradient(120deg,#8636d4,#bd245c);border:0;color:#fff;box-shadow:0 8px 24px #a63a7133;padding:14px 25px}.couple-wrap{position:relative;padding:12px 0 22px}.couple{width:100%;height:390px;object-fit:cover;object-position:center;border-radius:95px 24px 95px 24px;box-shadow:16px 16px 0 #ffc75d,0 20px 50px #a64d5f20}.photo-badge{position:absolute;bottom:4px;left:-15px;background:white;padding:15px 22px;border-radius:18px;box-shadow:0 10px 40px #37194718;font-size:14px;font-weight:700;transform:rotate(-3deg)}.spark{position:absolute;right:-12px;top:-10px;font-size:65px;color:#b12467;text-shadow:2px 2px white}.note{background:#f1e8ff;border:1px solid #e4d3f7;color:#593979;border-radius:16px}.topline h2{margin:8px 0;font-size:34px;letter-spacing:-.5px}.card{border:1px solid #eddde9;box-shadow:0 5px 22px #53326406;border-radius:22px;padding:26px;transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #53326412}.grid .card:nth-child(4n+1){background:#fff0eb}.grid .card:nth-child(4n+2){background:#f4edff}.grid .card:nth-child(4n+3){background:#fff5d9}.grid .card:nth-child(4n){background:#eaf7f3}.grid .card h3{font-size:21px;letter-spacing:-.6px}.grid .card button{background:#ffffffc9;border-color:#d8c5df;font-size:13px;padding:10px 14px}.grid .card button:hover{background:#7436d2;color:white}.tag{color:#86547a}.scenario-icon{font-size:31px;color:#912e8a;margin:8px 0 14px;line-height:1}.quote{background:#fff0e8;border-color:#dc568a}.result{background:#f0e5ff}.step{color:#a02c6d}footer{background:#f3eafa;margin-top:20px;padding:26px}input,textarea,select{border-color:#d7c5dd}button:disabled{opacity:.65;cursor:default;transform:none}@media(max-width:760px){.hero{padding-top:20px;gap:28px;min-height:unset}.hero h1{font-size:46px;letter-spacing:-1.6px}.hero p{font-size:16px}.couple{height:290px;border-radius:65px 20px 65px 20px;box-shadow:9px 9px 0 #ffc75d}.couple-wrap{max-width:500px;margin:0 auto;width:100%}.photo-badge{left:6px;font-size:12px;padding:12px}.spark{right:-5px;font-size:48px}.brand{font-size:22px}header{position:static}.topline h2{font-size:30px}.hero .eyebrow{font-size:9px}.grid{gap:13px}.grid .card{padding:22px}}

</style></head><body><header></header><main id="app"></main><footer></footer><script>const CONTENT={"fr": {"scenarios": [["Vous voyez votre partenaire au restaurant avec quelqu’un", "Une sortie à deux", "Je t’ai vu sortir du restaurant avec cette personne. Dans quel contexte vous connaissez-vous ?", "Une sortie peut être amicale, familiale, professionnelle ou amoureuse. Le lieu et le genre de la personne ne suffisent pas à conclure."], ["Vous voyez votre partenaire sortir d’un hôtel avec quelqu’un", "Un contexte à clarifier", "Je t’ai vu sortir de cet hôtel avec cette personne. Dans quel contexte étiez-vous là ?", "Un hôtel peut accueillir des réunions, visites ou séjours. Cette observation ne démontre pas un rapport sexuel."], ["Quelqu’un vient de déposer votre partenaire en voiture", "Quelqu’un raccompagne votre partenaire", "Qui t’a raccompagné ? Comment s’est passée ta sortie ?", "Un trajet partagé ne renseigne pas sur une relation intime."], ["Vous apercevez votre partenaire embrasser quelqu’un", "Vérifier ce qui a été vu", "J’ai aperçu ce qui m’a semblé être un baiser sur la bouche. Est-ce bien ce qui s’est passé ?", "Une vision à distance peut être ambiguë. Un baiser amoureux confirmé peut franchir une limite convenue, sans prouver un rapport sexuel."], ["Votre partenaire refuse de montrer ses conversations privées", "Vie privée et confiance", "Je respecte ton espace privé. Comment parler de ce qui m’inquiète et de nos limites dans les échanges avec les autres ?", "Refuser une fouille du téléphone ne démontre pas une infidélité. L’accès doit être librement consenti, jamais imposé."], ["Votre partenaire sort sans vous expliquer ses projets", "Se prévenir sans se surveiller", "Peut-on convenir de se prévenir lors d’une sortie et de donner une heure approximative de retour ?", "Cherchez une règle réciproque qui respecte l’autonomie de chacun."], ["Votre partenaire devient nerveux pendant votre discussion", "Accueillir le malaise", "Cette discussion semble te mettre mal à l’aise. Est-ce mon ton, le sujet ou autre chose ?", "La nervosité ne permet pas de détecter un mensonge. Une pause peut faciliter l’échange."], ["Votre partenaire se fait beau ou belle pour une sortie ordinaire", "L’apparence et ses interprétations", "Tu as choisi une jolie tenue aujourd’hui. Une occasion particulière ?", "Se faire beau ou belle peut simplement procurer du plaisir. Ce n’est pas une preuve d’infidélité."], ["Le récit de votre partenaire contient une contradiction", "Clarifier sans piéger", "Tout à l’heure, tu as dit X, et maintenant Y. Peux-tu m’aider à comprendre cette différence ?", "La mémoire, une incompréhension ou un changement de plan peuvent expliquer une différence. Restez sur les faits précis."], ["Votre partenaire souhaite moins de contacts intimes", "Écouter les besoins", "Comment te sens-tu dans notre intimité ? Y a-t-il quelque chose dont tu aurais besoin ?", "Le désir et le besoin de proximité varient. Chacun peut refuser un contact, sans avoir à prouver sa fidélité."], ["Votre partenaire échange de nombreux messages avec quelqu’un", "Définir les limites ensemble", "Quelles limites souhaitons-nous pour les échanges amicaux, amoureux ou sexuels avec d’autres personnes ?", "La fréquence des messages seule ne révèle pas leur contenu. Évitez les accès clandestins aux comptes."], ["Votre partenaire reconnaît une relation avec une autre personne", "Choisir la suite", "J’ai besoin de comprendre ce qui s’est passé et de réfléchir à ce que je souhaite pour la suite. Pouvons-nous en parler calmement ?", "Vous pouvez demander du temps, choisir une séparation ou envisager une réparation. Le pardon ne se commande pas."], ["Vous soupçonnez souvent une tromperie sans fait nouveau", "Comprendre son inquiétude", "Je remarque que mes inquiétudes reviennent souvent. Peut-on parler de ce qui nourrit cette insécurité ?", "Distinguez les observations actuelles des peurs et des expériences passées. Un accompagnement individuel peut aider."], ["Votre discussion sur la fidélité se transforme en dispute", "Prendre de la distance", "Je préfère qu’on fasse une pause. Reprenons quand nous pourrons parler sans crier.", "Si vous avez peur, êtes menacé ou empêché de partir, privilégiez votre sécurité et contactez une personne de confiance."], ["Vous n’avez pas le même accord sur l’exclusivité", "Clarifier l’exclusivité", "Qu’est-ce que notre engagement signifie pour chacun de nous aujourd’hui ?", "Les accords peuvent différer entre couples. Définissez explicitement les comportements acceptés et les limites."], ["Votre partenaire refuse de parler de vos doutes", "Respect et besoins personnels", "Je respecte que tu ne veuilles pas en parler maintenant. Quand pourrions-nous reprendre cette discussion ?", "Un refus n’est pas un aveu. Vous pouvez exprimer vos besoins et décider si la relation vous convient."], ["Votre partenaire reconnaît avoir effacé des messages pour vous les cacher", "Suppression reconnue, contenu à clarifier", "Tu dis avoir effacé ces messages pour me les cacher. Que concernaient-ils et quel accord cela touche-t-il ?", "La dissimulation est reconnue, pas nécessairement une liaison. Effacer des messages, sans contexte établi, peut aussi relever d’un usage ordinaire."], ["Votre partenaire vous parle d’un compte de messagerie non déclaré", "Compte distinct, usage à clarifier", "À quoi sert ce compte et quelles limites souhaitons-nous pour les échanges amoureux avec d’autres ?", "Un compte professionnel ou privé n’est pas une preuve. Discutez de l’usage reconnu, sans chercher à forcer l’accès."], ["Votre partenaire reconnaît une intimité affective cachée avec quelqu’un", "Lien émotionnel et limites du couple", "Quelle place a cette relation et qu’avons-nous convenu concernant les liens amoureux ou émotionnels avec d’autres ?", "Une amitié proche n’est pas automatiquement une infidélité. Clarifiez le caractère amoureux, le secret reconnu et vos accords."], ["Votre partenaire reconnaît utiliser une application de rencontres", "Usage actuel, statut et intention", "Quel usage fais-tu actuellement de cette application et comment cela s’accorde-t-il avec notre engagement ?", "Un ancien profil ne prouve pas un usage actuel. Un usage reconnu doit être discuté selon votre accord, sans présumer de rencontres physiques."], ["Votre partenaire reconnaît avoir inventé une sortie ou un déplacement", "Un faux récit reconnu", "Tu reconnais que cette explication était inventée. Que s’est-il passé et de quoi ai-je besoin pour décider de la suite ?", "Le mensonge reconnu concerne ce récit précis. Il ne prouve pas à lui seul un rapport sexuel ou une autre liaison."], ["Votre partenaire admet des échanges sexuels en ligne mais dit « ce n’est que virtuel »", "Définir ensemble l’infidélité numérique", "Pour moi, ces échanges touchent notre engagement. Quelles limites pensions-nous avoir et que voulons-nous maintenant ?", "L’absence de contact physique ne règle pas la question des limites. Le désaccord doit porter sur les faits reconnus et les accords du couple."], ["Votre partenaire reconnaît avoir caché une dépense liée à quelqu’un", "Secret financier, motif à comprendre", "Quelle était cette dépense et quel accord avons-nous concernant l’argent partagé et les cadeaux ?", "Une dépense cachée peut poser un problème financier sans prouver une liaison. Ne contrôlez pas les comptes privés ; abordez les responsabilités partagées."], ["Votre partenaire reconnaît s’être présenté comme célibataire", "Statut de couple nié auprès d’un tiers", "Tu reconnais avoir dit être célibataire. Dans quel contexte, et qu’est-ce que cela signifie pour notre engagement ?", "Le fait reconnu est ce mensonge sur le statut. Il ne confirme pas une relation sexuelle ; discutez de ses conséquences et de vos limites."]], "signs": [["Regard détourné", "Timidité, réflexion, fatigue, gêne ou habitudes culturelles.", "Qu’est-ce qui te mettrait plus à l’aise pour parler ?"], ["Bras croisés ou posture fermée", "Confort, froid, tension ou besoin de distance.", "Souhaites-tu qu’on change de cadre ou qu’on fasse une pause ?"], ["Rougeur ou transpiration", "Chaleur, effort, stress ou émotion.", "Est-ce que tu as besoin d’un moment ?"], ["Voix tremblante ou hésitations", "Stress, peur du conflit, émotion ou recherche des mots.", "Prends ton temps, je t’écoute."], ["Sourire ou rire nerveux", "Gêne, politesse ou manière de réguler la tension.", "Comment vis-tu cette conversation ?"], ["Colère ou ton défensif", "Sentiment d’être accusé, frustration ou désaccord.", "Peut-on reprendre avec un ton plus calme ?"], ["Silence ou réponse courte", "Fatigue, besoin de réflexion ou difficulté à parler.", "Préfères-tu répondre plus tard ou par écrit ?"], ["Changement de proximité physique", "Besoin d’espace, fatigue, humeur ou difficultés relationnelles.", "Quel niveau de proximité te convient maintenant ?"], ["Cheveux ou vêtements dérangés", "Vent, trajet, travail ou activité quotidienne.", "Aucune conclusion sur une activité sexuelle ne peut être tirée de cette apparence."], ["Respiration plus rapide ou cœur qui bat vite", "Réactions physiologiques non spécifiques : elles ne permettent pas d’établir la cause ou de confirmer une activité sexuelle.", "Ne mesurez pas le corps de votre partenaire pour chercher une preuve."], ["Lubrification ou érection", "Une réaction corporelle ne prouve ni rapport sexuel récent, ni désir pour une personne précise, ni consentement.", "Le consentement se demande explicitement et peut être retiré."], ["Sécrétions, odeur ou saignement", "Les sécrétions peuvent varier normalement. Leur aspect ne permet pas de conclure à une infidélité.", "Si un changement inhabituel ou une douleur inquiète la personne, elle peut demander un avis médical. Ne pratiquez pas d’inspection."], ["Hymen ou apparence génitale", "L’apparence de l’hymen ne permet pas de prouver des rapports vaginaux.", "Aucun test de virginité. Voir la déclaration de l’OMS dans Mon contexte."], ["Expressions très brèves", "Expressions ambiguës et dépendantes du contexte.", "Les microexpressions ne constituent pas un détecteur fiable de mensonge."]], "dangerItems": [["Menaces de mort ou arme utilisée pour intimider", "Des paroles ou gestes qui font craindre une blessure ou la mort. Il n’est pas nécessaire d’attendre un passage à l’acte."], ["Pression sur le cou ou suffocation", "Toute compression du cou ou entrave à la respiration est grave, même sans marque visible. Une évaluation médicale rapide est nécessaire."], ["Contrôle des déplacements et du téléphone", "Imposer des mots de passe, une géolocalisation ou des comptes rendus sous menace dépasse une demande de communication."], ["Isolement", "Empêcher les contacts avec les proches, le travail ou les soutiens extérieurs réduit l’autonomie."], ["Violence ou coercition sexuelle", "Imposer un contact, poursuivre après un refus, ou faire pression pour obtenir un acte sexuel. Le couple ne remplace pas le consentement."], ["Harcèlement ou surveillance après une rupture", "Suivre la personne, multiplier les contacts non souhaités ou apparaître régulièrement à ses lieux de vie."], ["Contrôle économique ou administratif", "Confisquer l’argent ou les documents, empêcher de travailler, ou utiliser le statut migratoire comme menace."], ["Humiliation et intimidation répétées", "Rabaisser, effrayer, détruire des objets ou menacer les proches pour obtenir l’obéissance."], ["Escalade", "Des violences qui deviennent plus fréquentes, des menaces plus précises ou l’usage d’une arme appellent une aide spécialisée."], ["Refus de respecter les limites", "Punir un refus, empêcher de partir ou imposer des règles unilatérales par la peur."]]}, "en": {"scenarios": [["You see your partner at a restaurant with someone", "A meal together", "I saw you leaving the restaurant with that person. How do you know each other?", "The outing may be friendly, family-related, professional or romantic. The location and the person’s gender do not establish what happened."], ["You see your partner leaving a hotel with someone", "Clarify the context", "I saw you leaving that hotel with someone. What was the context?", "Hotels host meetings, visits and overnight stays. Leaving one does not prove sexual activity."], ["Someone has just driven your partner home", "Someone drives your partner", "Who gave you a ride? How was your outing?", "Sharing a ride does not establish an intimate relationship."], ["You see your partner kissing someone", "Check what you saw", "I saw what looked like a kiss on the lips. Is that what happened?", "A distant view may be ambiguous. A confirmed romantic kiss may cross an agreed boundary, but does not prove sex."], ["Your partner refuses to show private conversations", "Privacy and trust", "I respect your privacy. How can we discuss my worries and our boundaries with other people?", "Refusing a phone search does not prove cheating. Access must be freely agreed, never forced."], ["Your partner goes out without explaining their plans", "Communicate without monitoring", "Could we agree to let each other know when we go out and give an approximate return time?", "Find a mutual agreement that respects each person’s independence."], ["Your partner becomes nervous during your conversation", "Make room for discomfort", "This conversation seems uncomfortable for you. Is it my tone, the topic or something else?", "Nervousness is not a lie detector. A pause may help."], ["Your partner dresses up for an ordinary outing", "Appearance and assumptions", "You chose a lovely outfit today. Any particular occasion?", "Dressing well may simply feel good. It is not reliable evidence of cheating."], ["Your partner’s account contains a contradiction", "Clarify without trapping", "Earlier you said X, and now Y. Can you help me understand the difference?", "Memory, misunderstanding or changed plans may explain a difference. Focus on specific facts."], ["Your partner wants less intimate contact", "Listen to needs", "How do you feel about our intimacy? Is there anything you need?", "Desire and closeness vary. Anyone can decline contact without having to prove fidelity."], ["Your partner exchanges many messages with someone", "Agree on boundaries", "What boundaries do we want for friendly, romantic or sexual exchanges with other people?", "Message frequency alone does not reveal the content. Do not secretly access accounts."], ["Your partner acknowledges a relationship with another person", "Choose what comes next", "I need to understand what happened and think about what I want next. Can we talk calmly?", "You can ask for time, separate or consider repair. Forgiveness cannot be demanded."], ["You often suspect cheating without new facts", "Understand your worry", "My worries keep coming back. Can we talk about what is feeding this insecurity?", "Separate present observations from fears and past experiences. Individual support may help."], ["Your conversation about fidelity turns into an argument", "Take a step back", "I would prefer a pause. Let’s return when we can speak without shouting.", "If you are afraid, threatened or prevented from leaving, prioritize safety and contact someone you trust."], ["You do not share the same agreement on exclusivity", "Clarify exclusivity", "What does our commitment mean to each of us today?", "Relationship agreements differ. Define accepted behavior and boundaries explicitly."], ["Your partner refuses to discuss your doubts", "Respect and personal needs", "I respect that you don’t want to discuss this now. When could we return to it?", "A refusal is not an admission. You can express your needs and decide whether the relationship works for you."], ["Your partner acknowledges deleting messages to hide them from you", "Acknowledged deletion, content to clarify", "You say you deleted these messages to hide them from me. What were they about, and which agreement does this affect?", "Concealment is acknowledged, not necessarily an affair. Deleting messages without established context may also be ordinary use."], ["Your partner tells you about an undisclosed messaging account", "A separate account, usage to clarify", "What is this account for, and what boundaries do we want for romantic exchanges with others?", "A work or private account is not proof. Discuss acknowledged use without forcing access."], ["Your partner acknowledges hidden emotional intimacy with someone", "An emotional bond and relationship boundaries", "What place does this relationship have, and what have we agreed about romantic or emotional bonds with others?", "A close friendship is not automatically cheating. Clarify romantic involvement, acknowledged secrecy and your agreements."], ["Your partner acknowledges using a dating app", "Current use, status and intention", "How are you currently using this app, and how does that fit our commitment?", "An old profile does not prove current use. Discuss acknowledged use according to your agreement without assuming physical meetings."], ["Your partner acknowledges inventing an outing or trip", "An acknowledged false account", "You acknowledge that explanation was invented. What happened, and what do I need to decide what comes next?", "The acknowledged lie concerns this specific account. It alone does not prove sex or another relationship."], ["Your partner admits online sexual exchanges but says “it’s only virtual”", "Define digital infidelity together", "For me, these exchanges affect our commitment. What boundaries did we think we had, and what do we want now?", "No physical contact does not settle the boundary question. Discuss acknowledged facts and your relationship agreements."], ["Your partner acknowledges hiding a spending item involving someone", "A financial secret, motive to understand", "What was this expense, and what agreement do we have about shared money and gifts?", "Hidden spending can be a financial problem without proving an affair. Do not control private accounts; discuss shared responsibilities."], ["Your partner acknowledges telling someone they are single", "Denying relationship status to another person", "You acknowledge saying you were single. What was the context, and what does that mean for our commitment?", "The acknowledged fact is the lie about relationship status. It does not confirm sex; discuss its consequences and your boundaries."]], "signs": [["Looking away", "Shyness, thinking, tiredness, discomfort or cultural habits may explain it.", "What would help you feel more comfortable talking?"], ["Crossed arms or closed posture", "Comfort, cold, tension or a need for distance.", "Would you like a different setting or a pause?"], ["Blushing or sweating", "Heat, exertion, stress or emotion.", "Do you need a moment?"], ["A shaky voice or hesitation", "Stress, fear of conflict, emotion or searching for words.", "Take your time. I’m listening."], ["Smiling or nervous laughter", "Discomfort, politeness or regulating tension.", "How are you experiencing this conversation?"], ["Anger or a defensive tone", "Feeling accused, frustration or disagreement.", "Can we continue in a calmer tone?"], ["Silence or short answers", "Tiredness, reflection or difficulty talking.", "Would you prefer to reply later or in writing?"], ["A change in physical closeness", "A need for space, tiredness, mood or relationship difficulties.", "What level of closeness feels right now?"], ["Messy hair or clothes", "Wind, travel, work or everyday activities.", "Appearance cannot establish recent sexual activity."], ["Faster breathing or heartbeat", "These physical reactions have many causes; they do not establish sexual activity.", "Do not measure your partner’s body to seek proof."], ["Lubrication or an erection", "A bodily response does not prove recent sex, desire for a particular person or consent.", "Ask for consent explicitly. It can be withdrawn."], ["Discharge, odor or bleeding", "Discharge can vary normally. Its appearance does not establish cheating.", "If a change or pain worries the person, they can seek medical advice. Do not perform inspections."], ["Hymen or genital appearance", "Hymen appearance cannot prove vaginal intercourse.", "No virginity testing. See the WHO statement under My context."], ["Brief facial expressions", "Expressions are ambiguous and context-dependent.", "Microexpressions are not a reliable lie detector."]], "dangerItems": [["Death threats or a weapon used to intimidate", "Words or actions that make you fear injury or death. You do not have to wait for an assault."], ["Pressure on the neck or suffocation", "Any restriction of breathing or pressure on the neck is serious, even without visible marks. Seek prompt medical assessment."], ["Control of movement and phone use", "Demanding passwords, location tracking or reports under threat goes beyond communication."], ["Isolation", "Preventing contact with friends, family, work or outside support reduces independence."], ["Sexual violence or coercion", "Forcing contact, continuing after a refusal or pressuring someone into sexual activity. A relationship never replaces consent."], ["Stalking after separation", "Following someone, repeated unwanted contact or repeatedly appearing at their regular locations."], ["Economic or administrative control", "Taking money or documents, blocking employment or using immigration status as a threat."], ["Repeated humiliation and intimidation", "Belittling, frightening, destroying property or threatening loved ones to obtain compliance."], ["Escalation", "More frequent violence, more specific threats or weapon use call for specialist support."], ["Disregard for boundaries", "Punishing a refusal, preventing departure or imposing one-sided rules through fear."]]}, "es": {"scenarios": [["Ves a tu pareja en un restaurante con alguien", "Una comida en compañía", "Te vi salir del restaurante con esa persona. ¿Cómo se conocen?", "Puede ser una salida amistosa, familiar, profesional o romántica. El lugar y el género de la persona no permiten concluir nada."], ["Ves a tu pareja salir de un hotel con alguien", "Aclarar el contexto", "Te vi salir de ese hotel con alguien. ¿En qué contexto estaban allí?", "Los hoteles acogen reuniones, visitas y estancias. Salir de uno no demuestra una relación sexual."], ["Alguien acaba de llevar a tu pareja en coche", "Alguien lleva a tu pareja", "¿Quién te trajo? ¿Cómo fue la salida?", "Compartir un viaje no demuestra una relación íntima."], ["Ves a tu pareja besar a alguien", "Comprobar lo observado", "Vi lo que parecía un beso en los labios. ¿Fue eso lo que pasó?", "Una visión lejana puede ser ambigua. Un beso romántico confirmado puede cruzar un límite acordado, pero no demuestra una relación sexual."], ["Tu pareja se niega a mostrar conversaciones privadas", "Privacidad y confianza", "Respeto tu privacidad. ¿Cómo podemos hablar de mis preocupaciones y de nuestros límites con otras personas?", "Negarse a una revisión del teléfono no demuestra infidelidad. El acceso debe ser libremente consentido, nunca impuesto."], ["Tu pareja sale sin explicar sus planes", "Comunicarse sin vigilar", "¿Podemos acordar avisarnos al salir y dar una hora aproximada de regreso?", "Busquen un acuerdo mutuo que respete la autonomía de cada persona."], ["Tu pareja se pone nerviosa durante la conversación", "Dar espacio al malestar", "Esta conversación parece incomodarte. ¿Es mi tono, el tema u otra cosa?", "El nerviosismo no detecta mentiras. Una pausa puede ayudar."], ["Tu pareja se arregla para una salida cotidiana", "Apariencia e interpretaciones", "Hoy elegiste un conjunto bonito. ¿Hay alguna ocasión especial?", "Arreglarse puede simplemente hacer sentir bien. No es una prueba fiable de infidelidad."], ["El relato de tu pareja contiene una contradicción", "Aclarar sin tender trampas", "Antes dijiste X y ahora Y. ¿Puedes ayudarme a entender la diferencia?", "La memoria, un malentendido o cambios de planes pueden explicar una diferencia. Céntrate en hechos concretos."], ["Tu pareja desea menos contacto íntimo", "Escuchar las necesidades", "¿Cómo te sientes con nuestra intimidad? ¿Necesitas algo?", "El deseo y la cercanía varían. Cualquiera puede rechazar un contacto sin tener que demostrar fidelidad."], ["Tu pareja intercambia muchos mensajes con alguien", "Acordar límites", "¿Qué límites queremos para los intercambios amistosos, románticos o sexuales con otras personas?", "La frecuencia de mensajes no revela su contenido. No accedas a cuentas a escondidas."], ["Tu pareja reconoce una relación con otra persona", "Elegir cómo seguir", "Necesito comprender lo ocurrido y pensar qué quiero hacer. ¿Podemos hablar con calma?", "Puedes pedir tiempo, separarte o considerar una reparación. El perdón no se exige."], ["Sospechas a menudo una infidelidad sin hechos nuevos", "Comprender la preocupación", "Mis preocupaciones vuelven a menudo. ¿Podemos hablar de lo que alimenta esta inseguridad?", "Distingue las observaciones actuales de los temores y experiencias pasadas. El apoyo individual puede ayudar."], ["La conversación sobre fidelidad se convierte en discusión", "Tomar distancia", "Prefiero hacer una pausa. Volvamos a hablar cuando podamos hacerlo sin gritar.", "Si tienes miedo, recibes amenazas o te impiden salir, prioriza tu seguridad y contacta a alguien de confianza."], ["No tienen el mismo acuerdo sobre exclusividad", "Aclarar la exclusividad", "¿Qué significa hoy nuestro compromiso para cada uno?", "Los acuerdos varían entre parejas. Definan explícitamente los comportamientos aceptados y los límites."], ["Tu pareja se niega a hablar de tus dudas", "Respeto y necesidades personales", "Respeto que no quieras hablar ahora. ¿Cuándo podríamos retomar la conversación?", "Negarse no es confesar. Puedes expresar tus necesidades y decidir si la relación te conviene."], ["Tu pareja reconoce haber borrado mensajes para ocultártelos", "Borrado reconocido, contenido por aclarar", "Dices que borraste esos mensajes para ocultármelos. ¿De qué trataban y qué acuerdo afecta esto?", "Se reconoce la ocultación, no necesariamente una aventura. Borrar mensajes sin contexto establecido también puede ser un uso cotidiano."], ["Tu pareja te habla de una cuenta de mensajería no declarada", "Otra cuenta, uso por aclarar", "¿Para qué sirve esta cuenta y qué límites queremos para los intercambios románticos con otras personas?", "Una cuenta laboral o privada no es una prueba. Hablen del uso reconocido sin forzar el acceso."], ["Tu pareja reconoce intimidad emocional oculta con alguien", "Un vínculo emocional y los límites de la pareja", "¿Qué lugar tiene esa relación y qué acordamos sobre vínculos románticos o emocionales con otras personas?", "Una amistad cercana no es automáticamente infidelidad. Aclaren el carácter romántico, el secreto reconocido y sus acuerdos."], ["Tu pareja reconoce usar una aplicación de citas", "Uso actual, estado e intención", "¿Cómo usas actualmente esta aplicación y cómo encaja con nuestro compromiso?", "Un perfil antiguo no demuestra uso actual. Hablen del uso reconocido según su acuerdo, sin suponer encuentros físicos."], ["Tu pareja reconoce haber inventado una salida o viaje", "Un relato falso reconocido", "Reconoces que esa explicación era inventada. ¿Qué pasó y qué necesito para decidir cómo seguir?", "La mentira reconocida concierne a ese relato concreto. No demuestra por sí sola sexo ni otra relación."], ["Tu pareja admite intercambios sexuales en línea pero dice «solo es virtual»", "Definir juntos la infidelidad digital", "Para mí, esos intercambios afectan nuestro compromiso. ¿Qué límites creíamos tener y qué queremos ahora?", "La ausencia de contacto físico no resuelve los límites. Hablen de los hechos reconocidos y de sus acuerdos."], ["Tu pareja reconoce ocultar un gasto relacionado con alguien", "Un secreto financiero, motivo por comprender", "¿Qué fue ese gasto y qué acuerdo tenemos sobre dinero compartido y regalos?", "Un gasto oculto puede ser un problema financiero sin demostrar una aventura. No controles cuentas privadas; hablen de responsabilidades compartidas."], ["Tu pareja reconoce haberse presentado como soltera", "Negar la relación ante otra persona", "Reconoces que dijiste estar sin pareja. ¿En qué contexto y qué significa para nuestro compromiso?", "El hecho reconocido es la mentira sobre el estado de pareja. No confirma sexo; hablen de sus consecuencias y límites."]], "signs": [["Desviar la mirada", "Timidez, reflexión, cansancio, incomodidad o hábitos culturales.", "¿Qué te ayudaría a hablar con más comodidad?"], ["Brazos cruzados o postura cerrada", "Comodidad, frío, tensión o necesidad de distancia.", "¿Prefieres otro lugar o una pausa?"], ["Rubor o sudor", "Calor, esfuerzo, estrés o emoción.", "¿Necesitas un momento?"], ["Voz temblorosa o vacilaciones", "Estrés, miedo al conflicto, emoción o búsqueda de palabras.", "Tómate tu tiempo. Te escucho."], ["Sonrisa o risa nerviosa", "Incomodidad, cortesía o regulación de la tensión.", "¿Cómo estás viviendo esta conversación?"], ["Enojo o tono defensivo", "Sentirse acusado, frustración o desacuerdo.", "¿Podemos seguir con un tono más tranquilo?"], ["Silencio o respuestas breves", "Cansancio, reflexión o dificultad para hablar.", "¿Prefieres responder más tarde o por escrito?"], ["Cambio de cercanía física", "Necesidad de espacio, cansancio, estado de ánimo o dificultades de pareja.", "¿Qué cercanía te resulta cómoda ahora?"], ["Cabello o ropa desordenados", "Viento, viajes, trabajo o actividades diarias.", "La apariencia no permite establecer una actividad sexual reciente."], ["Respiración o pulso acelerados", "Son reacciones físicas inespecíficas que no demuestran actividad sexual.", "No midas el cuerpo de tu pareja para buscar pruebas."], ["Lubricación o erección", "Una respuesta corporal no demuestra sexo reciente, deseo por alguien concreto ni consentimiento.", "El consentimiento se pide explícitamente y puede retirarse."], ["Secreciones, olor o sangrado", "Las secreciones pueden variar normalmente. Su aspecto no demuestra infidelidad.", "Si un cambio o dolor preocupa a la persona, puede consultar a un profesional. No realices inspecciones."], ["Himen o apariencia genital", "El aspecto del himen no permite demostrar relaciones vaginales.", "No a las pruebas de virginidad. Consulta la declaración de la OMS en Mi contexto."], ["Expresiones faciales breves", "Las expresiones son ambiguas y dependen del contexto.", "Las microexpresiones no detectan mentiras de forma fiable."]], "dangerItems": [["Amenazas de muerte o uso intimidatorio de armas", "Palabras o actos que hacen temer lesiones o la muerte. No hace falta esperar una agresión."], ["Presión en el cuello o asfixia", "Cualquier presión en el cuello o restricción de la respiración es grave, incluso sin marcas. Busca atención médica pronta."], ["Control de movimientos y teléfono", "Exigir contraseñas, ubicación o explicaciones bajo amenaza va más allá de comunicarse."], ["Aislamiento", "Impedir el contacto con familiares, amistades, el trabajo o apoyos externos reduce la autonomía."], ["Violencia o coacción sexual", "Forzar contacto, continuar tras una negativa o presionar para obtener actos sexuales. La pareja no sustituye el consentimiento."], ["Acoso después de una separación", "Seguir a la persona, insistir con contactos no deseados o aparecer repetidamente en sus lugares habituales."], ["Control económico o administrativo", "Retener dinero o documentos, impedir trabajar o amenazar con el estatus migratorio."], ["Humillación e intimidación repetidas", "Menospreciar, asustar, romper objetos o amenazar a seres queridos para obtener obediencia."], ["Escalada", "Violencia más frecuente, amenazas más concretas o uso de armas requieren apoyo especializado."], ["No respetar los límites", "Castigar una negativa, impedir salir o imponer reglas unilaterales mediante el miedo."]]}, "ht": {"scenarios": [["Ou wè patnè w nan restoran ak yon lòt moun", "Yon manje ansanm", "Mwen wè w ap soti nan restoran an ak moun sa a. Kijan nou konnen youn lòt?", "Se kapab yon sòti ant zanmi, fanmi, kòlèg oswa yon randevou damou. Kote a ak sèks moun nan pa sifi pou tire konklizyon."], ["Ou wè patnè w soti nan otèl ak yon lòt moun", "Klarifye sitiyasyon an", "Mwen wè w ap soti nan otèl sa a ak yon moun. Nan ki okazyon nou te la?", "Otèl resevwa reyinyon, vizit ak moun k ap pase nwit. Soti nan otèl pa pwouve te gen relasyon seksyèl."], ["Yon moun fèk depoze patnè w nan machin", "Yon moun mennen patnè w", "Kiyès ki mennen w? Kijan sòti a te pase?", "Pataje yon woulib pa pwouve yon relasyon entim."], ["Ou wè patnè w ap bo yon lòt moun", "Verifye sa ou wè", "Mwen wè sa ki te sanble yon bo sou bouch. Èske se sa ki te pase?", "Sa ou wè lwen ka pa klè. Yon bo damou ki konfime ka depase yon limit nou te dakò sou li, men li pa pwouve te gen sèks."], ["Patnè w refize montre konvèsasyon prive li yo", "Vi prive ak konfyans", "Mwen respekte vi prive w. Kijan nou ka pale sou enkyetid mwen ak limit nou genyen ak lòt moun?", "Refize fouye telefòn pa pwouve enfidelite. Moun nan dwe bay aksè lib, san fòse."], ["Patnè w soti san li pa esplike plan li yo", "Kominike san siveye", "Èske nou ka dakò pou n avèti youn lòt lè n ap soti epi bay yon lè retou apeprè?", "Chèche yon antant ki mache pou nou toude epi ki respekte endepandans chak moun."], ["Patnè w vin nève pandan konvèsasyon an", "Bay malèz la plas", "Sanble konvèsasyon sa a mete w malalèz. Èske se ton mwen, sijè a oswa yon lòt bagay?", "Lè yon moun nève, sa pa pwouve l ap bay manti. Yon poz ka ede."], ["Patnè w abiye byen pou yon sòti òdinè", "Aparans ak entèpretasyon", "Ou chwazi yon bèl rad jodi a. Èske gen yon okazyon espesyal?", "Abiye byen ka senpleman fè moun nan santi l byen. Sa pa prèv enfidelite."], ["Istwa patnè w rakonte a gen yon kontradiksyon", "Klarifye san pyèj", "Talè a ou te di X, kounye a ou di Y. Èske w ka ede m konprann diferans lan?", "Memwa, yon malantandi oswa chanjman plan ka esplike yon diferans. Rete sou enfòmasyon presi."], ["Patnè w vle mwens kontak entim", "Koute bezwen yo", "Kijan ou santi w ak entimite nou? Èske gen yon bagay ou bezwen?", "Dezi ak bezwen pwoksimite ka varye. Tout moun gen dwa refize kontak san yo pa bezwen pwouve fidelite yo."], ["Patnè w voye anpil mesaj ak yon moun", "Dakò sou limit yo", "Ki limit nou vle pou mesaj zanmitay, damou oswa seksyèl ak lòt moun?", "Kantite mesaj pa revele sa ki ladan yo. Pa antre nan kont moun nan an kachèt."], ["Patnè w rekonèt li gen yon relasyon ak yon lòt moun", "Chwazi sa k ap vini apre", "Mwen bezwen konprann sa ki pase a epi reflechi sou sa m vle fè. Èske nou ka pale ak kalm?", "Ou ka mande tan, separe oswa konsidere rebati relasyon an. Pèsonn pa ka fòse padon."], ["Ou sispèk enfidelite souvan san nouvo enfòmasyon", "Konprann enkyetid ou", "Enkyetid mwen yo toujou ap retounen. Èske nou ka pale sou sa ki lakòz ensekirite sa a?", "Separe sa ou wè kounye a ak laperèz oswa eksperyans pase. Sipò endividyèl ka ede."], ["Konvèsasyon sou fidelite a tounen diskisyon", "Pran distans", "Mwen ta pito fè yon poz. Ann reprann lè nou ka pale san rele.", "Si w pè, si yo menase w oswa anpeche w soti, mete sekirite w an premye epi kontakte yon moun ou fè konfyans."], ["Nou pa gen menm antant sou fidelite", "Klarifye fidelite a", "Kisa angajman nou vle di pou chak moun jodi a?", "Antant yo diferan selon koup la. Defini klèman konpòtman nou aksepte ak limit nou yo."], ["Patnè w refize pale sou dout ou yo", "Respè ak bezwen pèsonèl", "Mwen respekte ou pa vle pale kounye a. Kilè nou ta ka reprann konvèsasyon an?", "Refize pale pa yon konfesyon. Ou ka esplike bezwen w epi deside si relasyon an bon pou ou."], ["Patnè w rekonèt li te efase mesaj pou kache yo pou ou", "Li rekonèt efase yo, sa ki te ladan yo pou klarifye", "Ou di ou te efase mesaj sa yo pou kache yo pou mwen. Sou kisa yo te pale epi ki antant sa touche?", "Li rekonèt kache mesaj, sa pa nesesèman yon relasyon. Efase mesaj san kontèks klè ka yon abitid òdinè tou."], ["Patnè w pale w de yon kont mesaj li pa t mansyone", "Yon lòt kont, itilizasyon pou klarifye", "Pou kisa kont sa a sèvi epi ki limit nou vle pou mesaj damou ak lòt moun?", "Yon kont travay oswa prive pa prèv. Pale sou itilizasyon li rekonèt la san fòse aksè."], ["Patnè w rekonèt yon pwoksimite emosyonèl li te kache ak yon moun", "Lyen emosyonèl ak limit koup la", "Ki plas relasyon sa a genyen epi kisa nou te dakò sou lyen damou oswa emosyonèl ak lòt moun?", "Yon zanmitay sere pa otomatikman enfidelite. Klarifye si li gen damou ladan, sekrè li rekonèt la ak antant nou."], ["Patnè w rekonèt li sèvi ak yon aplikasyon pou rankont damou", "Itilizasyon aktyèl, estati ak entansyon", "Kijan w ap sèvi ak aplikasyon sa a kounye a epi kijan sa mache ak angajman nou?", "Yon ansyen pwofil pa pwouve itilizasyon kounye a. Pale sou sa li rekonèt la selon antant nou, san sipoze rankont fizik."], ["Patnè w rekonèt li te envante yon sòti oswa deplasman", "Yon fo istwa li rekonèt", "Ou rekonèt esplikasyon sa a te envante. Kisa ki te pase epi kisa m bezwen pou deside pwochen etap mwen?", "Manti li rekonèt la konsène istwa presi sa a. Li pa pwouve sèks oswa yon lòt relasyon pou kont li."], ["Patnè w admèt mesaj seksyèl sou entènèt men li di «se sèlman vityèl»", "Defini enfidelite sou entènèt ansanm", "Pou mwen, mesaj sa yo touche angajman nou. Ki limit nou te panse nou genyen epi kisa nou vle kounye a?", "Lè pa gen kontak fizik, sa pa regle kesyon limit yo. Pale sou zak li rekonèt ak antant koup la."], ["Patnè w rekonèt li kache yon depans ki gen rapò ak yon moun", "Sekrè sou lajan, rezon pou konprann", "Kisa depans sa a te ye epi ki antant nou genyen sou lajan pataje ak kado?", "Yon depans kache ka yon pwoblèm lajan san li pa pwouve relasyon damou. Pa kontwole kont prive; pale sou responsablite nou pataje."], ["Patnè w rekonèt li te di yon moun li selibatè", "Li nye relasyon an devan yon lòt moun", "Ou rekonèt ou te di ou selibatè. Nan ki kontèks epi kisa sa vle di pou angajman nou?", "Zak li rekonèt la se man ": "Ask what time and format work best.;Offer thinking time and a quiet setting, if preferred.;Allow speaking time, then take turns summarizing.;Ask what format works today without fixing a personality label.;Offer writing, without demanding immediate replies or private message access.;Ask one clear, respectful question at a time.", "wordAdvice": "Use short sentences and one question at a time.;Describe the fact, its effect on you and your specific request.;Choose a language both understand and check meaning by rephrasing.", "countryNoScore": "Country does not change the level of conclusion.", "contextQuestion": "What habits and boundaries matter to you in our relationship?", "safetyEyebrow": "Recognize concerning behavior", "safetyTitle": "Love should not make you afraid.", "safetyIntro": "These guides apply to every gender and orientation. They concern actions, not a “criminal type.” Appearance, culture and astrology cannot predict homicide.", "helpUS": "In the United States: immediate danger, call 911. Confidential support: 1-800-799-7233 or text START to 88788. Elsewhere, contact local services. Use a safe device if yours is monitored.", "helpTitle": "What support comes first?", "notAssessment": "This is not a validated clinical assessment. It does not diagnose anyone or predict violence. Answers are not saved.", "immediate": "Do you fear immediate danger, a weapon threat or being prevented from leaving?", "neck": "Has there recently been pressure on the neck or suffocation?", "control": "Are there threats, sexual coercion, forced monitoring or violence?", "yesNo": "I don’t know;Yes;No", "seeSteps": "See next steps", "ifAfraid": "If you are afraid", "safetyAdvice": "Do not seek a confession or confront the person alone. Seek individual specialist support.;Preparing a separation may involve a safe place, documents, transport and a trusted person, without increasing danger.;Do not use this journal if someone can read your browser. Closing a page does not erase history.;You are not responsible for someone else’s violence. One serious act is enough to seek help.", "behaviorsTitle": "Behaviors to take seriously", "observable": "Observable behavior", "historyTitle": "A documented case", "historyTag": "Clare Wood · England · 2009", "historyHeading": "A history of violence, not a physical profile", "historyText": "Clare Wood was killed by her former partner in 2009. Her case gave its name to “Clare’s Law,” a domestic abuse history disclosure scheme rolled out in England and Wales in 2014. This scheme is specific to that jurisdiction.", "historyLesson": "Documented history and current behavior can justify specialist support. Resemblance to an offender does not enable individual prediction.", "officialDoc": "Read the official UK document", "sourceDOJ": "US Justice Department: domestic violence", "sourceWarning": "The Hotline: warning signs", "sourceEscalation": "Escalation", "sourceStalking": "Stalking and safety planning", "sourceNeck": "NHS: neck injuries may have no visible marks", "reviewDate": "Sources checked October 17, 2026.", "noGuarantee": "No absence of positive answers guarantees safety.", "emergencyResult": "Immediate priority: reach a safe place if possible and call local emergency services (911 in the US). Do not delay the call to finish this questionnaire.", "neckResult": "Seek prompt medical assessment after pressure on the neck, even without marks. Breathing difficulty, loss of consciousness or neurological symptoms: emergency help immediately.", "controlResult": "Seek individual specialist support and a personalized safety plan. Do not confront your partner to test them.", "unknownResult": "This questionnaire cannot rule out danger. If afraid or uncertain, you can contact specialist support without evidence or certainty.", "contactHelp": "Contact confidential support in the United States", "unsavedWarning": "You have entered unsaved text. Changing language will clear unsaved fields. Continue?", "navGuide": "How to use", "helpTitleGuide": "One step at a time.", "guideIntro": "Choose what matches your needs. You do not have to complete every module.", "guideTitles": "1. Check your safety;2. Choose a situation;3. Read before talking;4. Follow the responses;5. Adapt to your context;6. Write or take a pause", "guideTexts": "If you are afraid, open Warning signs. In immediate danger, contact emergency services instead of starting a discussion.;In Explore, search for the observed situation: restaurant, hotel, kiss, phone, etc. Open Prepare the conversation.;Read the possible explanations and check your observation. Ask whether it is a good time, then use the suggested question.;Choose the category matching the response: explanation, specific contradiction, refusal or acknowledged boundary violation. Read the advice and choose the next step. The app does not verify the response.;In My context, describe known habits and communication preferences. Get adapted wording without a fidelity score.;In My journal, separate observation, interpretation, feelings and needs. Save, export or delete. In Take a pause, take a minute before continuing.", "guideScenario": "For every situation", "guideScenarioText": "Observation → Open question → Listen → Clarify if needed → Agreement or personal decision. A bodily reaction or refusal is not an admission.", "observedLabel": "What you observe", "conclusionLabel": "What this allows you to conclude", "doubtIntro": "Wondering whether your partner is cheating? Choose the scene you actually observed. The app helps you understand and discuss it; it does not detect infidelity.", "contextualLabel": "Understand in context", "confirmedLabel": "Acknowledged fact, boundaries to clarify", "communicationLabel": "Communication difficulty", "researchTitle": "Concealment: what research describes", "researchIntro": "The eight new scenes are educational examples written for this app around researched themes. They are neither reproduced participant accounts nor a diagnosti function entries(){try{const a=JSON.parse(localStorage.getItem('suppor-journal')||'[]');return Array.isArray(a)?a:[]}catch{return []}}function journal(){app.innerHTML=`<div class="eyebrow">${t('journalEyebrow')}</div><h1>${t('journalTitle')}</h1><p>${t('journalPrivacy')}</p><div class="twoCol"><form id="journalForm" class="card"><h2>${t('newNote')}</h2>${field('fact','fact')}${field('interpret','interpretation')}${field('feeling','feeling','select','feelings')}${field('need','need')}<div class="actions"><button class="primary" type="submit">${t('saveNote')}</button></div><p id="saveStatus" role="status"></p></form><section><h2>${t('myNotes')}</h2><div class="actions">${btn(t('export'),'exportNotes()')}${btn(t('clear'),'clearNotes()')}</div><div id="notes"></div></section></div>`;document.querySelector('#fact').required=true;listNotes();document.querySelector('#journalForm').onsubmit=e=>{e.preventDefault();const v=id=>document.querySelector('#'+id).value,n={date:new Date().toISOString(),fact:v('fact'),interpret:v('interpret'),feeling:arr('feelings')[+v('feeling')],feelingIndex:+v('feeling'),need:v('need')};try{localStorage.setItem('suppor-journal',JSON.stringify([n,...entries()]));e.target.reset();listNotes();document.querySelector('#saveStatus').textContent=t('saved')}catch{document.querySelector('#saveStatus').textContent=t('saveFailed')}}}
function feelingLabel(n){return Number.isInteger(n.feelingIndex)?arr('feelings')[n.feelingIndex]||n.feeling:n.feeling}function listNotes(){document.querySelector('#notes').innerHTML=entries().map((n,i)=>`<article class="card" style="margin-top:16px"><small>${esc(new Date(n.date).toLocaleString(localeTags[lang]))} · ${esc(feelingLabel(n))}</small><h3>${t('observation')}</h3><p class="user-text">${esc(n.fact)}</p><strong>${t('interpretShort')}</strong><p class="user-text">${esc(n.interpret)}</p><strong>${t('needShort')}</strong><p class="user-text">${esc(n.need)}</p>${btn(t('deleteNote'),`deleteNote(${i})`)}</article>`).join('')||`<p>${t('emptyNotes')}</p>`}function deleteNote(i){if(!confirm(t('confirmDelete')))return;try{const a=entries();a.splice(i,1);localStorage.setItem('suppor-journal',JSON.stringify(a));listNotes()}catch{alert(t('saveFailed'))}}function clearNotes(){if(confirm(t('confirmClear')))try{localStorage.removeItem('suppor-journal');listNotes()}catch{alert(t('saveFailed'))}}function exportNotes(){const a=entries();if(!a.length){alert(t('noExport'));return}const blob=new Blob([a.map(n=>`${new Date(n.date).toLocaleString(localeTags[lang])}\n${t('feeling')}: ${feelingLabel(n)}\n${t('observation')}: ${n.fact}\n${t('interpretShort')}: ${n.interpret}\n${t('needShort')}: ${n.need}`).join('\n\n———\n\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`soutien-affectif-journal-${lang}.txt`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function calm(){app.innerHTML=`<div class="eyebrow">${t('calmEyebrow')}</div><h1>${t('calmTitle')}</h1><div class="twoCol"><section class="card"><h2>${t('breatheTitle')}</h2><p>${t('breatheText')}</p><div id="timer" style="font:64px Georgia;margin:22px 0" role="status">60 s</div><button class="primary" id="timerBtn">${t('startMinute')}</button></section><section class="card"><h2>${t('selfQuestions')}</h2>${['self1','self2','self3'].map((k,i)=>`<p>${i+1}. ${t(k)}</p>`).join('')}<div class="note">${t('safetyPause')}</div>${btn(t('writeFeelings'),"navigate('journal')")}</section></div>`;document.querySelector('#timerBtn').onclick=e=>{e.target.disabled=true;let n=60;timerId=setInterval(()=>{n--;const el=document.querySelector('#timer');if(!el){clearInterval(timerId);return}el.textContent=n?n+' s':t('takeTime');if(!n){clearInterval(timerId);timerId=null;document.querySelector('#timerBtn').disabled=false;document.querySelector('#timerBtn').textContent=t('restart')}},1000)}}

function researchPanel(){return `<section id="research" style="margin-top:45px"><h2>${t('researchTitle')}</h2><p>${t('researchIntro')}</p><div class="grid">${RESEARCH.map(([author,key,url])=>`<article class="card"><h3>${author}</h3><p>${t(key)}</p><a href="${url}" target="_blank" rel="noopener">${t('sources')} ↗</a></article>`).join('')}</div><div class="note">${t('researchLimits')} ${t('noSnooping')}</div></section>`}
function researchForScenario(i){const r=RESEARCH[[0,1,2,2,1,2,3,1][i-16]];return `<p><strong>${t('studyContext')}:</strong> ${t(r[1])}</p><p><a href="${r[2]}" target="_blank" rel="noopener">${r[0]} ↗</a></p><p>${t('noSnooping')}</p>`}
shell();render();

// Compteur de présence anonyme : chaque onglet ouvert envoie un identifiant aléatoire
// (aucune donnée personnelle, aucun contenu du site) au broker MQTT public.
// La page stats.html compte les identifiants actifs. Si le broker est inaccessible, le site fonctionne normalement.
(function () {
  var BROKER = 'wss://broker.hivemq.com:8884/mqtt';
  var TOPIC = 'soutien-affectif-5b20042376e5/presence/';
  var HEARTBEAT_MS = 15000;
  if (typeof location === 'undefined' || !document.head || location.protocol === 'file:' || /[?&]nopresence\b/.test(location.search)) return;
  var id = Math.random().toString(36).slice(2, 12);
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js';
  s.async = true;
  s.onload = function () {
    try {
      var client = window.mqtt.connect(BROKER, {
        clientId: 'sa_' + id, clean: true, reconnectPeriod: 10000, connectTimeout: 10000,
        will: { topic: TOPIC + id, payload: '', qos: 0, retain: false }
      });
      var beat = function () {
        if (client.connected) client.publish(TOPIC + id, document.hidden ? 'hidden' : 'on');
      };
      client.on('connect', beat);
      client.on('error', function () {});
      setInterval(beat, HEARTBEAT_MS);
      document.addEventListener('visibilitychange', beat);
      window.addEventListener('pagehide', function () {
        try { client.publish(TOPIC + id, ''); client.end(true); } catch (e) {}
      });
    } catch (e) {}
  };
  document.head.appendChild(s);
})();
</script></body></html>
