esizyon pa w, e ou ka chanje lide."], "health": null, "support": ["Yon moun ou fè konfyans.", "Yon terapis koup oswa yon sikològ, ansanm oswa chak pou kont yo.", "Si manti a t ap kache yon dèt, jwèt aza oswa yon konsomasyon: yon asosyasyon oswa yon pwofesyonèl espesyalize.", "Si diskisyon an vin menasan oswa vyolan: gade «Siy danje»."], "next": ["Dakò sou sa chak moun bezwen konnen lè lòt la pa la, san kontwòl ni rapò fòse.", "Louvri yon dosye nan «Analize yon istwa» pou separe sa li rekonèt ak sa ou sipoze.", "Ekri desizyon ou ak kondisyon ou nan «Jounal mwen» pou ou li yo ak tèt frèt."], "studies": ["apostolou2022", "mazzini2025"], "links": ["recit", "journal", "pause", "danger"], "safety": true, "reviewed": false}, {"n": 22, "id": "online-sexual", "type": "aveu", "badge": "acknowledged", "title": "Patnè w admèt mesaj seksyèl sou entènèt men li di «se sèlman vityèl»", "subtitle": "Defini enfidelite sou entènèt ansanm", "conclude": "Li rekonèt echanj yo. Lefèt pa t gen kontak fizik pa regle kesyon limit yo. Gen koup ki aksepte echanj konsa, gen lòt ki pa aksepte. Limit lan depann de antant koup la, pa de yon règ jeneral (sitiyasyon 15).", "explanations": ["Kiryozite oswa rechèch eksitasyon, patnè w te wè kòm yon bagay san konsekans.", "Yon fason pou ranplase yon mank nan entimite koup la, san li pa pale de sa.", "Echanj ki dire ak yon moun presi, ki tounen yon lyen.", "Echanj ki te mennen, oswa ki te dwe mennen, nan rankont.", "Yon antant eksklizivite koup la pa t janm diskite pou entènèt, chak moun konprann yon lòt jan (gade sitiyasyon 15)."], "clarify": ["Mande sou ki peryòd, ak youn oswa plizyè moun, e si echanj sa yo toujou ap kontinye.", "Mande si te gen rankont, oswa si yo te planifye youn. Sa konsène sante w dirèkteman.", "Di ki kote limit ou ye. Ou pa oblije pwouve li «rezonab»."], "avoid": ["Li konvèsasyon yo, rekipere foto oswa montre yo yon moun: pataje kontni entim ka ilegal.", "Kontakte moun patnè w te ekri yo.", "Fèmen tèt ou nan yon deba sou definisyon twonpri olye ou pale de antant koup la."], "firstHours": ["Chòk, degou, konparezon oswa dout sou tèt ou, se reyaksyon ki souvan rive e ki lejitim.", "Ou ka mande tan: «Mwen bezwen rete pou kont mwen aswè a.»", "Manje, dòmi si ou kapab, rele yon moun ou fè konfyans. Sèvi ak «Fè yon poz» si emosyon an twò fò."], "question": "Pou mwen, echanj sa yo touche angajman nou. Ki limit nou te panse nou genyen, e kisa chak nan nou vle kounye a?", "answers": [{"label": "«Se sèlman vityèl, se pa twonpe»", "advice": "Petèt ou pa gen menm limit. Pa chèche kiyès ki gen rezon: nonmen pa w la epi klarifye antant koup la (sitiyasyon 15).", "followUp": "Pou ou, se pa twonpe. Pou mwen, sa touche angajman nou. Fòk nou dakò sou limit nou."}, {"label": "Echanj ki fini, ak regrè", "advice": "Ou ka kwè l oswa non: toude chwa yo valab. Mande sa patnè w te bezwen, ak sa ki ta ede w reprann konfyans.", "followUp": "Kisa ou t ap chèche nan echanj sa yo? E kijan ou gen entansyon asire ke yo fini?"}, {"label": "Rankont, oswa rankont ki te planifye", "advice": "Sitiyasyon an chanje nati. Ou ka mande si te gen relasyon seksyèl e si yo te pwoteje. Gade tou sitiyasyon 12.", "followUp": "Mwen bezwen konnen, pou sante m: èske ou te wè moun nan, e èske te gen relasyon seksyèl?"}, {"label": "Wont oswa kòlè, ton an ap monte", "advice": "Wont ka tounen yon fason pou defann tèt li. Pa kontinye anba tansyon: pwopoze «Fè yon poz».", "followUp": "Mwen pa ap chèche imilye w. Ann fè yon poz epi n a reprann lè nou ka pale ak kalm."}, {"label": "Li refize pale de sa", "advice": "Refi sa a pa yon konfesyon anplis. Respekte l pou aswè a, epi di sa ou ap bezwen pou deside.", "followUp": "Dakò pou aswè a. Men limit nou konsène m tou: m ap bezwen nou pale de sa ankò."}], "shock": ["Sa ou santi a lejitim, menm san kontak fizik.", "Pa gen yon reyaksyon «kòrèk» pou kalite dekouvèt sa a. Evite sèlman zak ou ta regrèt: menas, vyolans, pataje kontni."], "decide": ["Pran tan anvan ou deside, petèt dòmi apa pandan kèk jou.", n antant."], "avoid": ["Kontwole kont prive, relve oswa aplikasyon labank patnè w san dakò li.", "Kontakte moun ki te benefisye depans lan.", "Konkli gen yon relasyon kache sèlman apati depans lan."], "firstHours": ["Santi yo trayi w, enkyete pou bidjè a oswa santi w imilye, se reyaksyon ki nòmal.", "Si bidjè komen an touche, ekri fè li rekonèt yo (montan, peryòd) nan «Jounal mwen», san sipozisyon.", "Tann ou pi kalm pou pale de sa. Sèvi ak «Fè yon poz» si emosyon an twò fò."], "question": "Ou rekonèt ou te kache m depans sa a. Èske ou ka di m pou kisa li te ye, e ki antant nou genyen sou lajan pataje ak kado?", "answers": [{"label": "Yon èd pou yon fanmi oswa yon zanmi", "advice": "Resevwa eksplikasyon an. Pale de sekrè a ak règ lajan komen yo, san ou pa jije moun li te ede a.", "followUp": "Mwen konprann ou te vle ede. Pwochen fwa, kijan nou ka deside ansanm pou yon depans konsa?"}, {"label": "Yon depans li kache paske li te jennen oswa li te pè yon repwòch", "advice": "Sekrè a touche konfyans ak bidjè a. Chèche yon règ klè, ki valab pou toude, pou gwo depans yo.", "followUp": "Mwen pito nou ka di youn lòt bagay yo, menm sa ki jennen. Apati ki montan nou vle pale de sa anvan?"}, {"label": "Kado pou yon moun li gen yon relasyon avè l", "advice": "Se yon lòt kesyon pase lajan. Pran tan pou absòbe sa, ou pa gen anyen pou deside kounye a. Gade sitiyasyon 12.", "followUp": "Mwen bezwen tan pou m reflechi. N a pale de sa ankò lè m pare."}, {"label": "Kòlè («se lajan pa m»)", "advice": "Chak moun ka kenbe yon pati otonomi. Retounen sou sa ki komen ak sou sekrè a, pa sou kontwòl. Si ton an monte, fè yon poz.", "followUp": "Mwen pa vle kontwole lajan ou. Mwen vle nou klè sou sa ki komen. Èske n a pale de sa ak kalm?"}, {"label": "Li refize esplike", "advice": "Refi sa a pa yon konfesyon relasyon. Respekte l pou kounye a, epi di lajan komen an ap mande yon diskisyon.", "followUp": "Dakò, pa kounye a. Men lajan komen an konsène nou tou de: n ap gen pou n pale de sa ankò."}], n zak ou ta regrèt: menas, vyolans, mesaj bay moun nan."], "decide": ["Pran tan anvan ou deside, petèt dòmi apa pandan kèk jou.", "Kontinye relasyon an ak kondisyon klè (fen echanj ki pa klè, plas koup la asime devan lòt moun, terapi).", "Mete fen nan relasyon an.", "Pa gen okenn chwa ki pi bon: se desizyon pa w, e ou ka chanje lide."], "health": "Si te gen relasyon seksyèl ak lòt moun, li bon pou ou ak patnè w fè tès depistaj IST (enfeksyon seksyèlman transmisib). Sa vo kèlkeswa desizyon ou. Yon sant sante oswa yon doktè ka fè l an konfidans.", "support": ["Yon moun ou fè konfyans.", "Yon terapis koup oswa yon sikològ, ansanm oswa chak pou kont yo.", "Si diskisyon an vin menasan oswa vyolan: gade «Siy danje»."], "next": ["Pale de plas chak moun vle bay koup la devan lòt moun.", "Klarifye antant eksklizivite koup la ak sa li vle di nan rankont (sitiyasyon 15).", "Ekri desizyon ou ak kondisyon ou nan «Jounal mwen» pou ou li yo ak tèt frèt."], "studies": [], "links": ["journal", "pause", "danger"], "safety": true, "reviewed": false}]}}; const UI={"fr": {"navHome": "Doutes de tromperie", "navSigns": "Corps & expressions", "navSafety": "Signaux de danger", "navContext": "Mon contexte", "navJournal": "Mon journal", "navCalm": "Faire une pause", "navigation": "Navigation principale", "language": "Langue", "footer": "Pour toutes les personnes et tous les couples · Des faits, de l’écoute, des limites partagées.", "heroEyebrow": "Votre histoire mérite une vraie conversation", "heroTitle": "Et si on se comprenait mieux ?", "heroText": "Une situation vous trouble ? Préparez une conversation respectueuse, explorez plusieurs explications et posez vos limites.", "heroButton": "On en parle ? →", "photoAlt": "Un couple partage un sourire et un moment de complicité sur un canapé.", "photoBadge": "Se retrouver commence par un mot.", "noVerdict": "Aucun geste, expression ou questionnaire ne prouve une infidélité ou un rapport sexuel. Cette application aide à dialoguer, sans score de s emandez une aide individuelle spécialisée.;Préparer une séparation peut demander un lieu sûr, des documents, un transport et une personne de confiance, sans accroître le danger.;N’écrivez pas dans ce journal si quelqu’un peut lire votre navigateur. Fermer une page n’efface pas l’historique.;Vous n’êtes pas responsable de la violence de l’autre. Un acte grave suffit pour demander de l’aide.", "behaviorsTitle": "Les comportements à prendre au sérieux", "observable": "Comportement observable", "historyTitle": "Une affaire documentée", "historyTag": "Clare Wood · Angleterre · 2009", "historyHeading": "Des antécédents de violence, pas un profil physique", "historyText": "Clare Wood a été tuée par son ancien partenaire en 2009. Son affaire a donné son nom à « Clare’s Law », dispositif de divulgation d’antécédents de violences conjugales déployé en Angleterre et au pays de Galles en 2014. Ce dispositif est propre à cette juridiction.", "historyLesson": "Les antécédents documentés et les comportements actuels peuvent justifier une aide spécialisée. Une ressemblance avec un auteur de crime ne permet pas une prédiction individuelle.", "officialDoc": "Lire le document officiel britannique", "sourceDOJ": "Justice américaine : violences conjugales", "sourceWarning": "The Hotline : signaux d’abus", "sourceEscalation": "Escalade", "sourceStalking": "Harcèlement et plan de sécurité", "sourceNeck": "NHS : lésions du cou, parfois sans marques", "reviewDate": "Sources consultées le 17 octobre 2026.", "noGuarantee": "Aucune absence de réponse positive ne garantit la sécurité.", "emergencyResult": "Priorité immédiate : rejoignez un endroit sûr si possible et appelez les secours locaux (911 aux États-Unis). Ne retardez pas l’appel pour terminer ce questionnaire.", "neckResult": "Demandez rapidement une évaluation médicale après une pression sur le cou, même sans marque. Difficulté à respirer, perte de connaissance ou trouble neurologique : secours immédiatement.", "controlResult": "Deman ve this module. Only journal notes are stored locally.", "contextResultTitle": "A proportionate conclusion", "contextResultIntro": "The result describes what is known and what needs discussion, without fidelity ratings or invented percentages.", "possibleNote": "“Possible” does not mean “probable.” “Confirmed” concerns only a specific fact, never a deduction from the body or a profile.", "cultureTitle": "India, the United States… and your story", "cultureIntro": "There is no single relationship model for any country. Instead, ask:", "cultureQuestions": "What role should our families have?;What public affection feels comfortable for you?;How do we define friendship, flirting and a crossed boundary?;What private space would you like to keep?", "sources": "References and sources", "sourceWHO": "WHO: virginity testing has no scientific validity", "sourceNHS": "NHS: vaginal discharge", "sourceReview": "Review: limits of nonverbal cues", "qualitative": "Qualitative guidance · No percentage", "levels": "Insufficient information;Situation needs clarification;Statements need clarification;Specific fact reported as confirmed", "levelTexts": "These elements do not establish cheating or sexual activity.;Different explanations remain possible. Describe your observation and ask for context.;Repeat the exact statements. A contradiction alone does not confirm cheating.;The app does not verify your account. Confirmation is limited to the described fact, with no deductions about other events.", "styleAdvice": "Ask what time and format work best.;Offer thinking time and a quiet setting, if preferred.;Allow speaking time, then take turns summarizing.;Ask what format works today without fixing a personality label.;Offer writing, without demanding immediate replies or private message access.;Ask one clear, respectful question at a time.", "wordAdvice": "Use short sentences and one question at a time.;Describe the fact, its effect on you and your specific request.;Choose a language both understand and check meaning by rephrasing.", "countryNoScore": "Country does not change the level of conclusion.", "contextQuestion": "What habits and boundaries matter to you in our relationship?", "safetyEyebrow": "Recognize concerning behavior", "safetyTitle": "Love should not make you afraid.", "safetyIntro": "These guides apply to every gender and orientation. They concern actions, not a “criminal type.” Appearance, culture and astrology cannot predict homicide.", "helpUS": "In the United States: immediate danger, call 911. Confidential support: 1-800-799-7233 or text START to 88788. Elsewhere, contact local services. Use a safe device if yours is monitored.", "helpTitle": "What support comes first?", "notAssessment": "This is not a validated clinical assessment. It does not diagnose anyone or predict violence. Answers are not saved.", "immediate": "Do you fear immediate danger, a weapon threat or being prevented from leaving?", "neck": "Has there recently been pressure on the neck or suffocation?", "control": "Are there threats, sexual coercion, forced monitoring or violence?", "yesNo": "I don’t know;Yes;No", "seeSteps": "See next steps", "ifAfraid": "If you are afraid", "safetyAdvice": "Do not seek a confession or confront the person alone. Seek individual specialist support.;Preparing a separation may involve a safe place, documents, transport and a trusted person, without increasing danger.;Do not use this journal if someone can read your browser. Closing a page does not erase history.;You are not responsible for someone else’s violence. One serious act is enough to seek help.", "behaviorsTitle": "Behaviors to take seriously", "observable": "Observable behavior", "historyTitle": "A documented case", "historyTag": "Clare Wood · England · 2009", "historyHeading": "A history of violence, not a physical profile", "historyText": "Clare Wood was killed by her former partner in 2009. Her case gave its name to “Clare’s Law,” a domestic abuse history disclosure sche ès vijinite pa gen baz syantifik", "sourceNHS": "NHS: sekresyon vajinal", "sourceReview": "Revizyon: limit siy ki pa vèbal", "qualitative": "Gid kalitatif · San pousantaj", "levels": "Enfòmasyon pa sifi;Sitiyasyon pou klarifye;Pawòl pou klarifye;Yon zak presi ou rapòte kòm konfime", "levelTexts": "Eleman sa yo pa ka pwouve enfidelite ni aktivite seksyèl.;Plizyè esplikasyon posib. Dekri sa ou wè epi mande kontèks la.;Repete pawòl egzak yo. Yon kontradiksyon pou kont li pa konfime enfidelite.;Aplikasyon an pa verifye istwa w. Konfimasyon an limite ak zak ou dekri a, san devine lòt bagay.", "styleAdvice": "Mande ki lè ak ki fason ki pi bon.;Pwopoze tan pou reflechi ak yon kote kalm, si li pito sa.;Bay tan pou pale, apre sa repete sa nou konprann youn apre lòt.;Mande ki fason ki bon jodi a, san kole etikèt sou moun nan.;Pwopoze ekri, san egzije repons touswit ni aksè nan mesaj prive.;Poze yon sèl kesyon klè ak respè chak fwa.", "wordAdvice": "Sèvi ak fraz kout epi yon kesyon chak fwa.;Dekri zak la, efè li sou ou ak demann presi ou.;Chwazi yon lang nou toude konprann epi verifye sans lan ak pwòp mo nou.", "countryNoScore": "Peyi a pa chanje nivo konklizyon an.", "contextQuestion": "Ki abitid ak limit ki enpòtan pou ou nan relasyon nou?", "safetyEyebrow": "Rekonèt konpòtman ki bay enkyetid", "safetyTitle": "Lanmou pa dwe fè w pè.", "safetyIntro": "Gid sa yo konsène tout moun ak tout oryantasyon. Yo pale sou zak, pa yon «tip kriminèl». Aparans, kilti ak astwoloji pa ka predi yon asasina.", "helpUS": "Ozetazini: danje imedya, rele 911. Èd konfidansyèl: 1-800-799-7233 oswa voye START pa SMS nan 88788. Lòt kote, kontakte sèvis lokal yo. Sèvi ak yon aparèy ki an sekirite si y ap siveye pa w la.", "helpTitle": "Ki èd pou chèche an premye?", "notAssessment": "Sa a pa yon echèl klinik valide. Li pa fè dyagnostik moun ni predi vyolans. Repons yo pa anrejistre.", "immediate": "Èske w pè yon danje imedya, menas ak zam oswa yo anpeche w soti?", "neck": "Èske dènyèman te gen presyon n ze ak yon plan sekirite pou sitiyasyon pa w. Pa konfwonte patnè w pou teste l.", "unknownResult": "Kesyonè sa a pa ka di pa gen danje. Si w pè oswa ou pa sèten, ou ka kontakte èd espesyalize san prèv ni sètitid.", "contactHelp": "Kontakte èd konfidansyèl Ozetazini", "unsavedWarning": "Ou gen tèks ki poko anrejistre. Chanje lang ap efase chan ou poko anrejistre yo. Kontinye?", "navGuide": "Kijan pou itilize", "helpTitleGuide": "Yon etap chak fwa.", "guideIntro": "Chwazi sa ki mache ak bezwen w. Ou pa oblije fini tout modil yo.", "guideTitles": "1. Verifye sekirite w;2. Chwazi yon sitiyasyon;3. Li anvan w pale;4. Swiv repons yo;5. Adapte ak kontèks la;6. Ekri oswa fè yon poz", "guideTexts": "Si w pè, ouvri Siy danje. Si danje a imedya, kontakte ijans olye w kòmanse yon diskisyon.;Nan Eksplore, chèche sitiyasyon ou wè a: restoran, otèl, bo, telefòn, elatriye. Ouvri Prepare konvèsasyon an.;Li esplikasyon posib yo epi verifye sa ou obsève. Mande si se yon bon moman, apre sa sèvi ak kesyon yo pwopoze a.;Chwazi kategori ki dekri repons lan: esplikasyon, kontradiksyon presi, refi oswa limit li rekonèt li depase. Li konsèy la epi chwazi pwochen etap la. Aplikasyon an pa verifye repons lan.;Nan Kontèks mwen, mete abitid ou konnen ak fason nou pito kominike. Jwenn pawòl ki adapte, san nòt fidelite.;Nan Jounal mwen, separe sa ou obsève, sa ou panse, sa ou santi ak bezwen w. Anrejistre, ekspòte oswa efase. Nan Fè yon poz, pran yon minit anvan ou reprann.", "guideScenario": "Pou chak sitiyasyon", "guideScenarioText": "Obsèvasyon → Kesyon ouvè → Koute → Klarifye si sa nesesè → Antant oswa desizyon pèsonèl. Yon reyaksyon kò oswa refi pa yon konfesyon.", "observedLabel": "Sa ou obsève", "conclusionLabel": "Sa ou ka konkli", "doubtIntro": "Ou ap mande si patnè w ap twonpe w? Chwazi sa ou te obsève vre. Aplikasyon an ede w konprann sitiyasyon an epi pale sou li; li pa detekte enfidelite.", "contextualLabel": "Pou konprann nan kontèks li", "confirmedLabel": "Zak li rekonèt, limit pou k /* ===== Fiches enrichies « Doutes de tromperie » =====
   CONTENT[lang].fiches[i] (même index que CONTENT[lang].scenarios) : rubriques, réponses propres à la fiche,
   liens internes, études. Une fiche absente ou incomplète garde l'affichage d'origine. */
const STUDY_IDX = { apostolou2022: 0, mazzini2025: 1, mcdaniel2017: 2, dew2022: 3 };
const FICHE_LABEL = { doute: 'contextualLabel', communication: 'communicationLabel', aveu: 'confirmedLabel' };

function fiche(i) {
  const f = (content().fiches || [])[i];
  return f && f.type && Array.isArray(f.answers) && f.answers.length ? f : null;
}
function ficheLabel(i) {
  const f = fiche(i);
  return f ? FICHE_LABEL[f.type] : i >= 16 ? 'newLabel' : i === 11 ? 'confirmedLabel' : [8, 12, 13, 14, 15].includes(i) ? 'communicationLabel' : 'contextualLabel';
}
function ficheList(arr) { return arr && arr.length ? `<ul>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''; }
function ficheBlock(key, arr) { return arr && arr.length ? `<h3>${t(key)}</h3>${ficheList(arr)}` : ''; }

/** Opens « Mon journal » with a note that starts with the title of the situation. */
function openJournal(title) {
  navigate('journal');
  const el = document.querySelector('#fact');
  if (el) { el.value = title + ' — '; if (el.focus) el.focus(); }
}
function ficheGo(kind) {
  const s = content().scenarios[chosen], f = fiche(chosen), title = (f && f.title) || s[0];
  if (kind === 'recit') recitNewFrom(title);
  else if (kind === 'journal') openJournal(title);
  else if (kind === 'danger') navigate('safety');
  else if (kind === 'pause') navigate('calm');
  else if (kind === 'contexte') navigate('context');
}
function ficheLinks(f) {
  const label = { recit: 'linkRecit', journal: 'linkJournal', danger: 'navSafety', pause: 'navCalm', contexte: 'navContext' };
  const links = (f.links || []).filter((k) => label[k]);
  return links.length ? `<h3>${t('linksTitle')}</h3><div class="actions">${links.map((k) => btn(t(label[k]), `ficheGo('${k}')`)).join('')}</div>` : '';
}
function ficheStudies(f) {
  const ids = (f.studies || []).filter((k) => k in STUDY_IDX);
  if (!ids.length) return '';
  return `<section class="card fiche-research"><h3>${t('researchSays')}</h3>${ids.map((k) => {
    const [author, key, url] = RESEARCH[STUDY_IDX[k]];
    return `<p><strong>${esc(author)}</strong> — ${t(key)} <a href="${url}" target="_blank" rel="noopener">↗</a></p>`;
  }).join('')}<p><small>${t('researchLimits')}</small></p></section>`;
}

function fichePath(s, f) {
  const aveu = f.type === 'aveu';
  const left = `<section>
    <div class="eyebrow">${t('pathEyebrow')}</div>
    ${f.safety ? `<div class="note fiche-safety">${t('safetyBanner')} ${btn(t('navSafety'), "navigate('safety')")}</div>` : ''}
    ${f.reviewed === false ? `<div class="note">${t('reviewPending')}</div>` : ''}
    <div class="tag" style="margin-top:20px">${t(FICHE_LABEL[f.type])}</div>
    <h1 class="scenario-title">${esc(f.title || s[0])}</h1><p>${esc(f.subtitle || s[1])}</p>
    <h3>${t('conclusionLabel')}</h3><p>${esc(f.conclude || s[3])}</p>
    ${ficheBlock('explanationsLabel', f.explanations)}
    ${ficheBlock('clarifyLabel', f.clarify)}
    ${ficheBlock('avoidLabel', f.avoid)}
    ${f.firstHours && f.firstHours.length ? `<details class="fiche-first"><summary>${t('firstHoursLabel')}</summary>${ficheList(f.firstHours)}</details>` : ''}
    ${aveu ? ficheBlock('shockLabel', f.shock) + (f.health ? `<h3>${t('healthLabel')}</h3><p>${esc(f.health)}</p>` : '') + ficheBlock('decideLabel', f.decide) + ficheBlock('supportLabel', f.support) : ''}
    ${ficheLinks(f)}
    <div class="note">${t('rights')}</div>
    ${ficheStudies(f)}
  </section>`;
  const right = `<section class="card"><div class="step">${t('step')} ${step + 1} / 3</div>${
    step === 0 ? `<h2>${t('chooseMoment')}</h2>${quote(t(aveu ? 'openingAveu' : 'opening'))}<div class="actions">${btn(t('yesContinue'), 'next()', true)}${btn(t('notNow'), "answer('later')")}${btn(t('rising'), "navigate('calm')")}</div>`
    : step === 1 ? `<h2>${t('askTitle')}</h2>${quote(f.question || s[2])}<p>${t('listen')}</p><div class="actions">${f.answers.map((a, k) => btn(a.label, `ficheAnswer(${k})`)).join('')}</div>`
    : `<h2>${t(aveu ? 'decideTitle' : 'nextTitle')}</h2>${aveu ? ficheList(f.decide) : ''}${f.next && f.next.length ? `<h3>${t('nextIdeas')}</h3>${ficheList(f.next)}` : ''}<p>${t('freeAgreement')}</p>
      <div class="actions">${btn(t('writeFeelings'), `openJournal(${JSON.stringify(f.title || s[0]).replace(/"/g, '&quot;')})`)}${btn(t('navCalm'), "navigate('calm')")}${btn(t('finish'), "navigate('home')")}</div>`
  }<div id="pathResult" aria-live="polite"></div></section>`;
  return `${btn(t('back'), "navigate('home')")}<div class="twoCol" style="margin-top:28px">${left}${right}</div>`;
}
function ficheAnswer(k) { answerKey = 'f' + k; ficheResult(k); }
function ficheResult(k) {
  const f = fiche(chosen), a = f && f.answers[k];
  if (!a) return;
  document.querySelector('#pathResult').innerHTML = `<div class="result"><strong>${esc(a.label)}</strong><p>${esc(a.advice)}</p>

   Données locales (localStorage + IndexedDB pour l'audio accepté). Analyse locale transparente :
   l'app propose, l'utilisateur confirme. Aucun score de mensonge ou de sincérité. */
const RECIT_KEY = 'soutien-recit-v1';
const R = (k) => (RECIT[lang] && RECIT[lang][k]) ?? RECIT.fr[k] ?? k;
const RL = (k, l) => (RECIT[l] && RECIT[l][k]) ?? RECIT.fr[k] ?? k;
const NATURES = ['obs', 'report', 'doc', 'interp', 'suspicion'];
const STATUSES = ['unverified', 'partial', 'corroborated', 'contradicted', 'unverifiable'];

/* ---------- stockage ---------- */
function recitLoad() {
  try { return JSON.parse(localStorage.getItem(RECIT_KEY)) || { dossiers: [] }; } catch { return { dossiers: [] }; }
}
function recitSave(db) {
  try { localStorage.setItem(RECIT_KEY, JSON.stringify(db)); return true; } catch { alert(R('saveFailed')); return false; }
}
function recitUid(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
function recitGet(db, id) { return db.dossiers.find((d) => d.id === id); }
function recitBump(d) { d.version = (d.version || 0) + 1; d.updated = new Date().toISOString(); }
function recitDate(iso) { try { return new Date(iso).toLocaleString(localeTags[lang]); } catch { return iso; } }

function recitIdb(fn) {
  return new Promise((ok, ko) => {
    try {
      const rq = indexedDB.open('soutien-recit-audio', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('audio');
      rq.onsuccess = () => { const tx = rq.result.transaction('audio', 'readwrite'); fn(tx.objectStore('audio'), ok); tx.onerror = () => ko(tx.error); };
      rq.onerror = () => ko(rq.error);
    } catch (e) { ko(e); }
  });
}
const recitAudioPut = (id, blob) => recitIdb((s, ok) => { s.put(blob, id); ok(); });
const recitAudioGet = (id) => recitIdb((s, ok) => { const r = s.get(id); r.onsuccess = () => ok(r.result); });
const recitAudioDel = (id) => recitIdb((s, ok) => { s.delete(id); ok(); });

const DAYS = {
  fr: ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'],
  en: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'],
  es: ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'],
  ht: ['lendi', 'madi', 'mèkredi', 'jedi', 'vandredi', 'samdi', 'dimanch'],
};

function norm(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, ''); }
function hasTerm(text, term) {
  const t = norm(text), w = norm(term);
  return new RegExp('(^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(t);
}
function findTerms(text, list) {
  const seen = new Set();
  const found = (list || []).filter((w) => hasTerm(text, w) && !seen.has(norm(w)) && seen.add(norm(w)));
  // keep the longest expression only (« plus tard » makes « tard » redundant); spelling variants were merged above
  return found.filter((w) => !found.some((o) => norm(o).length > norm(w).length && hasTerm(o, w)));
}

/** Détection simple de langue (mots fréquents) — toujours confirmée par l'utilisateur. */
function detectLang(text) {
  const words = norm(text).split(/[^a-z']+/).filter(Boolean);
  if (words.length < 3) return null;
  let best = null, bestScore = 0;
  for (const l of ANSWER_LANGS) {
    const set = new Set(norm(LEX.stop[l]).split(' '));
    const score = words.filter((w) => set.has(w)).length / words.length;
    if (score > bestScore) { bestScore = score; best = l; }
  }
  return bestScore >= 0.12 ? best : null;
}

/** Repères factuels extraits d'une phrase : heures, dates, jours, nombres. */
const reEsc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const HOUR_TXT = '\\d{1,2}\\s*(?:h|:|heures?|hours?|horas?|e)?\\s*(?:\\d{2})?(?:\\s*(?:am|pm))?';
function facts(text, l, raw) {
  const out = { times: [], dates: [], days: [], numbers: [] };
  let t = norm(text);
  if (!raw) for (const m of LEX.habitual.map(norm)) {
    t = t.replace(new RegExp(reEsc(m) + '\\s*(?:a|vers|at|a las|nan)?\\s*' + HOUR_TXT, 'g'), ' ');
    t = t.replace(new RegExp(HOUR_TXT + '\\s*' + reEsc(m), 'g'), ' ');
  }
  // Haitian Creole writes hours as « 9è » (norm() removes the accent → « 9e »); elsewhere « 9e » would be an ordinal
  const hour = l === 'ht' ? /\b(\d{1,2})\s*(?:h|:|heures?|hours?|horas?|e)\s*(\d{2})?\b/g : /\b(\d{1,2})\s*(?:h|:|heures?|hours?|horas?)\s*(\d{2})?\b/g;
  for (const m of t.matchAll(hour)) out.times.push(m[1].padStart(2, '0') + ':' + (m[2] || '00'));
  for (const m of t.matchAll(/\b(\d{1,2})\s*(am|pm)\b/g)) { let h = +m[1] % 12; if (m[2] === 'pm') h += 12; out.times.push(String(h).padStart(2, '0') + ':00'); }
  for (const m of t.matchAll(/\b(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?\b/g)) out.dates.push(m[1].padStart(2, '0') + '/' + m[2].padStart(2, '0'));
  for (const l of ANSWER_LANGS) for (const d of DAYS[l]) if (hasTerm(text, d)) out.days.push(DAYS.fr[DAYS[l].indexOf(d)]);
  for (const m of t.matchAll(/\b(\d+)\b/g)) out.numbers.push(m[1]);
  return out;
}
const DAY_WORDS = new Set(Object.values(DAYS).flat().map(norm));
// approximation / time words never show that two claims describe the same action (« vers 18 h » / « vers 20 h »)
['vers', 'environ', 'pres', 'heure', 'heures', 'soir', 'matin', 'nuit', 'around', 'about', 'hour', 'hours', 'evening', 'morning', 'night',
 'hacia', 'hora', 'horas', 'noche', 'tarde', 'manana', 'anviwon', 'apepre', 'lannwit', 'aswe', 'maten'].forEach((w) => DAY_WORDS.add(w));
function contentWords(text, l, exclude) {
  const stop = new Set(norm(LEX.stop[l] || LEX.stop.fr).split(' '));
  return new Set(norm(text).split(/[^a-z0-9]+/).filter((w) => w.length > 3 && !/^\d+$/.test(w) && !stop.has(w) && !DAY_WORDS.has(w) && !(exclude && exclude.has(w))));
}
/** Names of the people in the case (« Personnes concernées ») never show that two claims share a topic. */
function personWords(d) {
  return new Set(norm(d.persons || '').split(/[^a-z]+/).filter((w) => w.length > 2));
}
function splitSentences(text) {
  // the "[? … ?]" markers contain "?" + space: hide them while splitting so they never end a sentence
  return String(text || '').replace(/\[\?([\s\S]*?)\?\]/g, (m, inner) => '⁅' + inner.replace(/[.!?]/g, '·') + '⁆')
    .split(/(?<=[.!?…])\s+|\n+/).map((s) => s.trim().replace(/⁅/g, '[?').replace(/⁆/g, '?]')).filter((s) => s.length > 2);
}
/** Quote without its final punctuation, so « … » never ends with « . ». */
const bare = (s) => String(s || '').replace(/[\s.!?…:;,]+$/, '');
function hasUncertain(text) { return /\[\?[\s\S]*?\?\]/.test(text || ''); }

/** Rassemble toutes les sources actives : éléments initiaux, réponses validées, pièces. */
function recitSources(d) {
  const src = [];
  if ((d.desc || '').trim()) src.push({ ref: 'desc', label: R('refDescription'), text: d.desc, nature: 'interp', lang: d.analysisLang || lang, kind: 'initial' });
  (d.items || []).forEach((it, i) => src.push({ ref: it.id, label: R('refInitial') + ' ' + (i + 1), text: it.text, nature: it.nature, lang: d.analysisLang || lang, kind: 'initial' }));
  (d.answers || []).filter((a) => a.active !== false).forEach((a, i) => {
    const q = (d.questions || []).find((x) => x.id === a.qid);
    src.push({ ref: a.id, label: R('refAnswer') + ' ' + (i + 1), text: a.validated, lang: a.lang, kind: 'answer', question: q ? q.text : '' });
  });
  (d.pieces || []).filter((p) => p.active !== false).forEach((p, i) => src.push({ ref: p.id, label: R('refPiece') + ' ' + (i + 1) + ' — ' + p.title, text: p.content || p.description || '', nature: 'doc', lang: d.analysisLang || lang, kind: 'piece', date: p.date, independent: p.independent }));
  return src;
}

/** Étapes 1 à 4 : propose affirmations, ambiguïtés, écarts — en conservant les choix déjà faits. */
function recitAnalyse(d) {
  const sources = recitSources(d);
  const keepClaims = new Map((d.claims || []).map((c) => [c.key, c]));
  const keepAmb = new Map((d.ambiguities || []).map((a) => [a.key, a]));
  const keepGaps = new Map((d.gaps || []).map((g) => [g.key, g]));
  const claims = [], amb = [], gaps = [];
  for (const s of sources) {
    splitSentences(s.text).forEach((sentence, i) => {
      const key = s.ref + '#' + i;
      const l = s.lang || lang;
      const hedges = findTerms(sentence, LEX.hedge[l]), hearsay = findTerms(sentence, LEX.hearsay[l]);
      const prev = keepClaims.get(key);
      const auto = hearsay.length ? 'report' : (s.kind === 'piece' ? 'doc' : (s.nature || 'obs'));
      const fx = facts(sentence, l);
      const checkable = auto !== 'interp' && auto !== 'suspicion' && (fx.times.length + fx.dates.length + fx.days.length > 0 || LEX.place.test(norm(sentence)));
      const c = Object.assign({
        key, id: 'A' + (claims.length + 1), ref: s.ref, label: s.label, text: sentence, lang: l,
        nature: auto, central: false, described: false, verifiable: checkable, status: 'unverified',
        verifySource: '', verifyNote: '', uncertain: hasUncertain(sentence),
      }, prev || {}, { id: 'A' + (claims.length + 1), text: sentence, label: s.label, hedges, hearsay, facts: fx, uncertain: hasUncertain(sentence) });
      claims.push(c);
      const mk = (kind, term, qKey) => {
        const k = key + '|' + kind + '|' + norm(term);
        const p = keepAmb.get(k);
        amb.push(Object.assign({ key: k, claim: c.id, ref: s.ref, label: s.label, kind, term, text: sentence, resolved: false, resolution: '' }, p || {}, { claim: c.id, question: RL(qKey, d.analysisLang || lang).replace('{x}', term) }));
      };
      findTerms(sentence, LEX.vagueTime[l]).forEach((term) => mk('time', term, 'qVagueTime'));
      findTerms(sentence, LEX.vaguePerson[l]).forEach((term) => mk('person', term, 'qVaguePerson'));
      findTerms(sentence, LEX.vagueThing[l]).forEach((term) => mk('thing', term, 'qVagueThing'));
      findTerms(sentence, LEX.approx[l]).forEach((term) => mk('approx', term, 'qApprox'));
      if (hearsay.length) mk('source', hearsay[0], 'qHearsay');
      if (c.uncertain) mk('uncertain', '[? ?]', 'qUncertain');
    });
  }
  // Écarts (P1). Two claims are compared only when they describe the same action of the same event:
  // - names of the people and day words never count as a shared topic, nor words found in most claims;
  // - different days → two distinct events → no discrepancy;
  // - different times → discrepancy only for the same action: same day + ≥1 shared action word,
  //   or ≥2 shared action words when a day is missing on one side.
  const exclude = personWords(d);
  const wordsOf = claims.map((c) => contentWords(c.text, c.lang, exclude));
  if (claims.length >= 4) {
    const df = new Map();
    wordsOf.forEach((ws) => ws.forEach((w) => df.set(w, (df.get(w) || 0) + 1)));
    df.forEach((n, w) => { if (n / claims.length > 0.5) exclude.add(w); });
  }
  for (let i = 0; i < claims.length; i++) {
    for (let j = i + 1; j < claims.length; j++) {
      const a = claims[i], b = claims[j];
      if (a.ref === b.ref || a.uncertain || b.uncertain) continue;
      const wb = new Set([...wordsOf[j]].filter((w) => !exclude.has(w)));
      const shared = [...wordsOf[i]].filter((w) => !exclude.has(w) && wb.has(w));
      const dayA = a.facts.days, dayB = b.facts.days;
      if (dayA.length && dayB.length && !dayA.some((x) => dayB.includes(x))) continue; // two different days: two events
      const sameDay = dayA.length > 0 && dayB.length > 0, noDay = !dayA.length && !dayB.length;
      if (!(shared.length >= 2 || ((sameDay || noDay) && shared.length >= 1))) continue; // not the same action
      const diff = [];
      for (const f of ['times', 'dates']) {
        if (a.facts[f].length && b.facts[f].length && !a.facts[f].some((x) => b.facts[f].includes(x))) diff.push([f, a.facts[f].join(', '), b.facts[f].join(', ')]);
      }
      if (!diff.length) continue;
      const key = a.key + '~' + b.key;
      const p = keepGaps.get(key);
      gaps.push(Object.assign({ key, a: a.id, b: b.id, aText: a.text, bText: b.text, aLabel: a.label, bLabel: b.label, kind: 'central', explanation: '', state: 'open', evidence: false },
        p || {}, { a: a.id, b: b.id, aText: a.text, bText: b.text, aLabel: a.label, bLabel: b.label, what: diff.map((x) => R('f_' + x[0]) + ' : ' + x[1] + ' / ' + x[2]).join(' ; '), shared: shared.slice(0, 4).join(', ') }));
    }
  }
  // Écarts ajoutés manuellement par l'utilisateur
  (d.gaps || []).filter((g) => g.manual).forEach((g) => gaps.push(g));
  d.claims = claims; d.ambiguities = amb; d.gaps = gaps.map((g, i) => Object.assign(g, { id: 'E' + (i + 1) }));
  d.lastAnalysis = { at: new Date().toISOString(), version: d.version || 0, answers: (d.answers || []).filter((a) => a.active !== false).length };
  d.analyses = (d.analyses || []).concat([{ at: d.lastAnalysis.at, version: d.lastAnalysis.version, indicators: recitIndicators(d) }]).slice(-30);
  return d;
}

/** Étape 9 : cinq indicateurs de documentation (jamais un score de mensonge). */
function recitIndicators(d) {
  const claims = d.claims || [], amb = d.ambiguities || [], gaps = d.gaps || [];
  const central = claims.filter((c) => c.central);
  const verifiable = claims.filter((c) => c.verifiable);
  const checked = verifiable.filter((c) => c.status !== 'unverified');
  const ind = [
    { key: 'ind1', num: central.filter((c) => c.described).length, den: central.length, empty: 'noCentral' },
    { key: 'ind2', num: amb.filter((a) => a.resolved).length, den: amb.length, empty: 'noAmbiguity' },
    { key: 'ind3', num: checked.length, den: verifiable.length, empty: 'noVerifiable',
      detail: ['corroborated', 'partial', 'contradicted', 'unverifiable'].map((s) => [s, checked.filter((c) => c.status === s).length]) },
    { key: 'ind4', num: gaps.filter((g) => g.state === 'resolved' && g.evidence).length, den: gaps.length, empty: 'noGap',
      detail: [['explainedOnly', gaps.filter((g) => g.state !== 'open' && !g.evidence).length]] },
    { key: 'ind5', num: central.filter((c) => c.status === 'corroborated' || c.status === 'contradicted').length, den: central.length, empty: 'noCentral' },
  ];
  ind.forEach((x) => { x.pct = x.den ? Math.round((100 * x.num) / x.den) : null; });
  return ind;
}

/** Étape 8 : au maximum trois questions neutres, par priorité. */
function recitSuggest(d) {
  const L = d.analysisLang || lang, out = [], seen = new Set((d.questions || []).map((q) => norm(q.text)));
  const push = (q) => { if (out.length < 3 && !seen.has(norm(q.text))) { seen.add(norm(q.text)); out.push(q); } };
  (d.gaps || []).filter((g) => g.state !== 'resolved' && g.kind === 'central').forEach((g) => push({
    text: RL('qGap', L).replace('{a}', bare(g.aText)).replace('{b}', bare(g.bText)), point: g.id + ' — ' + (g.what || ''), why: RL('whyGap', L), target: RL('targetGap', L) }));
  (d.claims || []).filter((c) => c.central && c.verifiable && c.status === 'unverified').forEach((c) => push({
    text: RL('qVerify', L).replace('{x}', bare(c.text)), point: c.id, why: RL('whyVerify', L), target: RL('targetVerify', L) }));
  (d.ambiguities || []).filter((a) => !a.resolved).forEach((a) => push({ text: a.question, point: a.claim + ' — « ' + a.term + ' »', why: RL('whyAmb', L), target: RL('targetAmb', L) }));
  if (!(d.answers || []).length) push({ text: RL('firstQuestion', L), point: '—', why: RL('whyFree', L), target: RL('targetFree', L) });
  return out;
}

/** Hypothèses alternatives à examiner pour les écarts non résolus (jamais un verdict). */
function recitHypotheses(d) {
  const open = (d.gaps || []).filter((g) => g.state !== 'resolved');
  if (!open.length) return [];
  return ['hMemory', 'hMisunderstanding', 'hIncomplete', 'hDocError', 'hTranscription', 'hIncompatible', 'hConcealment'].map((k) => R(k));
}

function recitSaveEdit(start) {

function recitTabs(d) {

function recitTab(tb) { recitStopRec(); recitView.tab = tb; if (tb === 'analysis' || tb === 'conclusion') { const db = recitLoad(); const d = recitGet(db, recitView.id); recitAnalyse(d); recitSave(db); } recitWork(); }
function recitWork() {

/* ---------- entretien ---------- */
function recitInterview(d) {
  const qs = d.questions || [], cur = qs[qs.length - 1];
  const hist = qs.map((q, qi) => {
    const ans = (d.answers || []).filter((a) => a.qid === q.id);
    return `<article class="card recit-qa"><h3>${R('question')} ${qi + 1}</h3>${quote(q.text)}

  }).join('');
  return `<section><h2>${R('history')}</h2>${hist || `<p>${R('noQuestion')}</p>`}</section>
  <section class="card recit-ask"><h2>${R('askTitle')}</h2>
    <label for="qText">${R('currentQuestion')}</label><textarea id="qText" maxlength="800">${esc(cur ? cur.text : RL('firstQuestion', d.analysisLang || lang))}</textarea>
    <div class="actions">${btn(R('addQuestion'), 'recitAddQuestion()')}</div>
    <label for="aLang">${R('answerLang')}</label>${langSelect('aLang', 'auto', true)} <small id="aDetect"></small>
    <label for="aText">${R('answerText')}</label><textarea id="aText" maxlength="8000" placeholder="${esc(R('answerPlaceholder'))}"></textarea>
    <p><small>${R('uncertainHint')}</small></p>
    <div class="actions">${btn(R('markUncertain'), 'recitMarkUncertain()')}</div>
    <div class="recit-audio">
      <label class="recit-consent"><input type="checkbox" id="aConsent"> ${R('consent')}</label>
      <label class="recit-consent"><input type="checkbox" id="aKeep"> ${R('keepAudio')}</label>
      <p><small>${R('speechNotice')}</small></p>
      <div class="actions">${btn('🎙 ' + R('recStart'), 'recitRecStart()')}${btn(R('recPause'), 'recitRecPause()')}${btn(R('recResume'), 'recitRecResume()')}${btn(R('recStop'), 'recitStopRec(true)')}</div>
      <p id="aRecState" role="status" class="recit-rec"></p><audio id="aPlayer" controls hidden></audio>
    </div>
    <label for="aTrans">${R('translationField')}</label><textarea id="aTrans" maxlength="8000" placeholder="${esc(R('translationHint'))}"></textarea>
    <div class="actions"><button class="primary" onclick="recitAddAnswer()">${R('addAnswer')}</button>${btn(R('analyse'), "recitTab('analysis')")}${btn(R('conclusion'), "recitTab('conclusion')")}${btn(R('addPiece'), "recitTab('pieces')")}</div>
    <p id="aStatus" role="status"></p>
  </section>`;
}
function recitAnswerCard(d, a) {
  const off = a.active === false;

    <p>${esc(a.validated).replace(/\[\?([\s\S]*?)\?\]/g, `<mark title="${esc(R('toConfirm'))}">$1</mark>`)}</p>
    ${a.original && a.original !== a.validated ? `<details><summary>${R('originalTranscript')}</summary><p>${esc(a.original)}</p></details>` : ''}
    ${a.translation ? `<details><summary>${R('translation')}</summary><p>${esc(a.translation)}</p></details>` : ''}
    ${(a.versions || []).length ? `<details><summary>${R('previousVersions')}</summary>${a.versions.map((v) => `<p><small>${recitDate(v.at)}</small><br>${esc(v.validated)}</p>`).join('')}</details>` : ''}
    ${a.audio ? `<button onclick="recitPlay('${a.id}')">▶ ${R('listen')}</button>` : ''}
    ${off ? '' : `<div class="actions">${btn(R('edit'), `recitEditAnswer('${a.id}')`)}${btn(R('remove'), `recitRemoveAnswer('${a.id}')`)}</div>`}</div>`;
}
function recitBindInterview(d) {
  const ta = document.querySelector('#aText'), info = document.querySelector('#aDetect');
  if (ta && info) ta.oninput = () => { const l = detectLang(ta.value); info.textContent = l ? R('detected') + ' ' + R('lang_' + l) + ' — ' + R('confirmLang') : ''; };
}
function recitAddQuestion() {
  const db = recitLoad(), d = recitGet(db, recitView.id), text = (document.querySelector('#qText').value || '').trim();
  if (!text) return;

}
function recitMarkUncertain() {
  const ta = document.querySelector('#aText'); if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { ta.setRangeText('[? ' + R('inaudible') + ' ?]', s, e, 'end'); } else { ta.setRangeText('[?' + ta.value.slice(s, e) + '?]', s, e, 'end'); }
  ta.focus();
}
async function recitAddAnswer() {
  const db = recitLoad(), d = recitGet(db, recitView.id);
  const text = (document.querySelector('#aText').value || '').trim(), status = document.querySelector('#aStatus');
  if (!text) { status.textContent = R('emptyAnswer'); return; }
  const consent = document.querySelector('#aConsent');
  if (consent && !consent.checked) {
    status.textContent = R('consentNeeded');
    const box = consent.closest('label'); if (box) box.classList.add('recit-need');
    consent.focus(); return;
  }
  let q = d.questions[d.questions.length - 1];
  const qText = (document.querySelector('#qText').value || '').trim();
  if (!q || (qText && norm(qText) !== norm(q.text))) { q = { id: recitUid('q'), text: qText || RL('firstQuestion', d.analysisLang || lang), created: new Date().toISOString() }; d.questions.push(q); }
  let l = document.querySelector('#aLang').value;
  if (l === 'auto') l = detectLang(text) || lang;
  const a = { id: recitUid('r'), qid: q.id, lang: l, original: (recitRec && recitRec.transcript) || text, validated: text,
    translation: (document.querySelector('#aTrans').value || '').trim(), uncertain: [...text.matchAll(/\[\?([\s\S]*?)\?\]/g)].map((m) => m[1].trim()),
    created: new Date().toISOString(), active: true, versions: [], audio: false };
  if (recitRec && recitRec.blob && document.querySelector('#aKeep').checked) { try { await recitAudioPut(a.id, recitRec.blob); a.audio = true; } catch { /* stockage refusé : on garde la transcription */ } }
  recitRec = null;
  d.answers.push(a); recitBump(d); recitSave(db);
  recitWork(); const st = document.querySelector('#aStatus'); if (st) st.textContent = R('answerAdded');
}
function recitEditAnswer(id) {
  const db = recitLoad(), d = recitGet(db, recitView.id), a = d.answers.find((x) => x.id === id);
  const next = prompt(R('editPrompt'), a.validated);
  if (next == null || !next.trim() || next.trim() === a.validated) return;
  a.versions = (a.versions || []).concat([{ validated: a.validated, at: a.updated || a.created }]);
  a.validated = next.trim(); a.updated = new Date().toISOString();
  recitBump(d); recitSave(db); recitWork();
}
function recitRemoveAnswer(id) {
  if (!confirm(R('confirmRemove'))) return;
  const db = recitLoad(), d = recitGet(db, recitView.id), a = d.answers.find((x) => x.id === id);
  a.active = false; a.removed = new Date().toISOString();
  if (a.audio) { recitAudioDel(a.id).catch(() => {}); a.audio = false; }
  (d.analyses || []).forEach((x) => { x.obsolete = true; });
  recitBump(d); recitSave(db); recitWork();
}
async function recitPlay(id) {
  try { const blob = await recitAudioGet(id); if (!blob) return; const url = URL.createObjectURL(blob); const au = new Audio(url); au.onended = () => URL.revokeObjectURL(url); au.play(); } catch { alert(R('audioMissing')); }
}

/* ---------- audio : MediaRecorder (réécoute locale) + reconnaissance vocale du navigateur ---------- */
async function recitRecStart() {
  const st = document.querySelector('#aRecState');
  if (!document.querySelector('#aConsent').checked) { st.textContent = R('needConsent'); return; }
  recitStopRec();
  let l = document.querySelector('#aLang').value; if (l === 'auto') l = lang;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supported = SR && l !== 'ht';
  recitRec = { chunks: [], transcript: '', lang: l, paused: false };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recitRec.stream = stream;
    const mr = new MediaRecorder(stream); recitRec.mr = mr;
    mr.ondataavailable = (e) => { if (e.data.size) recitRec && recitRec.chunks.push(e.data); };
    mr.onstop = () => { if (!recitRec) return; recitRec.blob = new Blob(recitRec.chunks, { type: mr.mimeType || 'audio/webm' }); const p = document.querySelector('#aPlayer'); if (p) { p.src = URL.createObjectURL(recitRec.blob); p.hidden = false; } };
    mr.start();
  } catch { st.textContent = R('micDenied'); recitRec = null; return; }
  if (supported) {
    const rec = new SR(); recitRec.sr = rec;
    rec.lang = localeTags[l]; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (ev) => {
      let fin = '';
      for (let i = 0; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) { const txt = r[0].transcript.trim(); fin += (r[0].confidence && r[0].confidence < 0.6 ? '[?' + txt + '?]' : txt) + ' '; }
      }
      recitRec.transcript = fin.trim();
      const ta = document.querySelector('#aText'); if (ta) ta.value = recitRec.transcript;
    };
    rec.onend = () => { if (recitRec && recitRec.sr === rec && !recitRec.paused && !recitRec.stopped) { try { rec.start(); } catch { /* fin */ } } };
    try { rec.start(); } catch { /* déjà actif */ }
    st.textContent = '● ' + R('recording');
  } else {
    st.textContent = '● ' + R('recordingNoTranscript');
  }
}
function recitRecPause() { if (!recitRec) return; recitRec.paused = true; try { recitRec.mr && recitRec.mr.state === 'recording' && recitRec.mr.pause(); recitRec.sr && recitRec.sr.stop(); } catch { /* */ } const st = document.querySelector('#aRecState'); if (st) st.textContent = '❚❚ ' + R('paused'); }
function recitRecResume() { if (!recitRec) return; recitRec.paused = false; try { recitRec.mr && recitRec.mr.state === 'paused' && recitRec.mr.resume(); recitRec.sr && recitRec.sr.start(); } catch { /* */ } const st = document.querySelector('#aRecState'); if (st) st.textContent = '● ' + R('recording'); }
function recitStopRec(keep) {
  if (!recitRec) return;
  recitRec.stopped = true;
  try { recitRec.sr && recitRec.sr.stop(); } catch { /* */ }
  try { recitRec.mr && recitRec.mr.state !== 'inactive' && recitRec.mr.stop(); } catch { /* */ }
  try { recitRec.stream && recitRec.stream.getTracks().forEach((t) => t.stop()); } catch { /* */ }
  const st = document.querySelector('#aRecState'); if (st) st.textContent = keep ? R('recStopped') : '';
  if (!keep) recitRec = null;
}

/* ---------- vue analyse ---------- */
function recitSet(kind, id, field, value) {

  const it = list.find((x) => x.id === id || x.key === id); if (!it) return;
  it[field] = value; recitSave(db);
  const box = document.querySelector('#recitIndicators'); if (box) box.innerHTML = recitIndicatorsHtml(d);

function recitIndicatorsHtml(d) {

}

}
function chk(kind, id, field, cur, label) {

}
function txt(kind, id, field, cur, ph) {
  return `<input class="recit-in" value="${esc(cur || '')}" placeholder="${esc(R(ph))}" onchange="recitSet('${kind}','${id}','${field}',this.value)">`;
}
function recitAnalysisView(d) {

    ${d.claims.length ? `<div class="recit-table"><table><thead><tr><th>#</th><th>${R('claim')}</th><th>${R('qualify')}</th><th>${R('step3')}</th></tr></thead><tbody>${d.claims.map(claimRow).join('')}</tbody></table></div>` : `<p>${R('noData')}</p>`}</section>
  <section><h2>2 · ${R('step2')}</h2>${d.ambiguities.length ? d.ambiguities.map((a) => `<article class="card recit-amb"><p><strong>${a.claim}</strong> · ${R('amb_' + a.kind)} « ${esc(a.term)} »</p>${quote(a.text)}<p>${R('suggestedQ')} : <em>${esc(a.question)}</em></p>${chk('amb', a.key, 'resolved', a.resolved, 'resolved')}${txt('amb', a.key, 'resolution', a.resolution, 'resolutionPh')}</article>`).join('') : `<p>${R('noAmbiguity')}</p>`}</section>

/* ---------- Suggestion IA optionnelle (WebLLM, dans le navigateur, sur ordinateur compatible) ----------

const RECIT_AI_MODELS = { big: 'Qwen2.5-3B-Instruct-q4f16_1-MLC', small: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC' };

const ROLE_WORDS = {
  fr: ['voisin', 'voisine', 'collègue', 'ami', 'amie', 'frère', 'sœur', 'soeur', 'mère', 'père', 'patron', 'patronne', 'cousin', 'cousine', 'mari', 'femme', 'copain', 'copine', 'chef', 'amant', 'maîtresse', 'ex'],
  en: ['neighbor', 'neighbour', 'colleague', 'friend', 'brother', 'sister', 'mother', 'father', 'boss', 'cousin', 'husband', 'wife', 'boyfriend', 'girlfriend', 'lover', 'ex'],
  es: ['vecino', 'vecina', 'colega', 'compañero', 'compañera', 'amigo', 'amiga', 'hermano', 'hermana', 'madre', 'padre', 'jefe', 'jefa', 'primo', 'prima', 'esposo', 'esposa', 'novio', 'novia', 'amante'],
  ht: ['vwazen', 'vwazin', 'kolèg', 'zanmi', 'frè', 'sè', 'manman', 'papa', 'patwon', 'kouzen', 'kouzin', 'mari', 'madanm', 'mennaj', 'chèf'],

// JSON schema given to WebLLM as a STRING. "centrales" must not come back empty.
const RECIT_AI_SCHEMA = JSON.stringify({ type: 'object', properties: {
  centrales: { type: 'array', items: { type: 'string' }, minItems: 1, maxItems: 8 },
  ambiguites: { type: 'array', items: { type: 'string' }, maxItems: 8 },
  ecarts: { type: 'array', items: { type: 'string' }, maxItems: 8 },
  questions: { type: 'array', items: { type: 'string' }, maxItems: 3 } },
  required: ['centrales', 'ambiguites', 'ecarts', 'questions'] });
// Judging or presupposing wording in a question (« comportement changeant », « rentré plus tôt »…)
const JUDGING = /\b(changeant|suspect|suspecte|bizarre|etrange|louche|mensonge|ment|mentir|cache|cachait|infidel|infidele|trompe|tromper|coupable|plus tot|si tot|changing|suspicious|weird|strange|lying|lie|hiding|cheating|guilty|earlier|cambiante|sospechos[oa]|raro|extrano|miente|mentir|oculta|engana|culpable|mas temprano|dwol|etranj|sispek|manti|kache|twonpe|koupab|pi bone)\b/;
const LEADING = /^\s*(pourquoi|why|por ?qu[eé]|poukisa)\b|\b(si tard|so late|tan tarde|ta konsa|pourquoi ne|why didn'?t|why don'?t)\b/i;

const RECIT_AI_KEY = 'soutien-recit-ai-model';
let recitAiCached = null; // null = not checked yet, true / false once the browser cache was inspected
function recitAiSaved() { try { return localStorage.getItem(RECIT_AI_KEY); } catch { return null; } }
function recitAiPick() {
  const saved = recitAiSaved();
  const k = Object.keys(RECIT_AI_MODELS).find((x) => RECIT_AI_MODELS[x] === saved);
  return k || ((navigator.deviceMemory || 4) >= 8 ? 'big' : 'small');
}
/** Is the model already in the browser cache (WebLLM stores it with the Cache API)? Checked once, no download. */
async function recitAiCheckCache() {
  if (recitAiCached !== null) return recitAiCached;
  try {
    const id = RECIT_AI_MODELS[recitAiPick()];
    const names = typeof caches !== 'undefined' ? await caches.keys() : [];
    let hit = false;
    for (const n of names.filter((x) => /webllm/i.test(x))) {
      const keys = await (await caches.open(n)).keys();
      if (keys.some((r) => r.url.includes(id))) { hit = true; break; }
    }
    recitAiCached = hit && recitAiSaved() === id;
  } catch { recitAiCached = false; }

}
/** Ask the browser not to evict the site's storage (model + cases) when the disk fills up. */
async function recitAiPersist() {
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch { /* not supported */ }
}
function recitAiButton() {
  if (typeof navigator === 'undefined' || !navigator.gpu) return `<small>${R('aiUnavailable')}</small>`;
  const busy = recitAiLoading && !recitAi;
  if (recitAiCached === null && !recitAi) recitAiCheckCache().then(() => { const b = document.querySelector('#recitAiBtn'); if (b) b.outerHTML = recitAiButton(); });
  const hint = recitAi ? R('aiReady') : recitAiCached ? R('aiCachedHint') : recitAiCached === false ? R('aiFirstHint').replace('{size}', R(recitAiPick() === 'big' ? 'aiSizeBig' : 'aiSizeSmall')) : '';

}
function recitAiRenderProgress() {
  const box = document.querySelector('#recitAi'); if (!box) return;
  if (recitAiLoading && !recitAi) box.innerHTML = `<p>${R('aiLoading')} <strong>${recitAiProgress.pct} %</strong><br><small>${esc(recitAiProgress.text)}</small></p>`;
  else box.innerHTML = recitAiLast;
}
function recitAiEngine() {
  recitAiLoading ??= (async () => {
    const webllm = await import('https://esm.run/@mlc-ai/web-llm');
    const cb = { initProgressCallback: (p) => { recitAiProgress = { pct: Math.round((p.progress || 0) * 100), text: p.text || '' }; recitAiRenderProgress(); } };
    const pick = recitAiPick();
    try { recitAiModel = RECIT_AI_MODELS[pick]; return await webllm.CreateMLCEngine(recitAiModel, cb); } catch (e) {
      if (pick !== 'big') throw e;
      recitAiModel = RECIT_AI_MODELS.small; return await webllm.CreateMLCEngine(recitAiModel, cb);
    }
  })();

}
async function recitAiRun() {
  if (recitAiLoading && !recitAi) return; // already loading: never start a second download
  if (!recitAi && !(await recitAiCheckCache()) && !confirm(R('aiConfirm').replace('{size}', R(recitAiPick() === 'big' ? 'aiSizeBig' : 'aiSizeSmall')))) return;
  if (!recitAi) recitAiPersist();

  try {
    if (!recitAi) {

    recitAnalyse(d); recitSave(db);
    const material = [RL('aiTextLabel', L) + ':', ...recitSources(d).map((s) => `[${s.label}] ${s.text}`), '',
      RL('aiGapsLabel', L) + ':', ...(d.gaps.length ? d.gaps.map((g) => `- ${g.id}: « ${g.aText} » / « ${g.bText} » (${g.what})`) : ['- ' + RL('aiNoneLabel', L)]), '',
      RL('aiAmbLabel', L) + ':', ...(d.ambiguities.length ? d.ambiguities.map((a) => `- « ${a.term} » (${a.claim})`) : ['- ' + RL('aiNoneLabel', L)])].join('\n').slice(0, 7000);
    const res = await recitAi.chat.completions.create({
      messages: [{ role: 'system', content: RL('aiSystem', L) }, { role: 'user', content: material }],
      temperature: 0, max_tokens: 900, response_format: { type: 'json_object', schema: RECIT_AI_SCHEMA } });
    recitAiShow(res.choices[0].message.content || '', d);
  } catch (e) {
    console.error('[Soutien Affectif] Suggestion IA :', e);

    recitAiLast = `<p>${R('aiError')}</p><details><summary>${R('aiErrorDetail')}</summary><pre>${esc(String((e && (e.message || e)) || e).slice(0, 600))}</pre></details>`;
  }

/** Words or numbers in an AI sentence that do not appear anywhere in the case (anti-invention, P2). */
function recitAiUnknown(text, d, L) {
  const srcText = recitSources(d).map((s) => s.text).join(' ') + ' ' + (d.persons || '');
  const nSrc = norm(srcText), out = [];
  for (const w of (ROLE_WORDS[L] || []).concat(ROLE_WORDS.fr)) if (hasTerm(text, w) && !hasTerm(srcText, w)) out.push(w);
  for (const m of String(text).matchAll(/(?:^|[^\p{L}])(\p{Lu}[\p{Ll}]{2,})/gu)) {
    const w = norm(m[1]);
    if (!nSrc.includes(w) && !norm(R('refDescription') + ' ' + R('refAnswer') + ' ' + R('refInitial') + ' ' + R('refPiece')).includes(w) && !norm(text).startsWith(w)) out.push(m[1]);
  }
  const f = facts(text, L, true), fs = facts(srcText, L, true);
  f.times.filter((x) => !fs.times.includes(x)).forEach((x) => out.push(x.replace(':', ' h ')));
  f.days.filter((x) => !fs.days.includes(x)).forEach((x) => out.push(x));
  return [...new Set(out)];
}
function recitAiShow(raw, d) {

  const keys = ['centrales', 'ambiguites', 'ecarts', 'questions'];
  if (!obj || typeof obj !== 'object' || !keys.some((k) => Array.isArray(obj[k]))) {
    recitAiLast = `<article class="card recit-ai"><p><strong>${R('aiBadJson')}</strong></p><details><summary>${R('aiRaw')}</summary><pre>${esc(raw)}</pre></details></article>`;

  };
  const sect = (k, title, q) => `<h4>${R(title)}</h4>${Array.isArray(obj[k]) && obj[k].length ? `<ul>${obj[k].slice(0, q ? 3 : 12).map((x) => item(x, q)).join('')}</ul>` : `<p><small>${R('none')}</small></p>`}`;
  recitAiLast = `<article class="card recit-ai"><p><strong>${R('aiTitle')}</strong> <small>(${esc(recitAiModel || '')}) ${R('aiWarning')}</small></p>
    ${sect('centrales', 'aiCentral')}${sect('ambiguites', 'aiAmbiguities')}${sect('ecarts', 'aiGaps')}${sect('questions', 'aiQuestions', true)}</article>`;
}

/* ===== Espace membres =====
   Le lien public (vidéo) ouvre une vitrine : l'accueil, la fiche 02 et « Signaux de danger ».
   Tout le reste est chiffré (AES-GCM) dans MEMBERS_PAYLOAD ; chaque code abonné de la liste (C:\Projets\prive\codes_abonnes.csv) l'ouvre :
   sans le code donné aux abonnés de la chaîne, ce contenu est illisible, même en lisant le code de la page.
   La version complète utilisée par les tests n'a pas de MEMBERS_PAYLOAD : tout y est ouvert. */
const MEMBERS_KEY = 'soutien-acces-membres';
const MEMBERS_JOIN = 'https://www.youtube.com/channel/UCUJ-ay76QvkmdlkiXcAhcVw?sub_confirmation=1'; // ouvre directement la fenêtre d'abonnement YouTube
const FREE_FICHE = 1; // fiche 02 — l'hôtel
const FREE_PAGES = ['home', 'safety', 'lock'];
let unlocked = typeof MEMBERS_PAYLOAD === 'undefined';
let lockedFrom = null;

function isLocked(p, i) {
  if (unlocked) return false;
  if (p === 'path') return i !== FREE_FICHE;
  return !FREE_PAGES.includes(p);
}
async function membersDecrypt(code) {
  return JSON.parse(await ccOpen(MEMBERS_PAYLOAD, code)); // ccOpen : trousseau des codes abonnés (keyring.py)
}
function membersApply(data) {
  for (const l of Object.keys(data.CONTENT)) Object.assign(CONTENT[l], data.CONTENT[l]);
  for (const l of Object.keys(data.RECIT)) RECIT[l] = Object.assign(RECIT[l] || {}, data.RECIT[l]);
  unlocked = true;
}
async function membersUnlock(code, silent) {
  const msg = document.querySelector('#lockMsg');
  if (msg && !silent) msg.textContent = t('lockChecking');
  try {
    membersApply(await membersDecrypt(code));
    try { const c = String(code).trim().toUpperCase(); localStorage.setItem(MEMBERS_KEY, c); localStorage.setItem('compumaster-code', c); } catch { /* private mode */ }
    const target = lockedFrom; lockedFrom = null;
    if (target && target.p === 'path') start(target.i); else navigate(target ? target.p : 'home');
    return true;
  } catch {
    if (!silent) { try { localStorage.removeItem(MEMBERS_KEY); } catch { /* */ } if (msg) msg.textContent = t('lockWrong'); }
    return false;
  }
}
function lockPage() {
  app.innerHTML = `<section class="lock card">
    <div class="eyebrow">${t('lockEyebrow')}</div><h1>🔒 ${t('lockTitle')}</h1><p>${t('lockText')}</p>

    <form id="lockForm" class="lock-form"><label for="lockCode">${t('lockCodeLabel')}</label>
      <input id="lockCode" autocomplete="off" autocapitalize="characters" placeholder="${t('lockCodePh')}" maxlength="40">
      <div class="actions"><button class="primary" type="submit">${t('lockUnlock')}</button>${btn(t('back'), "navigate('home')")}</div>
      <p id="lockMsg" role="status"></p></form>
    <div class="note">${t('lockFree')} ${btn(t('lockFreeFiche'), `start(${FREE_FICHE})`)} ${btn(t('navSafety'), "navigate('safety')")}</div>

// Gate every way in: menu, situations, re-render (language change)
const _navigate = navigate, _start = start, _render = render, _cards = cards;
navigate = function (p) {
