</style></head><body><header></header><main id="app"></main><footer></footer><script>const CONTENT={"fr": {"scenarios": [["Vous voyez votre partenaire au restaurant avec quelqu’un", "Une sortie à deux", "", ""], ["Vous voyez votre partenaire sortir d’un hôtel avec quelqu’un", "Un contexte à clarifier", "Je t’ai vu sortir de cet hôtel avec cette personne. Dans quel contexte étiez-vous là ?", "Un hôtel peut accueillir des réunions, visites ou séjours. Cette observation ne démontre pas un rapport sexuel."], ["Quelqu’un vient de déposer votre partenaire en voiture", "Quelqu’un raccompagne votre partenaire", "", ""], ["Vous apercevez votre partenaire embrasser quelqu’un", "Vérifier ce qui a été vu", "", ""], ["Votre partenaire refuse de montrer ses conversations privées", "Vie privée et confiance", "", ""], ["Votre partenaire sort sans vous expliquer ses projets", "Se prévenir sans se surveiller", "", ""], ["Votre partenaire devient nerveux pendant votre discussion", "Accueillir le malaise", "", ""], ["Votre partenaire se fait beau ou belle pour une sortie ordinaire", "L’apparence et ses interprétations", "", ""], ["Le récit de votre partenaire contient une contradiction", "Clarifier sans piéger", "", ""], ["Votre partenaire souhaite moins de contacts intimes", "Écouter les besoins", "", ""], ["Votre partenaire échange de nombreux messages avec quelqu’un", "Définir les limites ensemble", "", ""], ["Votre partenaire reconnaît une relation avec une autre personne", "Choisir la suite", "", ""], ["Vous soupçonnez souvent une tromperie sans fait nouveau", "Comprendre son inquiétude", "", ""], ["Votre discussion sur la fidélité se transforme en dispute", "Prendre de la distance", "", ""], ["Vous n’avez pas le même accord sur l’exclusivité", "Clarifier l’exclusivité", "", ""], ["Votre partenaire refuse de parler de vos doutes", "Respect et besoins personnels", "", ""], ["Votre partenaire reconnaît avoir effacé des messages pour vous les cacher", "Suppression reconnue, contenu à clarifier", "", ""], ["Votre partenaire vous parle d’un compte de messagerie non déclaré", "Compte distinct, usage à clarifier", "", ""], ["Votre partenaire reconnaît une intimité affective cachée avec quelqu’un", "Lien émotionnel et limites du couple", "", ""], ["Votre partenaire reconnaît utiliser une application de rencontres", "Usage actuel, statut et intention", "", ""], ["Votre partenaire reconnaît avoir inventé une sortie ou un déplacement", "Un faux récit reconnu", "", ""], ["Votre partenaire admet des échanges sexuels en ligne mais dit « ce n’est que virtuel »", "Définir ensemble l’infidélité numérique", "", ""], ["Votre partenaire reconnaît avoir caché une dépense liée à quelqu’un", "Secret financier, motif à comprendre", "", ""], ["Votre partenaire reconnaît s’être présenté comme célibataire", "Statut de couple nié auprès d’un tiers", "", ""]], "signs": [], "dangerItems": [["Menaces de mort ou arme utilisée pour intimider", "Des paroles ou gestes qui font craindre une blessure ou la mort. Il n’est pas nécessaire d’attendre un passage à l’acte."], ["Pression sur le cou ou suffocation", "Toute compression du cou ou entrave à la respiration est grave, même sans marque visible. Une évaluation médicale rapide est nécessaire."], ["Contrôle des déplacements et du téléphone", "Imposer des mots de passe, une géolocalisation ou des comptes rendus sous menace dépasse une demande de communication."], ["Isolement", "Empêcher les contacts avec les proches, le travail ou les soutiens extérieurs réduit l’autonomie."], ["Violence ou coercition sexuelle", "Imposer un contact, poursuivre après un refus, ou faire pression pour obtenir un acte sexuel. Le couple ne remplace pas le consentement."], ["Harcèlement ou surveillance après une rupture", "Suivre la personne, multiplier les contacts non souhaités ou apparaître régulièrement à ses lieux de vie."], ["Contrôle économique ou administratif", "Confisquer l’argent ou les documents, empêcher de travailler, ou utiliser le statut migratoire comme menace."], ["Humiliation et intimidation répétées", "Rabaisser, effrayer, détruire des objets ou menacer les proches pour obtenir l’obéissance."], ["Escalade", "Des violences qui deviennent plus fréquentes, des menaces plus précises ou l’usage d’une arme appellent une aide spécialisée."], ["Refus de respecter les limites", "Punir un refus, empêcher de partir ou imposer des règles unilatérales par la peur."]], "fiches": [null, {"id": "hotel", "type": "doute", "badge": "context", "title": "Vous voyez votre partenaire sortir d'un hôtel avec quelqu'un", "subtitle": "Un contexte à clarifier", "conclude": "Un hôtel accueille aussi des réunions, des repas, des visites de proches ou des séjours professionnels. Ce que vous avez vu montre que deux personnes étaient au même endroit au même moment. Cela ne dit rien, à lui seul, de leur relation ni de ce qui s'est passé à l'intérieur.", "explanations": ["Un rendez-vous professionnel (réunion, séminaire, client, entretien) dans les salons ou le restaurant de l'hôtel.", "Une personne de passage en ville (famille, ami, collègue) qui loge à l'hôtel.", "Un repas, un verre ou un événement (mariage, conférence) organisé sur place.", "Une relation que votre partenaire ne vous a pas dite, amicale ou intime.", "Une rencontre de hasard en sortant."], "clarify": ["Notez ce que vous avez réellement vu : l'heure, le lieu exact (hall, parking, restaurant), l'attitude des deux personnes. Séparez-le de ce que vous en avez pensé.", "Rappelez-vous ce que votre partenaire vous avait dit de sa journée, sans en tirer de conclusion.", "Posez la question directement, en décrivant le fait sans l'interpréter."], "avoid": ["Interpeller votre partenaire ou l'autre personne sur place, ou les suivre.", "Fouiller le téléphone, l'agenda ou les reçus pour « vérifier » avant d'en parler.", "Tendre un piège (« Tu étais où cet après-midi ? ») alors que vous savez déjà. Cela abîme la confiance, quelle que soit la réponse."], "firstHours": ["Laissez passer le pic d'émotion avant d'en parler. Quelques heures suffisent souvent.", "Écrivez ce que vous avez vu dans « Mon journal » pour ne pas le déformer avec le temps.", "Si vous avez besoin d'en parler tout de suite, choisissez une personne de confiance qui ne connaît pas l'autre personne, pour éviter les rumeurs."], "question": "Je t'ai vu sortir de l'hôtel [nom/lieu] vers [heure] avec une personne. Je préfère t'en parler directement : qu'est-ce que tu faisais là ?", "answers": [{"label": "Une explication précise (réunion, proche de passage…)", "advice": "Reformulez pour montrer que vous avez compris : « Si je comprends bien, tu avais une réunion avec… ». Dites aussi ce que vous avez ressenti en le voyant, sans reproche.", "followUp": "Est-ce qu'il y a des moments comme celui-là que tu préférerais me dire à l'avance, pour éviter ce genre de malentendu ?"}, {"label": "Une explication floue (« rien de spécial », « un truc de boulot »)", "advice": "Le flou n'est pas une preuve. Demandez une seule précision, calmement, puis laissez votre partenaire répondre.", "followUp": "Je ne t'accuse de rien, j'ai juste besoin de comprendre : c'était qui, cette personne pour toi ?"}, {"label": "De la colère (« tu me surveilles ? »)", "advice": "Expliquez que vous étiez là par hasard (si c'est le cas) et que vous préférez en parler plutôt que de garder le doute. Si le ton monte, proposez une pause.", "followUp": "Je ne veux pas te surveiller. Je t'en parle justement pour ne pas rester avec des idées en tête."}, {"label": "Un refus de répondre", "advice": "Respectez le refus pour l'instant : ce n'est pas un aveu. Dites que la question reste importante pour vous et proposez un autre moment.", "followUp": "D'accord, pas maintenant. Est-ce qu'on peut en reparler demain soir ?"}, {"label": "La reconnaissance d'une relation cachée", "advice": "Prenez le temps d'encaisser. Vous n'avez rien à décider maintenant. Basculez vers le parcours « aveu » (fiche 12).", "followUp": "J'ai besoin de temps pour réfléchir. On en reparlera quand je serai prêt(e)."}], "next": ["Convenir de ce que chacun souhaite savoir des sorties de l'autre (sans contrôle ni comptes rendus imposés).", "Si l'explication vous convient, dire clairement que le sujet est clos pour vous.", "Si le doute reste, ouvrir un dossier dans « Analyser un récit » pour séparer les faits des suppositions."], "studies": [], "links": ["recit", "journal", "pause"], "safety": false, "n": 2}, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]}, "en": {"scenarios": [["You see your partner at a restaurant with someone", "A meal together", "", ""], ["You see your partner leaving a hotel with someone", "Clarify the context", "I saw you leaving that hotel with someone. What was the context?", "Hotels host meetings, visits and overnight stays. Leaving one does not prove sexual activity."], ["Someone has just driven your partner home", "Someone drives your partner", "", ""], ["You see your partner kissing someone", "Check what you saw", "", ""], ["Your partner refuses to show private conversations", "Privacy and trust", "", ""], ["Your partner goes out without explaining their plans", "Communicate without monitoring", "", ""], ["Your partner becomes nervous during your conversation", "Make room for discomfort", "", ""], ["Your partner dresses up for an ordinary outing", "Appearance and assumptions", "", ""], ["Your partner’s account contains a contradiction", "Clarify without trapping", "", ""], ["Your partner wants less intimate contact", "Listen to needs", "", ""], ["Your partner exchanges many messages with someone", "Agree on boundaries", "", ""], ["Your partner acknowledges a relationship with another person", "Choose what comes next", "", ""], ["You often suspect cheating without new facts", "Understand your worry", "", ""], ["Your conversation about fidelity turns into an argument", "Take a step back", "", ""], ["You do not share the same agreement on exclusivity", "Clarify exclusivity", "", ""], ["Your partner refuses to discuss your doubts", "Respect and personal needs", "", ""], ["Your partner acknowledges deleting messages to hide them from you", "Acknowledged deletion, content to clarify", "", ""], ["Your partner tells you about an undisclosed messaging account", "A separate account, usage to clarify", "", ""], ["Your partner acknowledges hidden emotional intimacy with someone", "An emotional bond and relationship boundaries", "", ""], ["Your partner acknowledges using a dating app", "Current use, status and intention", "", ""], ["Your partner acknowledges inventing an outing or trip", "An acknowledged false account", "", ""], ["Your partner admits online sexual exchanges but says “it’s only virtual”", "Define digital infidelity together", "", ""], ["Your partner acknowledges hiding a spending item involving someone", "A financial secret, motive to understand", "", ""], ["Your partner acknowledges telling someone they are single", "Denying relationship status to another person", "", ""]], "signs": [], "dangerItems": [["Death threats or a weapon used to intimidate", "Words or actions that make you fear injury or death. You do not have to wait for an assault."], ["Pressure on the neck or suffocation", "Any restriction of breathing or pressure on the neck is serious, even without visible marks. Seek prompt medical assessment."], ["Control of movement and phone use", "Demanding passwords, location tracking or reports under threat goes beyond communication."], ["Isolation", "Preventing contact with friends, family, work or outside support reduces independence."], ["Sexual violence or coercion", "Forcing contact, continuing after a refusal or pressuring someone into sexual activity. A relationship never replaces consent."], ["Stalking after separation", "Following someone, repeated unwanted contact or repeatedly appearing at their regular locations."], ["Economic or administrative control", "Taking money or documents, blocking employment or using immigration status as a threat."], ["Repeated humiliation and intimidation", "Belittling, frightening, destroying property or threatening loved ones to obtain compliance."], ["Escalation", "More frequent violence, more specific threats or weapon use call for specialist support."], ["Disregard for boundaries", "Punishing a refusal, preventing departure or imposing one-sided rules through fear."]], "fiches": [null, {"id": "hotel", "type": "doute", "badge": "context", "title": "You see your partner leaving a hotel with someone", "subtitle": "Clarify the context", "conclude": "Hotels also host meetings, meals, visiting relatives and business stays. What you saw shows that two people were in the same place at the same time. On its own, this says nothing about their relationship or what happened inside.", "explanations": ["A work appointment (meeting, seminar, client, interview) in the hotel lounges or restaurant.", "Someone visiting the city (family, friend, colleague) who is staying at the hotel.", "A meal, a drink or an event (wedding, conference) held there.", "A relationship your partner has not told you about, as a friend or intimate.", "A chance meeting on the way out."], "clarify": ["Write down what you actually saw: the time, the exact spot (lobby, parking lot, restaurant), how the two people behaved. Keep it separate from what you thought about it.", "Remember what your partner had told you about their day, without drawing conclusions.", "Ask the question directly, describing the fact without interpreting it."], "avoid": ["Confronting your partner or the other person on the spot, or following them.", "Searching the phone, calendar or receipts to “check” before talking about it.", "Setting a trap (“Where were you this afternoon?”) when you already know: it damages trust, whatever the answer."], "firstHours": ["Let the peak of emotion pass before you talk about it. A few hours are often enough.", "Write what you saw in “My journal” so it does not get distorted over time.", "If you need to talk right away, choose a person you trust who does not know the other person, to avoid rumors."], "question": "I saw you leaving the hotel [name/place] around [time] with someone. I'd rather talk to you about it directly: what were you doing there?", "answers": [{"label": "A clear explanation (meeting, visiting relative…)", "advice": "Say it back to show you understood: “If I understand correctly, you had a meeting with…”. Also say how you felt when you saw it, without blaming.", "followUp": "Are there moments like this one you'd rather tell me about ahead of time, to avoid this kind of misunderstanding?"}, {"label": "A vague explanation (“nothing special”, “a work thing”)", "advice": "Vagueness is not proof. Ask for one detail, calmly, then let your partner answer.", "followUp": "I'm not accusing you of anything, I just need to understand: who is this person to you?"}, {"label": "Anger (“Are you watching me?”)", "advice": "Explain that you were there by chance (if that is true) and that you prefer to talk rather than keep the doubt. If voices rise, suggest a pause.", "followUp": "I don't want to watch over you. That's exactly why I'm talking to you, so I don't keep ideas in my head."}, {"label": "Refusal to answer", "advice": "Respect the refusal for now: it is not a confession. Say the question still matters to you and suggest another time.", "followUp": "Okay, not now. Can we talk about it again tomorrow evening?"}, {"label": "Acknowledging a hidden relationship", "advice": "Take time to absorb it. You do not have to decide anything now. Switch to the “acknowledgment” path (situation 12).", "followUp": "I need time to think. We'll talk again when I'm ready."}], "next": ["Agree on what each of you wants to know about the other's outings (no control, no required reports).", "If the explanation works for you, say clearly that the matter is closed for you.", "If doubt remains, open a file in “Story analysis” to separate facts from assumptions."], "studies": [], "links": ["recit", "journal", "pause"], "safety": false, "n": 2}, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]}, "es": {"scenarios": [["Ves a tu pareja en un restaurante con alguien", "Una comida en compañía", "", ""], ["Ves a tu pareja salir de un hotel con alguien", "Aclarar el contexto", "Te vi salir de ese hotel con alguien. ¿En qué contexto estaban allí?", "Los hoteles acogen reuniones, visitas y estancias. Salir de uno no demuestra una relación sexual."], ["Alguien acaba de llevar a tu pareja en coche", "Alguien lleva a tu pareja", "", ""], ["Ves a tu pareja besar a alguien", "Comprobar lo observado", "", ""], ["Tu pareja se niega a mostrar conversaciones privadas", "Privacidad y confianza", "", ""], ["Tu pareja sale sin explicar sus planes", "Comunicarse sin vigilar", "", ""], ["Tu pareja se pone nerviosa durante la conversación", "Dar espacio al malestar", "", ""], ["Tu pareja se arregla para una salida cotidiana", "Apariencia e interpretaciones", "", ""], ["El relato de tu pareja contiene una contradicción", "Aclarar sin tender trampas", "", ""], ["Tu pareja desea menos contacto íntimo", "Escuchar las necesidades", "", ""], ["Tu pareja intercambia muchos mensajes con alguien", "Acordar límites", "", ""], ["Tu pareja reconoce una relación con otra persona", "Elegir cómo seguir", "", ""], ["Sospechas a menudo una infidelidad sin hechos nuevos", "Comprender la preocupación", "", ""], ["La conversación sobre fidelidad se convierte en discusión", "Tomar distancia", "", ""], ["No tienen el mismo acuerdo sobre exclusividad", "Aclarar la exclusividad", "", ""], ["Tu pareja se niega a hablar de tus dudas", "Respeto y necesidades personales", "", ""], ["Tu pareja reconoce haber borrado mensajes para ocultártelos", "Borrado reconocido, contenido por aclarar", "", ""], ["Tu pareja te habla de una cuenta de mensajería no declarada", "Otra cuenta, uso por aclarar", "", ""], ["Tu pareja reconoce intimidad emocional oculta con alguien", "Un vínculo emocional y los límites de la pareja", "", ""], ["Tu pareja reconoce usar una aplicación de citas", "Uso actual, estado e intención", "", ""], ["Tu pareja reconoce haber inventado una salida o viaje", "Un relato falso reconocido", "", ""], ["Tu pareja admite intercambios sexuales en línea pero dice «solo es virtual»", "Definir juntos la infidelidad digital", "", ""], ["Tu pareja reconoce ocultar un gasto relacionado con alguien", "Un secreto financiero, motivo por comprender", "", ""], ["Tu pareja reconoce haberse presentado como soltera", "Negar la relación ante otra persona", "", ""]], "signs": [], "dangerItems": [["Amenazas de muerte o uso intimidatorio de armas", "Palabras o actos que hacen temer lesiones o la muerte. No hace falta esperar una agresión."], ["Presión en el cuello o asfixia", "Cualquier presión en el cuello o restricción de la respiración es grave, incluso sin marcas. Busca atención médica pronta."], ["Control de movimientos y teléfono", "Exigir contraseñas, ubicación o explicaciones bajo amenaza va más allá de comunicarse."], ["Aislamiento", "Impedir el contacto con familiares, amistades, el trabajo o apoyos externos reduce la autonomía."], ["Violencia o coacción sexual", "Forzar contacto, continuar tras una negativa o presionar para obtener actos sexuales. La pareja no sustituye el consentimiento."], ["Acoso después de una separación", "Seguir a la persona, insistir con contactos no deseados o aparecer repetidamente en sus lugares habituales."], ["Control económico o administrativo", "Retener dinero o documentos, impedir trabajar o amenazar con el estatus migratorio."], ["Humillación e intimidación repetidas", "Menospreciar, asustar, romper objetos o amenazar a seres queridos para obtener obediencia."], ["Escalada", "Violencia más frecuente, amenazas más concretas o uso de armas requieren apoyo especializado."], ["No respetar los límites", "Castigar una negativa, impedir salir o imponer reglas unilaterales mediante el miedo."]], "fiches": [null, {"id": "hotel", "type": "doute", "badge": "context", "title": "Ves a tu pareja salir de un hotel con alguien", "subtitle": "Aclarar el contexto", "conclude": "Un hotel también recibe reuniones, comidas, visitas de familiares o estancias de trabajo. Lo que usted vio muestra que dos personas estaban en el mismo lugar al mismo tiempo. Eso, por sí solo, no dice nada de su relación ni de lo que pasó dentro.", "explanations": ["Una cita de trabajo (reunión, seminario, cliente, entrevista) en los salones o el restaurante del hotel.", "Una persona de paso por la ciudad (familia, amigo, colega) que se aloja en el hotel.", "Una comida, una copa o un evento (boda, conferencia) organizado allí.", "Una relación que su pareja no le ha contado, de amistad o íntima.", "Un encuentro casual al salir."], "clarify": ["Anote lo que realmente vio: la hora, el lugar exacto (vestíbulo, estacionamiento, restaurante), la actitud de las dos personas. Sepárelo de lo que pensó al respecto.", "Recuerde lo que su pareja le había contado de su día, sin sacar conclusiones.", "Haga la pregunta directamente, describiendo el hecho sin interpretarlo."], "avoid": ["Increpar a su pareja o a la otra persona en el lugar, o seguirlos.", "Revisar a escondidas el teléfono, la agenda o los recibos para «comprobar» antes de hablar.", "Tender una trampa («¿Dónde estabas esta tarde?») cuando usted ya lo sabe: eso daña la confianza, sea cual sea la respuesta."], "firstHours": ["Deje pasar el pico de emoción antes de hablar del tema. A menudo bastan unas horas.", "Escriba lo que vio en «Mi diario» para no deformarlo con el tiempo.", "Si necesita hablarlo enseguida, elija a una persona de confianza que no conozca a la otra persona, para evitar rumores."], "question": "Te vi salir del hotel [nombre/lugar] hacia las [hora] con una persona. Prefiero hablarlo contigo directamente: ¿qué hacías allí?", "answers": [{"label": "Una explicación precisa (reunión, familiar de paso…)", "advice": "Repita con sus palabras lo que entendió: «Si entiendo bien, tenías una reunión con…». Diga también lo que sintió al verlo, sin reproches.", "followUp": "¿Hay momentos como ese que preferirías contarme antes, para evitar este tipo de malentendido?"}, {"label": "Una explicación vaga («nada especial», «cosas del trabajo»)", "advice": "Lo vago no es una prueba. Pida una sola precisión, con calma, y deje que su pareja responda.", "followUp": "No te acuso de nada, solo necesito entender: ¿quién era esa persona para ti?"}, {"label": "Enojo («¿me estás vigilando?»)", "advice": "Explique que estaba allí por casualidad (si es así) y que prefiere hablarlo antes que quedarse con la duda. Si el tono sube, proponga una pausa.", "followUp": "No quiero vigilarte. Justamente te lo cuento para no quedarme con ideas en la cabeza."}, {"label": "Un rechazo a responder", "advice": "Respete el rechazo por ahora: no es una confesión. Diga que la pregunta sigue siendo importante para usted y proponga otro momento.", "followUp": "De acuerdo, ahora no. ¿Podemos volver a hablarlo mañana por la noche?"}, {"label": "El reconocimiento de una relación oculta", "advice": "Tómese tiempo para asimilarlo. No tiene que decidir nada ahora. Pase al recorrido «confesión» (situación 12).", "followUp": "Necesito tiempo para pensar. Lo hablaremos cuando esté listo/a."}], "next": ["Acordar qué desea saber cada uno de las salidas del otro (sin control ni informes obligatorios).", "Si la explicación le convence, decir claramente que para usted el tema está cerrado.", "Si la duda sigue, abrir un caso en «Analizar un relato» para separar los hechos de las suposiciones."], "studies": [], "links": ["recit", "journal", "pause"], "safety": false, "n": 2}, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]}, "ht": {"scenarios": [["Ou wè patnè w nan restoran ak yon lòt moun", "Yon manje ansanm", "", ""], ["Ou wè patnè w soti nan otèl ak yon lòt moun", "Klarifye sitiyasyon an", "Mwen wè w ap soti nan otèl sa a ak yon moun. Nan ki okazyon nou te la?", "Otèl resevwa reyinyon, vizit ak moun k ap pase nwit. Soti nan otèl pa pwouve te gen relasyon seksyèl."], ["Yon moun fèk depoze patnè w nan machin", "Yon moun mennen patnè w", "", ""], ["Ou wè patnè w ap bo yon lòt moun", "Verifye sa ou wè", "", ""], ["Patnè w refize montre konvèsasyon prive li yo", "Vi prive ak konfyans", "", ""], ["Patnè w soti san li pa esplike plan li yo", "Kominike san siveye", "", ""], ["Patnè w vin nève pandan konvèsasyon an", "Bay malèz la plas", "", ""], ["Patnè w abiye byen pou yon sòti òdinè", "Aparans ak entèpretasyon", "", ""], ["Istwa patnè w rakonte a gen yon kontradiksyon", "Klarifye san pyèj", "", ""], ["Patnè w vle mwens kontak entim", "Koute bezwen yo", "", ""], ["Patnè w voye anpil mesaj ak yon moun", "Dakò sou limit yo", "", ""], ["Patnè w rekonèt li gen yon relasyon ak yon lòt moun", "Chwazi sa k ap vini apre", "", ""], ["Ou sispèk enfidelite souvan san nouvo enfòmasyon", "Konprann enkyetid ou", "", ""], ["Konvèsasyon sou fidelite a tounen diskisyon", "Pran distans", "", ""], ["Nou pa gen menm antant sou fidelite", "Klarifye fidelite a", "", ""], ["Patnè w refize pale sou dout ou yo", "Respè ak bezwen pèsonèl", "", ""], ["Patnè w rekonèt li te efase mesaj pou kache yo pou ou", "Li rekonèt efase yo, sa ki te ladan yo pou klarifye", "", ""], ["Patnè w pale w de yon kont mesaj li pa t mansyone", "Yon lòt kont, itilizasyon pou klarifye", "", ""], ["Patnè w rekonèt yon pwoksimite emosyonèl li te kache ak yon moun", "Lyen emosyonèl ak limit koup la", "", ""], ["Patnè w rekonèt li sèvi ak yon aplikasyon pou rankont damou", "Itilizasyon aktyèl, estati ak entansyon", "", ""], ["Patnè w rekonèt li te envante yon sòti oswa deplasman", "Yon fo istwa li rekonèt", "", ""], ["Patnè w admèt mesaj seksyèl sou entènèt men li di «se sèlman vityèl»", "Defini enfidelite sou entènèt ansanm", "", ""], ["Patnè w rekonèt li kache yon depans ki gen rapò ak yon moun", "Sekrè sou lajan, rezon pou konprann", "", ""], ["Patnè w rekonèt li te di yon moun li selibatè", "Li nye relasyon an devan yon lòt moun", "", ""]], "signs": [], "dangerItems": [["Menas lanmò oswa zam pou fè pè", "Pawòl oswa zak ki fè w pè blese oswa mouri. Ou pa bezwen tann yo atake w."], ["Presyon nan kou oswa anpeche respire", "Nenpòt presyon nan kou oswa blokaj souf grav, menm san mak. Chèche swen medikal rapid."], ["Kontwòl deplasman ak telefòn", "Egzije modpas, pozisyon GPS oswa rapò anba menas depase kominikasyon nòmal."], ["Izolasyon", "Anpeche kontak ak fanmi, zanmi, travay oswa sipò deyò diminye endepandans."], ["Vyolans oswa fòse nan sèks", "Fòse kontak, kontinye apre yon non oswa fè presyon pou jwenn sèks. Relasyon pa ranplase konsantman."], ["Asèlman apre separasyon", "Swiv moun nan, kontinye kontakte l san l pa vle oswa parèt souvan kote li konn ale."], ["Kontwòl lajan oswa dokiman", "Pran lajan oswa papye, anpeche moun travay oswa sèvi ak estati imigrasyon pou menase l."], ["Imilyasyon ak entimidasyon repete", "Rabese moun, fè l pè, kraze bagay oswa menase pwòch li pou fè l obeyi."], ["Vyolans k ap ogmante", "Vyolans pi souvan, menas pi presi oswa itilizasyon zam mande èd espesyalize."], ["Pa respekte limit", "Pini yon refi, anpeche moun soti oswa enpoze règ pou yon sèl bò ak laperèz."]], "fiches": [null, {"id": "hotel", "type": "doute", "badge": "context", "title": "Ou wè patnè w soti nan otèl ak yon lòt moun", "subtitle": "Klarifye sitiyasyon an", "conclude": "Yon otèl resevwa tou reyinyon, manje, fanmi k ap vizite oswa moun k ap vwayaje pou travay. Sa ou wè a montre de moun te nan menm kote a, nan menm moman an. Pou kont li, sa pa di anyen sou relasyon yo, ni sou sa k te pase anndan an.", "explanations": ["Yon randevou travay (reyinyon, seminè, kliyan, entèvyou) nan salon oswa restoran otèl la.", "Yon moun ki pase nan vil la (fanmi, zanmi, kòlèg) epi ki desann nan otèl la.", "Yon manje, yon bwè oswa yon evènman (maryaj, konferans) ki te fèt la.", "Yon relasyon patnè w pa t di w, kit se zanmitay kit se entimite.", "Yon rankont pa aza lè li t ap soti."], "clarify": ["Ekri sa ou te wè toutbon: lè a, kote egzat la (lobi, pakin, restoran), jan de moun yo te ye. Separe sa ak sa ou te panse.", "Sonje sa patnè w te di w sou jounen li, san ou pa tire konklizyon.", "Poze kesyon an dirèkteman, epi dekri fè a san ou pa entèprete l."], "avoid": ["Rele patnè w oswa lòt moun nan sou plas, oswa swiv yo.", "Fouye telefòn, ajanda oswa resi yo pou «verifye» anvan ou pale.", "Pare yon pyèj («Ki kote ou te ye apremidi a?») pandan ou deja konnen: sa kraze konfyans, kèlkeswa repons lan."], "firstHours": ["Kite emosyon an bese anvan ou pale de sa. Souvan, kèk èdtan ase.", "Ekri sa ou te wè nan «Jounal mwen» pou ou pa defòme l ak tan.", "Si ou bezwen pale de sa touswit, chwazi yon moun ou fè konfyans ki pa konnen lòt moun nan, pou evite tripotay."], "question": "Mwen te wè w soti nan otèl [non/kote] vè [lè] ak yon moun. Mwen pito pale avè w dirèkteman: kisa ou t ap fè la a?", "answers": [{"label": "Yon eksplikasyon klè (reyinyon, fanmi ki t ap vizite…)", "advice": "Repete sa ou konprann pou montre ou te koute: «Si m byen konprann, ou te gen yon reyinyon ak…». Di tou sa ou te santi, san repwòch.", "followUp": "Èske gen moman konsa ou ta pito di m davans, pou nou evite kalite malantandi sa a?"}, {"label": "Yon eksplikasyon ki pa klè («anyen espesyal», «yon zafè travay»)", "advice": "Yon repons ki pa klè pa yon prèv. Mande yon sèl detay, ak kalm, epi kite patnè w reponn.", "followUp": "Mwen pa akize w de anyen, mwen jis bezwen konprann: kiyès moun sa a ye pou ou?"}, {"label": "Kòlè («w ap siveye m?»)", "advice": "Esplike ou te la pa aza (si se sa), e ou pito pale pase ou rete ak dout la. Si ton an monte, pwopoze yon poz.", "followUp": "Mwen pa vle siveye w. Se pou sa m ap pale avè w, pou m pa rete ak lide nan tèt mwen."}, {"label": "Li refize reponn", "advice": "Respekte refi a pou kounye a: se pa yon konfesyon. Di kesyon an toujou enpòtan pou ou, epi pwopoze yon lòt moman.", "followUp": "Dakò, pa kounye a. Èske nou ka pale de sa ankò demen swa?"}, {"label": "Li rekonèt yon relasyon kache", "advice": "Pran tan pou ou absòbe sa. Ou pa gen anyen pou deside kounye a. Pase nan chemen «sa li rekonèt» (sitiyasyon 12).", "followUp": "Mwen bezwen tan pou m reflechi. N a pale de sa ankò lè m pare."}], "next": ["Dakò sou sa chak moun vle konnen sou sòti lòt la (san kontwòl, san okenn moun pa oblije bay rapò).", "Si eksplikasyon an satisfè w, di klèman ke koze a fini pou ou.", "Si dout la rete, louvri yon dosye nan «Analize yon istwa» pou separe fè yo ak sa ou sipoze."], "studies": [], "links": ["recit", "journal", "pause"], "safety": false, "n": 2, "reviewed": false}, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]}}; const UI={"fr": {"navHome": "Doutes de tromperie", "navSigns": "Corps & expressions", "navSafety": "Signaux de danger", "navContext": "Mon contexte", "navJournal": "Mon journal", "navCalm": "Faire une pause", "navigation": "Navigation principale", "language": "Langue", "footer": "Pour toutes les personnes et tous les couples · Des faits, de l’écoute, des limites partagées.", "heroEyebrow": "Votre histoire mérite une vraie conversation", "heroTitle": "Et si on se comprenait mieux ?", "heroText": "Une situation vous trouble ? Préparez une conversation respectueuse, explorez plusieurs explications et posez vos limites.", "heroButton": "On en parle ? →", "photoAlt": "Un couple partage un sourire et un moment de complicité sur un canapé.", "photoBadge": "Se retrouver commence par un mot.", "noVerdict": "Aucun geste, expression ou questionnaire ne prouve une infidélité ou un rapport sexuel. Cette application aide à dialoguer, sans score de suspicion.", "catalogEyebrow": "{ rontes a tu pareja para ponerla a prueba.", "unknownResult": "Este cuestionario no descarta peligro. Si tienes miedo o dudas, puedes pedir apoyo especializado sin pruebas ni certeza.", "contactHelp": "Contactar apoyo confidencial en Estados Unidos", "unsavedWarning": "Hay texto sin guardar. Cambiar de idioma borrará los campos no guardados. ¿Continuar?", "navGuide": "Cómo usar", "helpTitleGuide": "Un paso a la vez.", "guideIntro": "Elige lo que corresponda a tus necesidades. No tienes que completar todos los módulos.", "guideTitles": "1. Revisar tu seguridad;2. Elegir una situación;3. Leer antes de hablar;4. Seguir las respuestas;5. Adaptar al contexto;6. Escribir o hacer una pausa", "guideTexts": "Si tienes miedo, abre Señales de peligro. En peligro inmediato, contacta emergencias en lugar de iniciar una conversación.;En Explorar, busca lo observado: restaurante, hotel, beso, teléfono, etc. Abre Preparar la conversación.;Lee las posibles explicaciones y comprueba lo observado. Pregunta si es buen momento y luego usa la pregunta propuesta.;Elige la categoría que describe la respuesta: explicación, contradicción concreta, negativa o límite reconocido. Lee el consejo y elige cómo seguir. La aplicación no verifica la respuesta.;En Mi contexto, indica hábitos conocidos y preferencias de comunicación. Obtén una formulación adaptada sin puntuación de fidelidad.;En Mi diario, separa observación, interpretación, emociones y necesidades. Guarda, exporta o elimina. En Hacer una pausa, tómate un minuto antes de continuar.", "guideScenario": "Para cada situación", "guideScenarioText": "Observación → Pregunta abierta → Escucha → Aclaración si hace falta → Acuerdo o decisión personal. Una reacción corporal o negativa no es una confesión.", "observedLabel": "Lo que observas", "conclusionLabel": "Lo que permite concluir", "doubtIntro": "¿Te preguntas si tu pareja te es infiel? Elige la escena que realmente observaste. La aplicación te ayuda a comprenderla y hablar de ella; no detec async function ccOpen(P, code){
  let s=String(code).replace(/\s+/g,"").toUpperCase(); if(/^0[1-9]{8}$/.test(s)) s="O"+s.slice(1);
  const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)), E=new TextEncoder();

  const id=Array.from(bits.slice(0,8)).map(x=>x.toString(16).padStart(2,"0")).join(""), e=P.ring[id];

  const mk=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(e[0])},wk,b(e[1]));
  const key=await crypto.subtle.importKey("raw",mk,"AES-GCM",false,["decrypt"]);

   l'app propose, l'utilisateur confirme. Aucun score de mensonge ou de sincérité. */
const RECIT_KEY = 'soutien-recit-v1';
const R = (k) => (RECIT[lang] && RECIT[lang][k]) ?? RECIT.fr[k] ?? k;

/* ---------- stockage ---------- */
function recitLoad() {
  try { return JSON.parse(localStorage.getItem(RECIT_KEY)) || { dossiers: [] }; } catch { return { dossiers: [] }; }
}
function recitSave(db) {
  try { localStorage.setItem(RECIT_KEY, JSON.stringify(db)); return true; } catch { alert(R('saveFailed')); return false; }
}
function recitUid(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
function recitGet(db, id) { return db.dossiers.find((d) => d.id === id); }
function recitBump(d) { d.version = (d.version || 0) + 1; d.updated = new Date().toISOString(); }
function recitDate(iso) { try { return new Date(iso).toLocaleString(localeTags[lang]); } catch { return iso; } }

function recitIdb(fn) {
  return new Promise((ok, ko) => {
    try {
      const rq = indexedDB.open('soutien-recit-audio', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('audio');
      rq.onsuccess = () => { const tx = rq.result.transaction('audio', 'readwrite'); fn(tx.objectStore('audio'), ok); tx.onerror = () => ko(tx.error); };
      rq.onerror = () => ko(rq.error);
    } catch (e) { ko(e); }
  });
}
const recitAudioPut = (id, blob) => recitIdb((s, ok) => { s.put(blob, id); ok(); });
const recitAudioGet = (id) => recitIdb((s, ok) => { const r = s.get(id); r.onsuccess = () => ok(r.result); });
const recitAudioDel = (id) => recitIdb((s, ok) => { s.delete(id); ok(); });

const DAYS = {
  fr: ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'],
  en: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'],
  es: ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'],
  ht: ['lendi', 'madi', 'mèkredi', 'jedi', 'vandredi', 'samdi', 'dimanch'],
};

function norm(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, ''); }
function hasTerm(text, term) {
  const t = norm(text), w = norm(term);
  return new RegExp('(^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(t);
}
function findTerms(text, list) {
  const seen = new Set();
  const found = (list || []).filter((w) => hasTerm(text, w) && !seen.has(norm(w)) && seen.add(norm(w)));
  // keep the longest expression only (« plus tard » makes « tard » redundant); spelling variants were merged above
  return found.filter((w) => !found.some((o) => norm(o).length > norm(w).length && hasTerm(o, w)));
}

/** Détection simple de langue (mots fréquents) — toujours confirmée par l'utilisateur. */
function detectLang(text) {
  const words = norm(text).split(/[^a-z']+/).filter(Boolean);
  if (words.length < 3) return null;
  let best = null, bestScore = 0;
  for (const l of ANSWER_LANGS) {
    const set = new Set(norm(LEX.stop[l]).split(' '));
    const score = words.filter((w) => set.has(w)).length / words.length;
    if (score > bestScore) { bestScore = score; best = l; }
  }
  return bestScore >= 0.12 ? best : null;
}

/** Repères factuels extraits d'une phrase : heures, dates, jours, nombres. */
const reEsc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const HOUR_TXT = '\\d{1,2}\\s*(?:h|:|heures?|hours?|horas?|e)?\\s*(?:\\d{2})?(?:\\s*(?:am|pm))?';
function facts(text, l, raw) {
  const out = { times: [], dates: [], days: [], numbers: [] };
  let t = norm(text);
  if (!raw) for (const m of LEX.habitual.map(norm)) {
    t = t.replace(new RegExp(reEsc(m) + '\\s*(?:a|vers|at|a las|nan)?\\s*' + HOUR_TXT, 'g'), ' ');
    t = t.replace(new RegExp(HOUR_TXT + '\\s*' + reEsc(m), 'g'), ' ');
  }
  // Haitian Creole writes hours as « 9è » (norm() removes the accent → « 9e »); elsewhere « 9e » would be an ordinal
  const hour = l === 'ht' ? /\b(\d{1,2})\s*(?:h|:|heures?|hours?|horas?|e)\s*(\d{2})?\b/g : /\b(\d{1,2})\s*(?:h|:|heures?|hours?|horas?)\s*(\d{2})?\b/g;
  for (const m of t.matchAll(hour)) out.times.push(m[1].padStart(2, '0') + ':' + (m[2] || '00'));
  for (const m of t.matchAll(/\b(\d{1,2})\s*(am|pm)\b/g)) { let h = +m[1] % 12; if (m[2] === 'pm') h += 12; out.times.push(String(h).padStart(2, '0') + ':00'); }
  for (const m of t.matchAll(/\b(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?\b/g)) out.dates.push(m[1].padStart(2, '0') + '/' + m[2].padStart(2, '0'));
  for (const l of ANSWER_LANGS) for (const d of DAYS[l]) if (hasTerm(text, d)) out.days.push(DAYS.fr[DAYS[l].indexOf(d)]);
  for (const m of t.matchAll(/\b(\d+)\b/g)) out.numbers.push(m[1]);
  return out;
}
const DAY_WORDS = new Set(Object.values(DAYS).flat().map(norm));
// approximation / time words never show that two claims describe the same action (« vers 18 h » / « vers 20 h »)
['vers', 'environ', 'pres', 'heure', 'heures', 'soir', 'matin', 'nuit', 'around', 'about', 'hour', 'hours', 'evening', 'morning', 'night',
 'hacia', 'hora', 'horas', 'noche', 'tarde', 'manana', 'anviwon', 'apepre', 'lannwit', 'aswe', 'maten'].forEach((w) => DAY_WORDS.add(w));
function contentWords(text, l, exclude) {
  const stop = new Set(norm(LEX.stop[l] || LEX.stop.fr).split(' '));
  return new Set(norm(text).split(/[^a-z0-9]+/).filter((w) => w.length > 3 && !/^\d+$/.test(w) && !stop.has(w) && !DAY_WORDS.has(w) && !(exclude && exclude.has(w))));
}
/** Names of the people in the case (« Personnes concernées ») never show that two claims share a topic. */
function personWords(d) {
  return new Set(norm(d.persons || '').split(/[^a-z]+/).filter((w) => w.length > 2));
}
function splitSentences(text) {
  // the "[? … ?]" markers contain "?" + space: hide them while splitting so they never end a sentence
  return String(text || '').replace(/\[\?([\s\S]*?)\?\]/g, (m, inner) => '⁅' + inner.replace(/[.!?]/g, '·') + '⁆')
    .split(/(?<=[.!?…])\s+|\n+/).map((s) => s.trim().replace(/⁅/g, '[?').replace(/⁆/g, '?]')).filter((s) => s.length > 2);
}
/** Quote without its final punctuation, so « … » never ends with « . ». */
const bare = (s) => String(s || '').replace(/[\s.!?…:;,]+$/, '');
function hasUncertain(text) { return /\[\?[\s\S]*?\?\]/.test(text || ''); }

/** Rassemble toutes les sources actives : éléments initiaux, réponses validées, pièces. */
function recitSources(d) {
  const src = [];
  if ((d.desc || '').trim()) src.push({ ref: 'desc', label: R('refDescription'), text: d.desc, nature: 'interp', lang: d.analysisLang || lang, kind: 'initial' });
  (d.items || []).forEach((it, i) => src.push({ ref: it.id, label: R('refInitial') + ' ' + (i + 1), text: it.text, nature: it.nature, lang: d.analysisLang || lang, kind: 'initial' }));
  (d.answers || []).filter((a) => a.active !== false).forEach((a, i) => {
    const q = (d.questions || []).find((x) => x.id === a.qid);
    src.push({ ref: a.id, label: R('refAnswer') + ' ' + (i + 1), text: a.validated, lang: a.lang, kind: 'answer', question: q ? q.text : '' });
  });
  (d.pieces || []).filter((p) => p.active !== false).forEach((p, i) => src.push({ ref: p.id, label: R('refPiece') + ' ' + (i + 1) + ' — ' + p.title, text: p.content || p.description || '', nature: 'doc', lang: d.analysisLang || lang, kind: 'piece', date: p.date, independent: p.independent }));
  return src;
}

/** Étapes 1 à 4 : propose affirmations, ambiguïtés, écarts — en conservant les choix déjà faits. */
function recitAnalyse(d) {
  const sources = recitSources(d);
  const keepClaims = new Map((d.claims || []).map((c) => [c.key, c]));
  const keepAmb = new Map((d.ambiguities || []).map((a) => [a.key, a]));
  const keepGaps = new Map((d.gaps || []).map((g) => [g.key, g]));
  const claims = [], amb = [], gaps = [];
  for (const s of sources) {
    splitSentences(s.text).forEach((sentence, i) => {
      const key = s.ref + '#' + i;
      const l = s.lang || lang;
      const hedges = findTerms(sentence, LEX.hedge[l]), hearsay = findTerms(sentence, LEX.hearsay[l]);
      const prev = keepClaims.get(key);
      const auto = hearsay.length ? 'report' : (s.kind === 'piece' ? 'doc' : (s.nature || 'obs'));
      const fx = facts(sentence, l);
      const checkable = auto !== 'interp' && auto !== 'suspicion' && (fx.times.length + fx.dates.length + fx.days.length > 0 || LEX.place.test(norm(sentence)));
      const c = Object.assign({
        key, id: 'A' + (claims.length + 1), ref: s.ref, label: s.label, text: sentence, lang: l,
        nature: auto, central: false, described: false, verifiable: checkable, status: 'unverified',
        verifySource: '', verifyNote: '', uncertain: hasUncertain(sentence),
      }, prev || {}, { id: 'A' + (claims.length + 1), text: sentence, label: s.label, hedges, hearsay, facts: fx, uncertain: hasUncertain(sentence) });
      claims.push(c);
      const mk = (kind, term, qKey) => {
        const k = key + '|' + kind + '|' + norm(term);
        const p = keepAmb.get(k);
        amb.push(Object.assign({ key: k, claim: c.id, ref: s.ref, label: s.label, kind, term, text: sentence, resolved: false, resolution: '' }, p || {}, { claim: c.id, question: RL(qKey, d.analysisLang || lang).replace('{x}', term) }));
      };
      findTerms(sentence, LEX.vagueTime[l]).forEach((term) => mk('time', term, 'qVagueTime'));
      findTerms(sentence, LEX.vaguePerson[l]).forEach((term) => mk('person', term, 'qVaguePerson'));
      findTerms(sentence, LEX.vagueThing[l]).forEach((term) => mk('thing', term, 'qVagueThing'));
      findTerms(sentence, LEX.approx[l]).forEach((term) => mk('approx', term, 'qApprox'));
      if (hearsay.length) mk('source', hearsay[0], 'qHearsay');
      if (c.uncertain) mk('uncertain', '[? ?]', 'qUncertain');
    });
  }
  // Écarts (P1). Two claims are compared only when they describe the same action of the same event:
  // - names of the people and day words never count as a shared topic, nor words found in most claims;
  // - different days → two distinct events → no discrepancy;
  // - different times → discrepancy only for the same action: same day + ≥1 shared action word,
  //   or ≥2 shared action words when a day is missing on one side.
  const exclude = personWords(d);
  const wordsOf = claims.map((c) => contentWords(c.text, c.lang, exclude));
  if (claims.length >= 4) {
    const df = new Map();
    wordsOf.forEach((ws) => ws.forEach((w) => df.set(w, (df.get(w) || 0) + 1)));
    df.forEach((n, w) => { if (n / claims.length > 0.5) exclude.add(w); });
  }
  for (let i = 0; i < claims.length; i++) {
    for (let j = i + 1; j < claims.length; j++) {
      const a = claims[i], b = claims[j];
      if (a.ref === b.ref || a.uncertain || b.uncertain) continue;
      const wb = new Set([...wordsOf[j]].filter((w) => !exclude.has(w)));
      const shared = [...wordsOf[i]].filter((w) => !exclude.has(w) && wb.has(w));
      const dayA = a.facts.days, dayB = b.facts.days;
      if (dayA.length && dayB.length && !dayA.some((x) => dayB.includes(x))) continue; // two different days: two events
      const sameDay = dayA.length > 0 && dayB.length > 0, noDay = !dayA.length && !dayB.length;
      if (!(shared.length >= 2 || ((sameDay || noDay) && shared.length >= 1))) continue; // not the same action
      const diff = [];
      for (const f of ['times', 'dates']) {
        if (a.facts[f].length && b.facts[f].length && !a.facts[f].some((x) => b.facts[f].includes(x))) diff.push([f, a.facts[f].join(', '), b.facts[f].join(', ')]);
      }
      if (!diff.length) continue;
      const key = a.key + '~' + b.key;
      const p = keepGaps.get(key);
      gaps.push(Object.assign({ key, a: a.id, b: b.id, aText: a.text, bText: b.text, aLabel: a.label, bLabel: b.label, kind: 'central', explanation: '', state: 'open', evidence: false },
        p || {}, { a: a.id, b: b.id, aText: a.text, bText: b.text, aLabel: a.label, bLabel: b.label, what: diff.map((x) => R('f_' + x[0]) + ' : ' + x[1] + ' / ' + x[2]).join(' ; '), shared: shared.slice(0, 4).join(', ') }));
    }
  }
  // Écarts ajoutés manuellement par l'utilisateur
  (d.gaps || []).filter((g) => g.manual).forEach((g) => gaps.push(g));
  d.claims = claims; d.ambiguities = amb; d.gaps = gaps.map((g, i) => Object.assign(g, { id: 'E' + (i + 1) }));
  d.lastAnalysis = { at: new Date().toISOString(), version: d.version || 0, answers: (d.answers || []).filter((a) => a.active !== false).length };
  d.analyses = (d.analyses || []).concat([{ at: d.lastAnalysis.at, version: d.lastAnalysis.version, indicators: recitIndicators(d) }]).slice(-30);
  return d;
}

/** Étape 9 : cinq indicateurs de documentation (jamais un score de mensonge). */
function recitIndicators(d) {
  const claims = d.claims || [], amb = d.ambiguities || [], gaps = d.gaps || [];
  const central = claims.filter((c) => c.central);
  const verifiable = claims.filter((c) => c.verifiable);
  const checked = verifiable.filter((c) => c.status !== 'unverified');
  const ind = [
    { key: 'ind1', num: central.filter((c) => c.described).length, den: central.length, empty: 'noCentral' },
    { key: 'ind2', num: amb.filter((a) => a.resolved).length, den: amb.length, empty: 'noAmbiguity' },
    { key: 'ind3', num: checked.length, den: verifiable.length, empty: 'noVerifiable',
      detail: ['corroborated', 'partial', 'contradicted', 'unverifiable'].map((s) => [s, checked.filter((c) => c.status === s).length]) },
    { key: 'ind4', num: gaps.filter((g) => g.state === 'resolved' && g.evidence).length, den: gaps.length, empty: 'noGap',
      detail: [['explainedOnly', gaps.filter((g) => g.state !== 'open' && !g.evidence).length]] },
    { key: 'ind5', num: central.filter((c) => c.status === 'corroborated' || c.status === 'contradicted').length, den: central.length, empty: 'noCentral' },
  ];
  ind.forEach((x) => { x.pct = x.den ? Math.round((100 * x.num) / x.den) : null; });
  return ind;
}

/** Étape 8 : au maximum trois questions neutres, par priorité. */
function recitSuggest(d) {
  const L = d.analysisLang || lang, out = [], seen = new Set((d.questions || []).map((q) => norm(q.text)));
  const push = (q) => { if (out.length < 3 && !seen.has(norm(q.text))) { seen.add(norm(q.text)); out.push(q); } };
  (d.gaps || []).filter((g) => g.state !== 'resolved' && g.kind === 'central').forEach((g) => push({
    text: RL('qGap', L).replace('{a}', bare(g.aText)).replace('{b}', bare(g.bText)), point: g.id + ' — ' + (g.what || ''), why: RL('whyGap', L), target: RL('targetGap', L) }));
  (d.claims || []).filter((c) => c.central && c.verifiable && c.status === 'unverified').forEach((c) => push({
    text: RL('qVerify', L).replace('{x}', bare(c.text)), point: c.id, why: RL('whyVerify', L), target: RL('targetVerify', L) }));
  (d.ambiguities || []).filter((a) => !a.resolved).forEach((a) => push({ text: a.question, point: a.claim + ' — « ' + a.term + ' »', why: RL('whyAmb', L), target: RL('targetAmb', L) }));
  if (!(d.answers || []).length) push({ text: RL('firstQuestion', L), point: '—', why: RL('whyFree', L), target: RL('targetFree', L) });
  return out;
}

/** Hypothèses alternatives à examiner pour les écarts non résolus (jamais un verdict). */
function recitHypotheses(d) {
  const open = (d.gaps || []).filter((g) => g.state !== 'resolved');
  if (!open.length) return [];
  return ['hMemory', 'hMisunderstanding', 'hIncomplete', 'hDocError', 'hTranscription', 'hIncompatible', 'hConcealment'].map((k) => R(k));
}

/* ---------- entretien ---------- */
function recitInterview(d) {
  const qs = d.questions || [], cur = qs[qs.length - 1];
  const hist = qs.map((q, qi) => {

    return `<article class="card recit-qa"><h3>${R('question')} ${qi + 1}</h3>${quote(q.text)}

  }).join('');
  return `<section><h2>${R('history')}</h2>${hist || `<p>${R('noQuestion')}</p>`}</section>
  <section class="card recit-ask"><h2>${R('askTitle')}</h2>
    <label for="qText">${R('currentQuestion')}</label><textarea id="qText" maxlength="800">${esc(cur ? cur.text : RL('firstQuestion', d.analysisLang || lang))}</textarea>
    <div class="actions">${btn(R('addQuestion'), 'recitAddQuestion()')}</div>
    <label for="aLang">${R('answerLang')}</label>${langSelect('aLang', 'auto', true)} <small id="aDetect"></small>
    <label for="aText">${R('answerText')}</label><textarea id="aText" maxlength="8000" placeholder="${esc(R('answerPlaceholder'))}"></textarea>
    <p><small>${R('uncertainHint')}</small></p>
    <div class="actions">${btn(R('markUncertain'), 'recitMarkUncertain()')}</div>
    <div class="recit-audio">
      <label class="recit-consent"><input type="checkbox" id="aConsent"> ${R('consent')}</label>
      <label class="recit-consent"><input type="checkbox" id="aKeep"> ${R('keepAudio')}</label>
      <p><small>${R('speechNotice')}</small></p>
      <div class="actions">${btn('🎙 ' + R('recStart'), 'recitRecStart()')}${btn(R('recPause'), 'recitRecPause()')}${btn(R('recResume'), 'recitRecResume()')}${btn(R('recStop'), 'recitStopRec(true)')}</div>
      <p id="aRecState" role="status" class="recit-rec"></p><audio id="aPlayer" controls hidden></audio>
    </div>
    <label for="aTrans">${R('translationField')}</label><textarea id="aTrans" maxlength="8000" placeholder="${esc(R('translationHint'))}"></textarea>
    <div class="actions"><button class="primary" onclick="recitAddAnswer()">${R('addAnswer')}</button>${btn(R('analyse'), "recitTab('analysis')")}${btn(R('conclusion'), "recitTab('conclusion')")}${btn(R('addPiece'), "recitTab('pieces')")}</div>
    <p id="aStatus" role="status"></p>
  </section>`;
}
function recitAnswerCard(d, a) {
  const off = a.active === false;
  return `<div class="recit-answer ${off ? 'off' : ''}"><p><strong>${R('answer')}</strong> · ${R('lang_' + a.lang)} · ${recitDate(a.created)}${(a.versions || []).length ? ' · ' + R('version') + ' ' + (a.versions.length + 1) : ''}${off ? ' · <em>' + R('removed') + '</em>' : ''}</p>
    <p>${esc(a.validated).replace(/\[\?([\s\S]*?)\?\]/g, `<mark title="${esc(R('toConfirm'))}">$1</mark>`)}</p>
    ${a.original && a.original !== a.validated ? `<details><summary>${R('originalTranscript')}</summary><p>${esc(a.original)}</p></details>` : ''}
    ${a.translation ? `<details><summary>${R('translation')}</summary><p>${esc(a.translation)}</p></details>` : ''}
    ${(a.versions || []).length ? `<details><summary>${R('previousVersions')}</summary>${a.versions.map((v) => `<p><small>${recitDate(v.at)}</small><br>${esc(v.validated)}</p>`).join('')}</details>` : ''}
    ${a.audio ? `<button onclick="recitPlay('${a.id}')">▶ ${R('listen')}</button>` : ''}
    ${off ? '' : `<div class="actions">${btn(R('edit'), `recitEditAnswer('${a.id}')`)}${btn(R('remove'), `recitRemoveAnswer('${a.id}')`)}</div>`}</div>`;
}
function recitBindInterview(d) {
  const ta = document.querySelector('#aText'), info = document.querySelector('#aDetect');
  if (ta && info) ta.oninput = () => { const l = detectLang(ta.value); info.textContent = l ? R('detected') + ' ' + R('lang_' + l) + ' — ' + R('confirmLang') : ''; };
}
function recitAddQuestion() {
  const db = recitLoad(), d = recitGet(db, recitView.id), text = (document.querySelector('#qText').value || '').trim();
  if (!text) return;
  d.questions.push({ id: recitUid('q'), text, created: new Date().toISOString() });
  recitBump(d); recitSave(db); recitWork();
}
function recitMarkUncertain() {
  const ta = document.querySelector('#aText'); if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { ta.setRangeText('[? ' + R('inaudible') + ' ?]', s, e, 'end'); } else { ta.setRangeText('[?' + ta.value.slice(s, e) + '?]', s, e, 'end'); }
  ta.focus();
}
async function recitAddAnswer() {
  const db = recitLoad(), d = recitGet(db, recitView.id);
  const text = (document.querySelector('#aText').value || '').trim(), status = document.querySelector('#aStatus');
  if (!text) { status.textContent = R('emptyAnswer'); return; }
  const consent = document.querySelector('#aConsent');
  if (consent && !consent.checked) {
    status.textContent = R('consentNeeded');
    const box = consent.closest('label'); if (box) box.classList.add('recit-need');
    consent.focus(); return;
  }
  let q = d.questions[d.questions.length - 1];
  const qText = (document.querySelector('#qText').value || '').trim();
  if (!q || (qText && norm(qText) !== norm(q.text))) { q = { id: recitUid('q'), text: qText || RL('firstQuestion', d.analysisLang || lang), created: new Date().toISOString() }; d.questions.push(q); }
  let l = document.querySelector('#aLang').value;
  if (l === 'auto') l = detectLang(text) || lang;
  const a = { id: recitUid('r'), qid: q.id, lang: l, original: (recitRec && recitRec.transcript) || text, validated: text,
    translation: (document.querySelector('#aTrans').value || '').trim(), uncertain: [...text.matchAll(/\[\?([\s\S]*?)\?\]/g)].map((m) => m[1].trim()),
    created: new Date().toISOString(), active: true, versions: [], audio: false };
  if (recitRec && recitRec.blob && document.querySelector('#aKeep').checked) { try { await recitAudioPut(a.id, recitRec.blob); a.audio = true; } catch { /* stockage refusé : on garde la transcription */ } }
  recitRec = null;
  d.answers.push(a); recitBump(d); recitSave(db);
  recitWork(); const st = document.querySelector('#aStatus'); if (st) st.textContent = R('answerAdded');
}
function recitEditAnswer(id) {
  const db = recitLoad(), d = recitGet(db, recitView.id), a = d.answers.find((x) => x.id === id);
  const next = prompt(R('editPrompt'), a.validated);
  if (next == null || !next.trim() || next.trim() === a.validated) return;
  a.versions = (a.versions || []).concat([{ validated: a.validated, at: a.updated || a.created }]);
  a.validated = next.trim(); a.updated = new Date().toISOString();
  recitBump(d); recitSave(db); recitWork();
}
function recitRemoveAnswer(id) {
  if (!confirm(R('confirmRemove'))) return;
  const db = recitLoad(), d = recitGet(db, recitView.id), a = d.answers.find((x) => x.id === id);
  a.active = false; a.removed = new Date().toISOString();
  if (a.audio) { recitAudioDel(a.id).catch(() => {}); a.audio = false; }
  (d.analyses || []).forEach((x) => { x.obsolete = true; });
  recitBump(d); recitSave(db); recitWork();
}
async function recitPlay(id) {
  try { const blob = await recitAudioGet(id); if (!blob) return; const url = URL.createObjectURL(blob); const au = new Audio(url); au.onended = () => URL.revokeObjectURL(url); au.play(); } catch { alert(R('audioMissing')); }
}

/* ---------- audio : MediaRecorder (réécoute locale) + reconnaissance vocale du navigateur ---------- */
async function recitRecStart() {
  const st = document.querySelector('#aRecState');
  if (!document.querySelector('#aConsent').checked) { st.textContent = R('needConsent'); return; }
  recitStopRec();
  let l = document.querySelector('#aLang').value; if (l === 'auto') l = lang;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supported = SR && l !== 'ht';
  recitRec = { chunks: [], transcript: '', lang: l, paused: false };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recitRec.stream = stream;
    const mr = new MediaRecorder(stream); recitRec.mr = mr;
    mr.ondataavailable = (e) => { if (e.data.size) recitRec && recitRec.chunks.push(e.data); };

      recitAiModel = RECIT_AI_MODELS.small; return await webllm.CreateMLCEngine(recitAiModel, cb);

}
async function recitAiRun() {
  if (recitAiLoading && !recitAi) return; // already loading: never start a second download
  if (!recitAi && !(await recitAiCheckCache()) && !confirm(R('aiConfirm').replace('{size}', R(recitAiPick() === 'big' ? 'aiSizeBig' : 'aiSizeSmall')))) return;
  if (!recitAi) recitAiPersist();
  const db = recitLoad(), d = recitGet(db, recitView.id), L = d.analysisLang || lang;
  try {
    if (!recitAi) {
      const p = recitAiEngine(); recitWork(); recitAi = await p;
      try { localStorage.setItem(RECIT_AI_KEY, recitAiModel); } catch { /* private mode */ }
      recitAiCached = true;
    }
    recitAiLast = `<p>${R('aiThinking')}</p>`; recitWork();
    recitAnalyse(d); recitSave(db);
    const material = [RL('aiTextLabel', L) + ':', ...recitSources(d).map((s) => `[${s.label}] ${s.text}`), '',
      RL('aiGapsLabel', L) + ':', ...(d.gaps.length ? d.gaps.map((g) => `- ${g.id}: « ${g.aText} » / « ${g.bText} » (${g.what})`) : ['- ' + RL('aiNoneLabel', L)]), '',
      RL('aiAmbLabel', L) + ':', ...(d.ambiguities.length ? d.ambiguities.map((a) => `- « ${a.term} » (${a.claim})`) : ['- ' + RL('aiNoneLabel', L)])].join('\n').slice(0, 7000);
    const res = await recitAi.chat.completions.create({
      messages: [{ role: 'system', content: RL('aiSystem', L) }, { role: 'user', content: material }],
      temperature: 0, max_tokens: 900, response_format: { type: 'json_object', schema: RECIT_AI_SCHEMA } });
    recitAiShow(res.choices[0].message.content || '', d);
  } catch (e) {
    console.error('[Soutien Affectif] Suggestion IA :', e);
    if (!recitAi) recitAiLoading = null; // a failed download can be retried
    recitAiLast = `<p>${R('aiError')}</p><details><summary>${R('aiErrorDetail')}</summary><pre>${esc(String((e && (e.message || e)) || e).slice(0, 600))}</pre></details>`;
  }
  recitWork();
}
/** Words or numbers in an AI sentence that do not appear anywhere in the case (anti-invention, P2). */
function recitAiUnknown(text, d, L) {
  const srcText = recitSources(d).map((s) => s.text).join(' ') + ' ' + (d.persons || '');
  const nSrc = norm(srcText), out = [];
  for (const w of (ROLE_WORDS[L] || []).concat(ROLE_WORDS.fr)) if (hasTerm(text, w) && !hasTerm(srcText, w)) out.push(w);
  for (const m of String(text).matchAll(/(?:^|[^\p{L}])(\p{Lu}[\p{Ll}]{2,})/gu)) {
    const w = norm(m[1]);
    if (!nSrc.includes(w) && !norm(R('refDescription') + ' ' + R('refAnswer') + ' ' + R('refInitial') + ' ' + R('refPiece')).includes(w) && !norm(text).startsWith(w)) out.push(m[1]);
  }
  const f = facts(text, L, true), fs = facts(srcText, L, true);
  f.times.filter((x) => !fs.times.includes(x)).forEach((x) => out.push(x.replace(':', ' h ')));
  f.days.filter((x) => !fs.days.includes(x)).forEach((x) => out.push(x));
  return [...new Set(out)];
}
function recitAiShow(raw, d) {
  const L = d.analysisLang || lang;
  let obj = null;
  try { obj = JSON.parse(raw); } catch { const m = raw.match(/\{[\s\S]*\}/); try { obj = m && JSON.parse(m[0]); } catch { obj = null; } }
  const keys = ['centrales', 'ambiguites', 'ecarts', 'questions'];
  if (!obj || typeof obj !== 'object' || !keys.some((k) => Array.isArray(obj[k]))) {
    recitAiLast = `<article class="card recit-ai"><p><strong>${R('aiBadJson')}</strong></p><details><summary>${R('aiRaw')}</summary><pre>${esc(raw)}</pre></details></article>`;
    return;
  }
  recitAiQuestions = [];
  const item = (txt, isQuestion) => {
    const t = String(typeof txt === 'object' ? (txt.texte || txt.text || txt.question || JSON.stringify(txt)) : txt);
    const unknown = recitAiUnknown(t, d, L), leading = isQuestion && (LEADING.test(t) || JUDGING.test(norm(t)));
    const warn = (unknown.length ? `<span class="recit-warn">⚠ ${R('aiAbsent')} : ${esc(unknown.join(', '))}</span>` : '') + (leading ? `<span class="recit-warn">⚠ ${R('aiLeading')}</span>` : '');
    const ok = !unknown.length && !leading;
    let use = '';
    if (isQuestion && ok) { recitAiQuestions.push(t); use = ` <button onclick="recitAiUse(${recitAiQuestions.length - 1})">${R('useQuestion')}</button>`; }
    return `<li>${ok ? esc(t) : `<del>${esc(t)}</del>`} ${warn}${use}</li>`;
  };
  const sect = (k, title, q) => `<h4>${R(title)}</h4>${Array.isArray(obj[k]) && obj[k].length ? `<ul>${obj[k].slice(0, q ? 3 : 12).map((x) => item(x, q)).join('')}</ul>` : `<p><small>${R('none')}</small></p>`}`;
  recitAiLast = `<article class="card recit-ai"><p><strong>${R('aiTitle')}</strong> <small>(${esc(recitAiModel || '')}) ${R('aiWarning')}</small></p>
    ${sect('centrales', 'aiCentral')}${sect('ambiguites', 'aiAmbiguities')}${sect('ecarts', 'aiGaps')}${sect('questions', 'aiQuestions', true)}</article>`;
}
function recitAiUse(i) {
  const q = recitAiQuestions[i]; if (!q) return;
  recitView.tab = 'interview'; recitWork();
  const ta = document.querySelector('#qText'); if (ta) { ta.value = q; ta.focus(); }
}

/* ===== Espace membres =====
   Le lien public (vidéo) ouvre une vitrine : l'accueil, la fiche 02 et « Signaux de danger ».
   Tout le reste est chiffré (AES-GCM) dans MEMBERS_PAYLOAD ; chaque code abonné de la liste (C:\Projets\prive\codes_abonnes.csv) l'ouvre :
   sans le code donné aux abonnés de la chaîne, ce contenu est illisible, même en lisant le code de la page.
   La version complète utilisée par les tests n'a pas de MEMBERS_PAYLOAD : tout y est ouvert. */
const MEMBERS_KEY = 'soutien-acces-membres';
const MEMBERS_JOIN = 'https://www.youtube.com/channel/UCUJ-ay76QvkmdlkiXcAhcVw?sub_confirmation=1'; // ouvre directement la fenêtre d'abonnement YouTube
const FREE_FICHE = 1; // fiche 02 — l'hôtel
const FREE_PAGES = ['home', 'safety', 'lock'];
let unlocked = typeof MEMBERS_PAYLOAD === 'undefined';
let lockedFrom = null;

function isLocked(p, i) {
  if (unlocked) return false;
  if (p === 'path') return i !== FREE_FICHE;
  return !FREE_PAGES.includes(p);
}
async function membersDecrypt(code) {
  return JSON.parse(await ccOpen(MEMBERS_PAYLOAD, code)); // ccOpen : trousseau des codes abonnés (keyring.py)
}
function membersApply(data) {
  for (const l of Object.keys(data.CONTENT)) Object.assign(CONTENT[l], data.CONTENT[l]);
  for (const l of Object.keys(data.RECIT)) RECIT[l] = Object.assign(RECIT[l] || {}, data.RECIT[l]);
  unlocked = true;
}
async function membersUnlock(code, silent) {
  const msg = document.querySelector('#lockMsg');
  if (msg && !silent) msg.textContent = t('lockChecking');
  try {
    membersApply(await membersDecrypt(code));
    try { const c = String(code).trim().toUpperCase(); localStorage.setItem(MEMBERS_KEY, c); localStorage.setItem('compumaster-code', c); } catch { /* private mode */ }
    const target = lockedFrom; lockedFrom = null;
    if (target && target.p === 'path') start(target.i); else navigate(target ? target.p : 'home');
    return true;
  } catch {
    if (!silent) { try { localStorage.removeItem(MEMBERS_KEY); } catch { /* */ } if (msg) msg.textContent = t('lockWrong'); }
    return false;
  }
}
