ng."], "question": "You told me you had a very close bond with this person, without telling me about it. What place does this relationship have for you, and what had we agreed about romantic bonds with others?", "answers": [{"label": "“It's a friendship, nothing more”", "advice": "You may believe it or not: both are legitimate. Talk about the secret, which affects you whatever the nature of the bond.", "followUp": "Even if it's a friendship, the fact that you hid it from me hurts. What kept you from telling me?"}, {"label": "Romantic feelings, without physical contact", "advice": "Ask whether this bond is continuing and what your partner wants to do about it. Say what it means to you, without minimizing it.", "followUp": "Is this bond still going on today? What do you want to do about it, for you and for us?"}, {"label": "Physical contact", "advice": "This is important information for your health: you can ask whether there was sex and whether it was protected. See also situation 12.", "followUp": "I need to know, for my health: was there sex, and was it protected?"}, {"label": "Anger (“You're exaggerating, it's nothing”)", "advice": "Do not try to convince. Name what you feel. If voices rise, suggest “Take a pause”.", "followUp": "I'm not accusing you, I'm telling you how it makes me feel. Let's take a pause and pick it up later."}, {"label": "Refusal to give details", "advice": "Respect it for tonight: this refusal is not a further confession. Say what you will need to move forward.", "followUp": "Okay for tonight. But to decide what comes next, I'll need us to talk about it again."}], "shock": ["What you feel is legitimate, whether or not there were intimate gestures.", "A hidden emotional bond can hurt as much as a physical affair. You do not have to justify your pain.", "Just avoid actions you would regret: threats, violence, sharing messages."], "decide": ["Taking time before deciding, possibly sleeping apart for a few days.", "Continuing the relationship with clear conditions (distance from this person, agreed transparency, couples therapy).", "Ending the relationship.", "No option is better: it is your decision, and you can change your mind."], "health": "If there was intimate physical contact with this person, testing for sexually transmitted infections is recommended for both of you. A health center or a doctor can do it confidentially.", "support": ["Someone you trust, preferably someone who does not know the other person.", "A couples therapist or a psychologist, together or separately.", "If the conversation becomes threatening or violent: see “Warning signs”."], "next": ["Define together what each of you accepts in close friendships and confidences with others.", "Write what is non-negotiable for you in “My journal”, to reread it with a cool head.", "Clarify your agreement on exclusivity, emotional as well as physical (situation 15)."], "studies": ["mcdaniel2017"], "links": ["journal", "pause", "danger"], "safety": true}, {"id": "dating-app", "type": "aveu", "badge": "acknowledged", "title": "Your partner acknowledges using a dating app", "subtitle": "Current use, status and intention", "conclude": "The fact is acknowledged. What it covers still needs clarifying: an inactive profile, exchanges or meetings. Above all, did it respect your couple agreement? The answer depends on what you had promised each other, not on the app.", "explanations": ["An old profile that was never deleted.", "Curiosity or a need to feel reassured about being attractive, without meeting anyone.", "Ongoing exchanges with one or more people.", "Actual meetings.", "An agreement as a couple that each of you understood differently (see situation 15)."], "clarify": ["Ask what happened, over what period, and whether there were meetings. You have the right to know what directly concerns you (your health, your safety, your agreement).", "You do not have to know every detail. Ask yourself what you need to decide, and what would hurt you more than h ico confirmado puede cruzar un límite acordado, pero no demuestra una relación sexual."], ["Tu pareja se niega a mostrar conversaciones privadas", "Privacidad y confianza", "Respeto tu privacidad. ¿Cómo podemos hablar de mis preocupaciones y de nuestros límites con otras personas?", "Negarse a una revisión del teléfono no demuestra infidelidad. El acceso debe ser libremente consentido, nunca impuesto."], ["Tu pareja sale sin explicar sus planes", "Comunicarse sin vigilar", "¿Podemos acordar avisarnos al salir y dar una hora aproximada de regreso?", "Busquen un acuerdo mutuo que respete la autonomía de cada persona."], ["Tu pareja se pone nerviosa durante la conversación", "Dar espacio al malestar", "Esta conversación parece incomodarte. ¿Es mi tono, el tema u otra cosa?", "El nerviosismo no detecta mentiras. Una pausa puede ayudar."], ["Tu pareja se arregla para una salida cotidiana", "Apariencia e interpretaciones", "Hoy elegiste un conjunto bonito. ¿Hay alguna ocasión especial?", "Arreglarse puede simplemente hacer sentir bien. No es una prueba fiable de infidelidad."], ["El relato de tu pareja contiene una contradicción", "Aclarar sin tender trampas", "Antes dijiste X y ahora Y. ¿Puedes ayudarme a entender la diferencia?", "La memoria, un malentendido o cambios de planes pueden explicar una diferencia. Céntrate en hechos concretos."], ["Tu pareja desea menos contacto íntimo", "Escuchar las necesidades", "¿Cómo te sientes con nuestra intimidad? ¿Necesitas algo?", "El deseo y la cercanía varían. Cualquiera puede rechazar un contacto sin tener que demostrar fidelidad."], ["Tu pareja intercambia muchos mensajes con alguien", "Acordar límites", "¿Qué límites queremos para los intercambios amistosos, románticos o sexuales con otras personas?", "La frecuencia de mensajes no revela su contenido. No accedas a cuentas a escondidas."], ["Tu pareja reconoce una relación con otra persona", "Elegir cómo seguir", "Necesito comprender lo ocurrido y pensar qué quiero hacer. ¿Pode nozca a la otra persona.", "Si la emoción es demasiado fuerte, use «Hacer una pausa» antes de cualquier conversación."], "question": "Hace un rato, en [lugar], vi lo que me pareció un beso entre tú y una persona. Estaba lejos y puedo equivocarme: ¿qué pasó?", "answers": [{"label": "«Viste mal, era un beso en la mejilla / un abrazo»", "advice": "Es posible: ver algo a distancia puede engañar. Diga lo que vio y sintió, sin exigir pruebas.", "followUp": "De acuerdo. Desde donde estaba, parecía otra cosa. Me afectó, necesitaba hablarlo contigo."}, {"label": "«Esa persona me besó, yo no quería»", "advice": "Escuche primero cómo lo vivió su pareja. Un gesto impuesto no es una elección: puede necesitar apoyo.", "followUp": "¿Cómo te sientes con lo que pasó? ¿Necesitas algo?"}, {"label": "Enojo («¿me estás espiando?»)", "advice": "Explique que estaba allí por casualidad, si es así. Si el tono sube, deténgase y use «Hacer una pausa».", "followUp": "No te estoy espiando. Prefiero hablarlo contigo antes que guardarme esa imagen."}, {"label": "Un rechazo a responder", "advice": "Respete el rechazo por ahora: no es una confesión. Diga que la pregunta le importa y proponga otro momento.", "followUp": "De acuerdo, esta noche no. Me gustaría que lo habláramos mañana, con calma."}, {"label": "El reconocimiento de un beso amoroso", "advice": "Un beso reconocido puede cruzar un límite de su pareja, sin probar otra cosa. Tómese tiempo para asimilarlo y luego consulte la situación 12.", "followUp": "Gracias por decírmelo. Necesito tiempo antes de hablar más del tema."}], "next": ["Aclarar qué considera cada uno un gesto de amistad o un gesto amoroso (situación 15).", "Si la explicación le convence, decir claramente que para usted el tema está cerrado.", "Si la duda sigue, abrir un caso en «Analizar un relato» para separar lo que vio de sus suposiciones."], "studies": [], "links": ["recit", "journal", "pause", "danger"], "safety": false}, {"n": 5, "id": "conversations", "type": "doute", "badge": "context", "title": "Tu pareja se niega a mostrar conversaciones privadas", "subtitle": "Privacidad y confianza", "conclude": "Negarse a mostrar las conversaciones no demuestra una infidelidad. Cada persona tiene derecho a su vida privada, y los mensajes también involucran a otras personas. El acceso al teléfono debe darse libremente, nunca imponerse.", "explanations": ["Una necesidad de intimidad personal, aunque no haya nada que ocultar.", "Conversaciones que involucran a otras personas: confidencias de amigos, problemas familiares, información de trabajo.", "La sensación de ser sospechoso/a, que da ganas de protegerse.", "Una incomodidad por temas que no tienen que ver con usted: salud, dinero, búsquedas personales, una sorpresa prevista.", "Conversaciones que su pareja no quiere mostrarle, de amistad o amorosas."], "clarify": ["Pregúntese qué busca de verdad: sentirse tranquilo/a, entender un hecho preciso o definir límites comunes.", "Si hay un hecho preciso que le preocupa, hable de ese hecho y no del teléfono.", "Lleve la conversación al acuerdo de pareja: ¿qué intercambios con otras personas son aceptables para cada uno?", "Tenga presente que revisar el teléfono de alguien está prohibido en muchos países y daña la confianza de forma duradera."], "avoid": ["Revisar el teléfono a escondidas, adivinar el código o instalar una aplicación espía: suele ser ilegal y destruye la confianza.", "Hacer del acceso al teléfono una prueba de amor («Si me quisieras, me lo mostrarías»).", "Interpretar cada gesto con el teléfono, como una pantalla boca abajo o una notificación, como un indicio."], "firstHours": ["Si la conversación se puso tensa, deje pasar unas horas antes de retomarla.", "Anote en «Mi diario» qué provocó su petición: ¿un hecho preciso o una preocupación general?", "Si le dan ganas de mirar el teléfono, aléjese y use «Hacer una pausa»."], "question": "Respeto tu espacio privado y no quiero mirar tu teléfono. Lo que me preocupa es [hecho preciso]. ¿Cómo podríamos hablar de nuestros límites con otras personas?", "answers": [{"label": "Disposición a hablar de los límites de la pareja", "advice": "Aproveche esa apertura para hablar de su acuerdo, no del teléfono. Cada uno dice lo que le parece aceptable o no.", "followUp": "Para ti, ¿qué estaría fuera de lugar en una conversación con otra persona? Yo también te diré lo que pienso."}, {"label": "Un ofrecimiento espontáneo de mostrar un mensaje", "advice": "Esa decisión es de su pareja. Puede aceptar o decir que no hace falta. Evite convertirlo en costumbre o en exigencia.", "followUp": "Gracias por tu confianza. Lo que más me importa es que estemos de acuerdo en nuestros límites."}, {"label": "Enojo («¡no confías en mí!»)", "advice": "Reconozca que la petición puede herir. Vuelva a su preocupación, no al teléfono. Si el tono sube, use «Hacer una pausa».", "followUp": "Entiendo que te duela. No te pido tu teléfono, te hablo de lo que siento."}, {"label": "Se niega a hablar del tema", "advice": "El rechazo no es una confesión: la vida privada es un derecho. Proponga hablar más tarde de sus acuerdos, sin poner el teléfono en el centro.", "followUp": "De acuerdo. Aun así, me gustaría que pronto habláramos de lo que es aceptable para los dos."}], "next": ["Definir juntos lo que cada uno acepta en los intercambios con otras personas: de amistad, amorosos, sexuales (situación 15).", "Acordar lo que cada uno mantiene en privado, y respetarlo por ambas partes.", "Si sus preocupaciones vuelven a menudo sin hechos nuevos, consulte la situación 13 y «Mi contexto»."], "studies": [], "links": ["journal", "pause", "danger", "contexte"], "safety": false}, {"n": 6, "id": "sorties", "type": "doute", "badge": "context", "title": "Tu pareja sale sin explicar sus planes", "subtitle": "Comunicarse sin vigilar", "conclude": "Salir sin detallar los planes no dice, por sí solo, nada de lo que hace su pareja. Cada pareja tiene sus costumbres para avisarse. Busque una regla recíproca que respete la autonomía de cada uno.", "explanations": ["Una costumbre de autonomía, que viene de su familia o de relaciones pasadas.", "Una salida corriente (deporte, compras, amigos) que le parece demasiado banal para explicarla.", "Una necesidad de tiempo a solas, para respirar o pensar.", "Una sorpresa, un regalo o un proyecto que su pareja prefiere mantener en secreto por ahora.", "Una actividad o un encuentro que su pareja no desea contarle, de amistad o amoroso."], "clarify": ["Pregúntese si este comportamiento es nuevo o si siempre ha existido en su relación.", "Distinga su necesidad (que le avisen, saber cuándo esperarle) de un control de su agenda.", "Pregúntese si usted avisa a su pareja cuando sale.", "Hable de esa necesidad en un momento tranquilo, no cuando su pareja cruza la puerta."], "avoid": ["Seguir a su pareja, rastrear su ubicación o pedir a familiares que le vigilen.", "Exigir un informe detallado de cada salida, o llamar sin parar mientras está fuera.", "Imponer una regla que usted mismo/a no respetaría."], "firstHours": ["Durante la ausencia, manténgase ocupado/a: llame a alguien, salga, haga una actividad que le relaje.", "Anote en «Mi diario» lo que siente y lo que alimenta su preocupación.", "Cuando vuelva, reciba a su pareja con normalidad. La conversación puede esperar a un momento tranquilo."], "question": "Cuando sales sin decirme adónde vas ni cuándo vuelves, me preocupo. ¿Podemos acordar avisarnos al salir y dar una hora aproximada de regreso?", "answers": [{"label": "«Sí, de acuerdo»", "advice": "Fijen una regla sencilla, válida para los dos. Dé las gracias y evite pedir más de lo acordado.", "followUp": "Gracias. Yo haré lo mismo: un mensajito para decir más o menos cuándo vuelvo."}, {"label": "«No tengo por qué contártelo todo»", "advice": "Es cierto: no se trata de contarlo todo. Aclare que habla solo de una referencia práctica y recíproca.", "followUp": "No te pregunto adónde vas ni con quién. Solo una idea de la hora, para no preocuparme."}, {"label": "Enojo («quieres controlarme»)", "advice": "Reconozca que la petición puede parecer invasiva. Vuelva a lo que usted siente. Si el tono sube, deténgase y use «Hacer una pausa».", "followUp": "No es control, es mi preocupación. Podemos volver a hablarlo más tarde, con calma."}, {"label": "Se niega a hablar del tema", "advice": "El rechazo no es una confesión. Respételo por ahora, diga lo que necesita y proponga otro momento.", "followUp": "De acuerdo. Es importante para mí, me gustaría que lo habláramos esta semana."}, {"label": "El reconocimiento de una relación oculta", "advice": "Tómese tiempo para asimilarlo. No tiene que decidir nada ahora. Pase al recorrido «confesión» (situación 12).", "followUp": "Necesito tiempo para pensar. Lo hablaremos cuando esté listo/a."}], "next": ["Escribir juntos una regla sencilla y recíproca: avisar de una salida, dar una hora aproximada de regreso.", "Hacer un balance dentro de unas semanas para ver si la regla le conviene a cada uno.", "Si su preocupación sigue siendo fuerte pese al acuerdo, consulte la situación 13 y «Mi contexto»."], "studies": [], "links": ["journal", "pause", "danger", "contexte"], "safety": false}, {"n": 7, "id": "nervosite", "type": "doute", "badge": "context", "title": "Tu pareja se pone nerviosa durante la conversación", "subtitle": "Dar espacio al malestar", "conclude": "El nerviosismo no permite detectar una mentira. Una persona sincera puede ponerse tensa cuando se siente sospechosa. Una pausa y un tono más suave suelen facilitar la conversación.", "explanations": ["La sensación de ser acusado/a, que genera estrés aunque no haya nada que ocultar.", "Estrés o cansancio por problemas que no tienen que ver con usted: trabajo, dinero, familia.", "Un problema de salud: ansiedad, depresión, trastornos del sueño o efecto de un medicamento.", "El recuerdo de discusiones pasadas, en esta relación o en otra, que este tema despierta.", "Una incomodidad por algo que su pareja no le ha contado, de amistad o amoroso."], "clarify": ["Observe su propio tono: ¿hace preguntas una tras otra, como en un interrogatorio?", "Pregunte a su pareja cómo está en este momento, aparte de esta conversación.", "Pregúntese si este nerviosismo es nuevo o habitual en las conversaciones difíciles.", "Vuelva al hecho preciso que le preocupaba, en lugar de a las reacciones de su pareja."], "avoid": ["Tomar el nerviosismo, una mirada esquiva o las dudas como prueba de mentira.", "Insistir más fuerte para «hacer ceder» a su pareja.", "Grabar la conversación a escondidas para analizar sus reacciones después."], "firstHours": ["Si la tensión sube, detenga la conversación y use «Hacer una pausa».", "Anote en «Mi diario» lo que se dijo, no solo las reacciones que observó.", "Más tarde, pregunte a su pareja cómo está, sin retomar el tema enseguida."], "question": "Tengo la impresión de que esta conversación te incomoda. ¿Es mi tono, el tema u otra cosa?", "answers": [{"label": "«Es tu forma de hablarme»", "advice": "Escuche sin defenderse. Proponga retomar con más suavidad, hablando de usted y no de su pareja.", "followUp": "De acuerdo, voy a intentarlo de otra manera. Empiezo por decirte lo que siento, sin acusarte."}, {"label": "«Estoy estresado/a, no estoy bien ahora»", "advice": "Deje el tema a un lado y acoja lo que vive su pareja. Ofrezca su apoyo, y ayuda externa si hace falta.", "followUp": "Gracias por decírmelo. ¿Qué te ayudaría en este momento?"}, {"label": "«Me siento sospechoso/a»", "advice": "Reconozca ese sentimiento. Explique su preocupación a partir de un hecho preciso, sin interpretarlo.", "followUp": "Entiendo. No quiero acusarte: es ese hecho concreto lo que me preocupó."}, {"label": "Enojo, el tono sube", "advice": "Detenga la conversación y use «Hacer una pausa». Si tiene miedo, consulte «Señales de peligro».", "followUp": "Prefiero que lo dejemos aquí por ahora. Seguiremos cuando los dos estemos más tranquilos."}, {"label": "Se niega a continuar", "advice": "El rechazo no es una confesión. Respételo y proponga un momento para retomarlo más tarde.", "followUp": "De acuerdo, lo dejamos. ¿Podemos volver a hablarlo este fin de semana?"}], "next": ["Acordar reglas para las conversaciones difíciles: un momento elegido, una palabra para pedir una pausa.", "Interesarse por el bienestar de su pareja y animarle a consultar si algo no va bien.", "Si las conversaciones sobre la fidelidad suelen terminar mal, consulte la situación 14."], "studies": [], "links": ["journal", "pause", "danger"], "safety": false}, {"n": 8, "id": "appearance", "type": "doute", "badge": "context", "title": "Tu pareja se arregla para una salida cotidiana", "subtitle": "Apariencia e interpretaciones", "conclude": "Cuidar la apariencia puede responder a muchas necesidades: sentirse bien, recuperar la confianza, marcar una ocasión. Este cambio no dice, por sí solo, nada de a quién va dirigido. No es una prueba de infidelidad.", "explanations": ["El simple placer de sentirse bien con la ropa, sin nadie en particular en mente.", "Una necesidad de recuperar la confianza tras una etapa difícil: enfermedad, cambio de peso, tristeza, cansancio.", "Una ocasión concreta: reunión importante, foto, entrevista, reencuentro con familiares.", "Ganas de gustar en general, o de gustarle a usted, sin haberlo dicho.", "Ganas de gustarle a una persona concreta, que su pareja no le ha mencionado."], "clarify": ["Anote lo que ha cambiado en concreto: ropa, perfume, peinado, frecuencia. Sepárelo de lo que imaginó.", "Pregúntese si su pareja atraviesa una etapa especial: trabajo nuevo, problema de salud, bajón de ánimo.", "Interésese por su bienestar: «¿Cómo te sientes estos días, contigo y con tu vida?»", "Exprese primero un cumplido sincero y luego su pregunta, sin insinuaciones."], "avoid": ["Comentar en tono irónico o desconfiado («¿Para quién te pones tan guapo o guapa?»).", "Seguir a su pareja o revisar su agenda para saber a quién va a ver.", "Criticar su apariencia para que cuide menos su imagen."], "firstHours": ["Deje que baje la preocupación antes de hablarlo: un cumplido vale más que un interrogatorio al salir.", "Anote lo que siente en «Mi diario», separando lo que vio de lo que teme.", "Pregúntese si esta preocupación se une a otras dudas más antiguas. Si es así, la situación 13 puede ayudar."], "question": "Hoy elegiste una ropa muy bonita, te queda bien. ¿Tienes alguna ocasión especial?", "answers": [{"label": "Una ocasión concreta (reunión, cita de trabajo, familiares…)", "advice": "Acepte la explicación con sencillez. Puede decir que le gusta verle así, sin añadir condiciones.", "followUp": "De verdad te queda muy bien. Me encantaría que también saliéramos los dos alguna noche."}, {"label": "«Nada especial, tenía ganas de sentirme bien»", "advice": "Es una respuesta suficiente. Aproveche para interesarse por su ánimo y su confianza en sí mismo/a.", "followUp": "Me alegra que te sientas bien. ¿Cómo estás tú estos días, en general?"}, {"label": "Una necesidad de recuperar la confianza (salud, cuerpo, ánimo)", "advice": "Escuche sin restarle importancia. Ofrezca su apoyo y, si la dificultad dura, la ayuda de un médico o de un psicólogo.", "followUp": "Gracias por decírmelo. ¿Qué podría ayudarte ahora, y cómo puedo estar a tu lado?"}, {"label": "Molestia o enojo («¿Sospechas de mí?»)", "advice": "Reconozca que su pregunta pudo sonar a sospecha. Si el tono sube, proponga una pausa en lugar de justificarse largamente.", "followUp": "No quería sospechar de ti. Me sentí un poco preocupado/a, nada más."}, {"label": "Un rechazo a responder", "advice": "El rechazo no es una confesión. Cada persona puede elegir su ropa sin justificarse. Anote lo que siente y vuelva a hablarlo si la preocupación sigue.", "followUp": "De acuerdo, no tienes que justificarte. Si algún día algo te pesa, aquí estoy."}], "next": ["Proponer momentos a dos en los que cada uno disfrute arreglándose para el otro.", "Si la preocupación vuelve a menudo sin hechos nuevos, explorar qué la alimenta (situación 13).", "Si ha surgido un problema de bienestar, volver a hablarlo con calma y considerar una ayuda adecuada."], "studies": [], "links": ["journal", "pause", "danger"], "safety": false}, {"n": 9, "id": "contradiction", "type": "doute", "badge": "context", "title": "El relato de tu pareja contiene una contradicción", "subtitle": "Aclarar sin tender trampas", "conclude": "Dos versiones distintas de un mismo momento muestran que hay un punto por aclarar. A menudo bastan la memoria, un malentendido o un cambio de planes para explicarlo. Una omisión o una mentira es posible, pero nada indica sobre qué trataría.", "explanations": ["Un error de memoria sobre una hora, un lugar o el orden de los hechos.", "Un cambio de planes durante el día, que su pareja no pensó en mencionar.", "Un malentendido: usted entendió algo distinto de lo que se dijo.", "Una omisión para evitar una incomodidad o una discusión, sobre un tema que no tiene por qué involucrar a otra persona.", "Una mentira para ocultar una salida, un gasto o una relación."], "clarify": ["Escriba las dos versiones palabra por palabra, con la hora en que se dijo cada una. Compruebe que no las confunde con otro día.", "Elija un solo punto preciso por aclarar, en lugar de repasar todo el relato.", "Pregúntese si la diferencia es importante para usted, o si es un detalle sin consecuencias.", "Haga la pregunta abiertamente, diciendo que busca entender, no pillar a su pareja en falta."], "avoid": ["Repetir la misma pregunta varias veces para «ver si la respuesta cambia»: es una trampa que daña la confianza.", "Comprobarlo con amigos, colegas o rastreando su ubicación antes de hablarlo.", "Convertir la conversación en un interrogatorio, con una lista de preguntas preparadas."], "firstHours": ["Anote las dos versiones en «Mi diario» mientras estén frescas.", "Espere a estar tranquilo/a para hablarlo: un tono acusador provoca más defensa que explicación.", "Si la duda le invade, abra un caso en «Analizar un relato» para separar los hechos de las suposiciones."], "question": "Hace un rato me dijiste [versión 1], y ahora [versión 2]. Quizás me confundí: ¿me ayudas a entender?", "answers": [{"label": "Un error de memoria o un cambio de planes", "advice": "Repita con sus palabras lo que entendió para comprobarlo. Si la explicación le convence, diga claramente que el tema está cerrado.", "followUp": "De acuerdo, ahora lo entiendo mejor. Me ayuda que me avises si cambian los planes."}, {"label": "«Entendiste mal lo que dije»", "advice": "Es posible. Comparen con calma lo que cada uno recuerda haber dicho u oído, sin buscar tener razón.", "followUp": "Puede que haya entendido mal. ¿Me repites lo que querías decir?"}, {"label": "El reconocimiento de una omisión o una pequeña mentira", "advice": "Agradezca a su pareja que lo corrija. Pregunte qué le llevó a no decirlo, sin reproches. Si la mentira trata de una relación, consulte la situación 21.", "followUp": "Gracias por decírmelo. ¿Qué te hizo preferir no contármelo al principio?"}, {"label": "Enojo («¿Me estás llamando mentiroso o mentirosa?»)", "advice": "Aclare que habla de un punto preciso, no de su persona. Si el tono sube, proponga una pausa y retómenlo más tarde.", "followUp": "No te llamo mentiroso ni mentirosa. Solo intento entender ese punto."}, {"label": "Un rechazo a responder", "advice": "El rechazo no es una confesión. Diga que ese punto le importa y proponga volver a hablarlo en otro momento.", "followUp": "De acuerdo, ahora no. Me gustaría que lo habláramos cuando te sientas listo/a."}], "next": ["Acordar avisarse cuando cambian los planes, sin informes obligatorios (consulte la situación 06).", "Si la explicación le convence, no volver sobre esa diferencia.", "Si la duda sigue, abrir un caso en «Analizar un relato» para hacer balance en frío."], "studies": ["mazzini2025"], "links": ["recit", "journal", "pause", "danger"], "safety": false}, {"n": 10, "id": "less-intimacy", "type": "doute", "badge": "context", "title": "Tu pareja desea menos contacto íntimo", "subtitle": "Escuchar las necesidades", "conclude": "El deseo y la necesidad de cercanía varían a lo largo de la vida, por razones muy diversas. Una disminución no dice, por sí sola, qué la causa. Cada persona puede rechazar un contacto, sin tener que probar su fidelidad.", "explanations": ["Cansancio, estrés o una etapa cargada (trabajo, hijos, problemas familiares).", "Un problema de salud, un tratamiento, dolores o cambios hormonales.", "Bajo ánimo, ansiedad, depresión o incomodidad con el propio cuerpo.", "Tensiones en la pareja que no se han dicho: rencor, sensación de no ser escuchado/a.", "Una atracción o una relación con otra persona."], "clarify": ["Identifique desde cuándo existe este cambio y qué pasó alrededor: trabajo, salud, duelo, discusión.", "Interésese por su bienestar en general, no solo por la intimidad: «¿Cómo te sientes estos días?»", "Exprese sus propias necesidades hablando de usted («Necesito cercanía»), sin pedir explicaciones.", "Piense en otras formas de cercanía: ternura, tiempo juntos, conversaciones."], "avoid": ["Insistir, negociar o presionar para obtener un contacto íntimo: cada persona tiene derecho a decir que no.", "Interpretar cada rechazo como una prueba o convertirlo en un reproche.", "Comparar con el comienzo de la relación o con otras parejas."], "firstHours": ["Después de un rechazo, evite hablarlo en caliente: la decepción puede volver hirientes las palabras.", "Anote lo que siente en «Mi diario»: falta, preocupación, sensación de rechazo.", "Elija un momento tranquilo, fuera del dormitorio, para sacar el tema."], "question": "Tengo la impresión de que últimamente tenemos menos momentos íntimos. ¿Cómo te sientes estos días, y en nuestra intimidad?", "answers": [{"label": "«Estoy agotado/a, estresado/a»", "advice": "Acepte esta respuesta sin discutirla. Pregunte qué podría aliviar su carga, y busque otros momentos de cercanía.", "followUp": "Lo entiendo. ¿Qué te ayudaría a descansar un poco? Podríamos simplemente pasar tiempo juntos, sin expectativas."}, {"label": "Un problema de salud, de cuerpo o de ánimo", "advice": "Escuche sin restarle importancia. Ofrezca su apoyo y, si su pareja lo desea, una consulta con un médico, un sexólogo o un psicólogo.", "followUp": "Gracias por decírmelo. No quiero presionarte. ¿Cómo puedo ayudarte?"}, {"label": "«Algo no va bien entre nosotros»", "advice": "Es una apertura importante. Escuche hasta el final antes de responder, y pregunte qué ayudaría.", "followUp": "Quiero entenderlo. ¿Qué te pesa entre nosotros, y qué podría cambiar?"}, {"label": "Enojo («¿Crees que te engaño?»)", "advice": "Diga que habla de sus necesidades, no de una sospecha. Si el tono sube, proponga una pausa y retómenlo más tarde.", "followUp": "No te acuso de nada. Necesito cercanía, y quería saber cómo estás."}, {"label": "Se niega a hablar del tema", "advice": "El rechazo no es una confesión. La intimidad es un tema delicado. Diga que sigue disponible y proponga hablarlo más tarde.", "followUp": "De acuerdo. No quiero forzarte. Lo hablaremos cuando te sientas cómodo/a."}], "next": ["Acordar momentos a dos sin expectativa de intimidad física, para recuperar la cercanía.", "Si ha surgido un problema de salud o de ánimo, animar a consultar, sin imponerlo.", "Si el tema sigue bloqueado, considerar un terapeuta de pareja o un sexólogo."], "studies": [], "links": ["journal", "pause", "danger"], "safety": false}, {"n": 11, "id": "many-messages", "type": "doute", "badge": "context", "title": "Tu pareja intercambia muchos mensajes con alguien", "subtitle": "Acordar límites", "conclude": "La frecuencia de los mensajes muestra que existe un vínculo, no su naturaleza. Lo que cuenta es lo que acordaron juntos sobre los intercambios con otras personas. La cuestión es ese acuerdo, no el acceso al teléfono.", "explanations": ["Un amigo, un familiar o un colega con quien su pareja se escribe mucho.", "Un proyecto, una organización o un grupo que requiere muchos mensajes.", "Un apoyo durante un momento difícil, de una parte o de la otra.", "Una cercanía afectiva que crece y podría superar los límites que usted tenía en mente.", "Intercambios amorosos o sexuales."], "clarify": ["Anote lo que realmente observa: la frecuencia, las horas. No conoce el contenido, y es normal.", "Pregúntese qué espera: saber quién es esa persona, o acordar límites para el futuro.", "Hablen de sus acuerdos sobre los intercambios de amistad, amorosos o sexuales con otras personas (consulte la situación 15).", "Pregunte simplemente quién es esa persona, como lo haría con cualquier conocido."], "avoid": ["Revisar a escondidas el teléfono o las cuentas: está prohibido en muchos países y daña la confianza de forma duradera.", "Exigir las contraseñas o leer las conversaciones como «prueba».", "Contactar a la persona o mirar sus redes sociales para investigar."], "firstHours": ["Resista las ganas de mirar la pantalla o tomar el teléfono: eso impediría una conversación serena.", "Anote su preocupación en «Mi diario», con lo que realmente observó.", "Prepare una pregunta sobre su acuerdo de pareja, no sobre el contenido de los mensajes."], "question": "Noto que te escribes a menudo con [nombre]. ¿Quién es esa persona para ti? ¿Y qué límites queremos para nuestros intercambios con otras personas?", "answers": [{"label": "Un amigo o amiga, un familiar o un colega", "advice": "Acepte la explicación. Diga lo que sintió, sin reproches, y proponga hablar de sus límites comunes.", "followUp": "Gracias. Me sentí un poco apartado/a. ¿Podemos hablar de lo que nos va bien a los dos?"}, {"label": "«¿Quieres leer mis mensajes?»", "advice": "Aclare que no pide acceso al teléfono. Busca ponerse de acuerdo sobre sus límites.", "followUp": "No, no quiero leer tus mensajes. Me gustaría que acordáramos qué está bien para nosotros."}, {"label": "El reconocimiento de un vínculo afectivo o amoroso", "advice": "Tómese tiempo para asimilarlo. No tiene que decidir nada ahora. Consulte las situaciones 19 y 22.", "followUp": "Gracias por decírmelo. Necesito tiempo para pensar. Lo hablaremos cuando esté listo/a."}, {"label": "Enojo («¿Me estás vigilando?»)", "advice": "Diga que justamente lo habla para no vigilar. Si el tono sube, proponga una pausa.", "followUp": "No quiero vigilarte. Prefiero hablarlo contigo antes que guardármelo."}, {"label": "Un rechazo a responder", "advice": "El rechazo no es una confesión. Respételo por ahora y diga que el tema de los límites sigue siendo importante para usted.", "followUp": "De acuerdo, ahora no. Pero me gustaría que habláramos de nuestros límites otro día."}], "next": ["Escribir juntos lo que cada uno considera aceptable en los intercambios con otras personas (situación 15).", "Acordar lo que cada uno desea compartir espontáneamente, sin controlar los teléfonos.", "Si la duda sigue, abrir un caso en «Analizar un relato» para separar los hechos de las suposiciones."], "studies": ["mcdaniel2017"], "links": ["recit", "journal", "pause", "danger"], "safety": false}, {"n": 12, "id": "relation-reconnue", "type": "aveu", "badge": "acknowledged", "title": "Tu pareja reconoce una relación con otra persona", "subtitle": "Elegir cómo seguir", "conclude": "El hecho está reconocido: existió una relación. Su naturaleza está por precisar: afectiva o sexual, puntual o duradera, terminada o no. Lo que significa para usted depende de su acuerdo de pareja y de lo que siente.", "explanations": ["Una relación breve, presentada como un error puntual y ya terminado.", "Una relación duradera, con sentimientos, que quizás aún continúa.", "Una relación sobre todo afectiva, sin contacto físico.", "Una relación que su pareja creía compatible con su acuerdo de pareja (consulte la situación 15).", "Una dificultad personal o de pareja que su pareja no expresó. Puede ayudar a entender, sin excusar nada."], "clarify": ["Pregunte lo que le afecta directamente: la duración, si terminó, si hubo relaciones sexuales y si fueron protegidas.", "No está obligado/a a saberlo todo. Pregúntese qué detalles le ayudarían a decidir, y cuáles le harían más daño que bien.", "Puede hacer sus preguntas en varias veces, a lo largo de varios días."], "avoid": ["Contactar a la otra persona, amenazarla o exponerla públicamente.", "Revisar a escondidas el teléfono o las cuentas de su pareja para obtener «toda la verdad».", "Tomar una decisión definitiva en la primera hora, o anunciar la noticia a todo su entorno."], "firstHours": ["El impacto, el enojo, la tristeza o el aturdimiento son reacciones normales.", "Puede pedir tiempo: «Necesito estar solo/a esta noche.»", "Coma, duerma si puede, llame a una persona de confianza.", "Use «Hacer una pausa» si la emoción se vuelve demasiado fuerte."], "question": "Me dijiste que tuviste una relación con alguien. Necesito entender qué pasó: ¿desde cuándo, y en qué punto están hoy?", "answers": [{"label": "«Se terminó, fue un error»", "advice": "Puede creerlo o no: ambas cosas son legítimas. Diga qué necesitaría para recuperar la confianza, sin vigilancia impuesta.", "followUp": "Entiendo que se terminó. Para mí, la confianza no vuelve de golpe. Lo seguiremos hablando."}, {"label": "«Todavía continúa» o una duda", "advice": "Es una información importante para decidir. No tiene que esperar la decisión de su pareja: puede fijar sus propios límites.", "followUp": "Necesito saber qué piensas hacer. Y yo también voy a pensar en lo que quiero."}, {"label": "Hubo relaciones sexuales", "advice": "Por su salud, puede preguntar si fueron protegidas. Piense en hacerse pruebas, sea cual sea su decisión.", "followUp": "Necesito saberlo, por mi salud: ¿esas relaciones fueron protegidas?"}, {"label": "Enojo o el tono sube", "advice": "Detenga la conversación y use «Hacer una pausa». Si se siente amenazado/a o le impiden irse, consulte «Señales de peligro».", "followUp": "Lo dejo aquí por esta noche. Seguiremos cuando podamos hablar sin gritar."}, {"label": "Rechazo a dar detalles", "advice": "Respételo por esta noche: este rechazo no es una confesión adicional. Diga qué necesitará para decidir (salud, fin de la relación, terapia).", "followUp": "De acuerdo por esta noche. Pero para decidir qué hacer, necesitaré que lo volvamos a hablar."}], "shock": ["Lo que siente es legítimo, sea cual sea la naturaleza de esa relación.", "Puede tener reacciones contradictorias: querer irse y quedarse, saberlo todo y no saber nada.", "Solo evite los actos de los que se arrepentiría: amenazas, violencia, difusión de mensajes."], "decide": ["Tomarse tiempo antes de decidir, quizás durmiendo por separado unos días.", "Considerar una reparación con condiciones claras: fin de la otra relación, transparencia elegida, terapia de pareja.", "Terminar la relación.", "El perdón no se impone. Ninguna opción es mejor: es su decisión, y puede cambiar de opinión."], "health": "Si hubo relaciones sexuales con la otra persona, se recomienda que ambos se hagan pruebas de infecciones de transmisión sexual, sea cual sea su decisión. Un centro de salud o un médico puede hacerlo de forma confidencial.", "support": ["Una persona de confianza, si es posible ajena al entorno de la otra persona.", "Un psicólogo para usted solo/a, y un terapeuta de pareja si piensa continuar.", "Si la conversación se vuelve amenazante o violenta: consulte «Señales de peligro»."], "next": ["Anotar en «Mi diario» lo que para usted no es negociable.", "Fijar un momento para volver a hablar, cuando el impacto sea menos fuerte.", "Aclarar su acuerdo de exclusividad para el futuro (situación 15)."], "studies": ["apostolou2022"], "links": ["journal", "pause", "danger"], "safety": true}, {"n": 13, "id": "recurring-doubts", "type": "communication", "badge": "communication", "title": "Sospechas a menudo una infidelidad sin hechos nuevos", "subtitle": "Comprender la preocupación", "conclude": "Las dudas que vuelven sin hechos nuevos hablan sobre todo de su preocupación y de la relación. No dicen, por sí solas, nada de lo que hace su pareja. Comprenderlas es un trabajo personal, que un acompañamiento individual puede facilitar.", "explanations": ["Una herida pasada: una infidelidad vivida, una separación brusca, una infancia marcada por el abandono.", "Una etapa de estrés, cansancio o aislamiento que hace más fuerte la preocupación.", "Una ansiedad que se alimenta a sí misma: cada comprobación alivia un momento, y luego la duda vuelve.", "Falta de tiempo juntos o de muestras de atención, que deja espacio a los miedos.", "Un distanciamiento real en la relación, o un secreto, que usted percibe sin poder nombrarlo."], "clarify": ["En «Mi diario», anote cada duda: la fecha, qué la provocó y si hubo un hecho nuevo.", "En «Mi contexto», identifique las experiencias pasadas que podrían alimentar ese miedo.", "Distinga tres cosas: lo que observa, lo que siente, lo que imagina.", "Pregúntese qué le tranquiliza de verdad, y cuánto dura ese alivio."], "avoid": ["Pedir a su pareja que le tranquilice una y otra vez: el alivio es corto y la relación se desgasta.", "Revisar el teléfono, las redes o los desplazamientos para calmar la angustia.", "Presentar sus miedos como acusaciones («Sé que me ocultas algo»)."], "firstHours": ["Cuando la duda aumente, espere antes de actuar: respire, camine, deje pasar el pico de angustia.", "Escriba el pensamiento que le preocupa y luego pregúntese: «¿Qué hecho nuevo he observado?»", "Si la angustia es muy fuerte, use «Hacer una pausa» o llame a una persona de confianza."], "question": "Noto que mis preocupaciones vuelven a menudo, incluso sin un motivo concreto. Quiero hablarlo contigo, no para acusarte, sino para entenderlo juntos. ¿Cómo lo vives tú?", "answers": [{"label": "Una escucha comprensiva", "advice": "Agradezca a su pareja. Hable de lo que siente y de lo que piensa hacer, en lugar de pedir pruebas.", "followUp": "Gracias por escucharme. Voy a trabajar en mis miedos. Me ayudaría que pasáramos más tiempo juntos."}, {"label": "Cansancio («¿Otra vez este tema?»)", "advice": "Reconozca que estas dudas también pesan sobre su pareja. Muestre que busca una solución, no otra forma de tranquilizarse.", "followUp": "Entiendo que te canse. Justamente quiero ocuparme de esto de otra manera, por los dos."}, {"label": "El tono sube", "advice": "No intente convencer a toda costa. Proponga una pausa y retómenlo cuando los dos estén tranquilos.", "followUp": "Siento que esto se calienta. Hacemos una pausa y lo hablamos más tarde, ¿de acuerdo?"}, {"label": "Se niega a hablar del tema", "advice": "El rechazo no es una confesión. Su pareja puede estar cansada o herida. Avance por su lado con un acompañamiento individual.", "followUp": "De acuerdo, lo respeto. Voy a hablarlo con alguien para avanzar por mi parte."}], "next": ["Consultar a un psicólogo o terapeuta para trabajar la ansiedad y las heridas pasadas.", "Completar «Mi contexto» para entender mejor qué despierta sus miedos.", "Acordar con su pareja momentos regulares para hablar de la relación, sin interrogatorios.", "Si aparece un hecho nuevo, usar la situación correspondiente en lugar de cuestionarlo todo."], "studies": [], "links": ["contexte", "journal", "pause", "danger"], "safety": false}, {"n": 14, "id": "argument", "type": "communication", "badge": "communication", "title": "La conversación sobre fidelidad se convierte en discusión", "subtitle": "Tomar distancia", "conclude": "Una discusión muestra que el tema toca algo sensible en uno de los dos, o en ambos. No dice quién tiene razón, ni qué pasó. La prioridad es proteger la conversación y, ante todo, su seguridad.", "explanations": ["Un momento mal elegido: cansancio, alcohol, retraso, presencia de los hijos.", "Palabras vividas como una acusación, que empujan a defenderse.", "Heridas antiguas, en uno o en otro, que el tema de la fidelidad despierta.", "Dudas o reproches acumulados desde hace tiempo, que salen de golpe.", "Una relación de fuerza en la que uno intenta hacer callar al otro con gritos, amenazas o intimidación."], "clarify": ["Identifique las señales de que la conversación se descontrola: voz que sube, corazón que se acelera, ganas de tener la última palabra.", "Después, anote en «Mi diario» qué provocó la discusión y lo que dijo cada uno.", "En «Mi contexto», observe si este tema despierta en usted experiencias pasadas.", "Pregúntese si sintió miedo durante la discusión. Si es así, consulte «Señales de peligro»."], "avoid": ["Seguir a toda costa para «resolverlo esta noche».", "Bloquear la puerta, retener a su pareja o aceptar que le retengan.", "Tomar el teléfono de su pareja o sacar mensajes durante la discusión."], "firstHours": ["Aléjese físicamente: otra habitación, un paseo afuera. Use «Hacer una pausa».", "Si tiene miedo, le amenazan o le impiden irse, póngase a salvo y contacte a una persona de confianza o a emergencias.", "No retome la conversación esa misma noche si sigue enojado/a.", "Escriba lo que siente, sin enviárselo a su pareja."], "question": "Siento que los dos nos estamos alterando. Propongo una pausa de una hora. Seguimos después, cuando podamos hablar sin gritar, ¿de acuerdo?", "answers": [{"label": "Acepta la pausa", "advice": "Fijen un momento para retomarlo. Durante la pausa, haga algo que le calme, sin preparar sus argumentos.", "followUp": "Gracias. Nos vemos en una hora, o mañana si necesitamos más tiempo."}, {"label": "El tono sigue subiendo", "advice": "No responda en el mismo tono. Use «Hacer una pausa» y salga de la habitación con calma.", "followUp": "No quiero seguir así. Voy a salir un momento, lo hablaremos más tarde."}, {"label": "Su pareja le impide irse o le amenaza", "advice": "Su seguridad es lo primero. Váyase si puede, contacte a una persona de confianza o a emergencias. Consulte «Señales de peligro».", "followUp": "Necesito salir ahora. Déjame pasar, por favor."}, {"label": "Se niega a retomar el tema", "advice": "El rechazo no es una confesión. Su pareja puede necesitar tiempo. Proponga hablarlo más tarde, quizás con un terapeuta.", "followUp": "De acuerdo, lo dejamos por hoy. Me gustaría que lo volviéramos a hablar, quizás con ayuda de alguien."}, {"label": "Disculpas y ganas de retomarlo con calma", "advice": "Acepte las disculpas y ofrezca las suyas si hace falta. Retómenlo con una sola pregunta, hablando de usted.", "followUp": "Yo también lo siento. Solo quiero decirte lo que siento, sin acusarte."}], "next": ["Acordar una señal común para pedir una pausa durante las conversaciones difíciles.", "Trabajar su propia ansiedad con un acompañamiento individual, y completar «Mi contexto».", "Si las discusiones se repiten, considerar una terapia de pareja, salvo en caso de violencia.", "En caso de miedo, amenazas o violencia, consultar primero «Señales de peligro»."], "studies": [], "links": ["contexte", "pause", "danger", "journal"], "safety": true}, {"n": 15, "id": "accord-exclusivite", "type": "communication", "badge": "communication", "title": "No tienen el mismo acuerdo sobre exclusividad", "subtitle": "Aclarar la exclusividad", "conclude": "Cada pareja fija sus propios límites, a menudo sin decirlos. Lo que para uno es una traición puede parecerle algo sin importancia al otro. Un desacuerdo sobre el acuerdo no prueba una infidelidad: muestra que hay que hacerlo explícito.", "explanations": ["Nunca hablaron claramente de sus límites: cada uno supuso que el otro pensaba igual.", "Su historia, su cultura o su entorno dan a cada uno una idea distinta de la fidelidad.", "Las necesidades de uno o del otro han cambiado desde el comienzo de la relación.", "Los intercambios en línea, las amistades cercanas o las aplicaciones no se ven igual por cada uno.", "Su pareja alega un desacuerdo a posteriori, para justificar un comportamiento que sabía que le heriría."], "clarify": ["Antes de hablarlo, anote para usted lo que es aceptable, lo que le molesta y lo que no es negociable.", "Hablen de comportamientos concretos en lugar de palabras generales: una cena a solas con alguien, mensajes de seducción, una aplicación, un beso.", "Proponga a su pareja hacer el mismo ejercicio, sin buscar quién tiene razón.", "Distinga el acuerdo pasado, lo que cada uno creía, del acuerdo futuro, lo que quieren ahora.", "Un acompañamiento individual puede ayudarle a entender de dónde vienen sus propias expectativas."], "avoid": ["Imponer su definición como la única «normal» o intentar ganar el debate.", "Comprobar en secreto si su pareja respeta sus límites: teléfono, cuentas, desplazamientos.", "Aceptar un acuerdo que no le conviene por miedo a perder la relación."], "firstHours": ["Descubrir que no pensaban lo mismo puede desestabilizar. Tómese tiempo para asimilarlo.", "Escriba sus límites en «Mi diario» mientras los tiene claros.", "Si el desacuerdo viene de un hecho preciso que le hirió, consulte también la situación correspondiente."], "question": "Me doy cuenta de que quizás no entendemos lo mismo por nuestro compromiso. ¿Qué significa para ti hoy?", "answers": [{"label": "Una definición parecida a la suya", "advice": "Nombre los puntos en común y las pocas diferencias. Un acuerdo claro se construye con ejemplos concretos.", "followUp": "Estamos de acuerdo en lo esencial. ¿Podemos hacer juntos una lista de lo que es aceptable y lo que no?"}, {"label": "Una definición muy distinta de la suya", "advice": "Escuche hasta el final antes de responder. Nadie está equivocado por principio: la cuestión es si un acuerdo común es posible.", "followUp": "No lo había entendido así. Déjame pensarlo. Dime qué es realmente importante para ti."}, {"label": "«No hace falta hablarlo, es obvio»", "advice": "Lo que parece obvio para uno no siempre lo es para el otro. Explique que lo habla para evitar heridas, no para acusar.", "followUp": "Para mí no es tan obvio. Prefiero que nos lo digamos, para no hacernos daño sin querer."}, {"label": "Enojo o el tono sube", "advice": "Este tema toca la seguridad afectiva: es normal que sea sensible. Proponga «
