:root{--ink:#233f3c;--green:#365f52;--cream:#f6f5ef;--muted:#697b73;--line:#dce3db}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fffdf8}.brand{font:600 23px Georgia}.brand span{color:#b27a60}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:white;border-radius:30px;padding:10px 18px;color:var(--ink)}button:hover,button.active{background:var(--green);color:white}main{max-width:1160px;margin:auto;padding:32px 24px 80px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}h1{font:normal clamp(36px,5vw,64px)/1.12 Georgia;margin:16px 0 22px}h2{font:normal 30px/1.2 Georgia}h3{font-size:18px;margin:0 0 8px}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:50px;align-items:center;padding:24px 0 42px}.hero p{max-width:600px;color:var(--muted)}art{display:block;position:relative;background:#e5ece1;border-radius:180px 180px 24px 24px;height:310px;overflow:hidden}.circle{position:absolute;border-radius:50%;width:130px;height:130px;background:#c49b7e;left:55px;top:62px}.circle.two{background:#7d9c83;left:auto;right:55px;top:95px}.arc{position:absolute;left:32px;right:32px;bottom:-80px;height:210px;background:#f4ede1;border-radius:50%}.artlabel{position:absolute;bottom:26px;text-align:center;width:100%;font:italic 25px Georgia}.primary{background:var(--green);color:white}.note{padding:16px 20px;background:#e9eee5;border-radius:14px;font-size:14px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:23px}.card p{color:var(--muted);font-size:14px}.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#97715e}.car dding:26px;transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #53326412}.grid .card:nth-child(4n+1){background:#fff0eb}.grid .card:nth-child(4n+2){background:#f4edff}.grid .card:nth-child(4n+3){background:#fff5d9}.grid .card:nth-child(4n){background:#eaf7f3}.grid .card h3{font-size:21px;letter-spacing:-.6px}.grid .card button{background:#ffffffc9;border-color:#d8c5df;font-size:13px;padding:10px 14px}.grid .card button:hover{background:#7436d2;color:white}.tag{color:#86547a}.scenario-icon{font-size:31px;color:#912e8a;margin:8px 0 14px;line-height:1}.quote{background:#fff0e8;border-color:#dc568a}.result{background:#f0e5ff}.step{color:#a02c6d}footer{background:#f3eafa;margin-top:20px;padding:26px}input,textarea,select{border-color:#d7c5dd}button:disabled{opacity:.65;cursor:default;transform:none}@media(max-width:760px){.hero{padding-top:20px;gap:28px;min-height:unset}.hero h1{font-size:46px;letter-spacing:-1.6px}.hero p{font-size:16px}.couple{height:290px;border-radius:65px 20px 65px 20px;box-shadow:9px 9px 0 #ffc75d}.couple-wrap{max-width:500px;margin:0 auto;width:100%}.photo-badge{left:6px;font-size:12px;padding:12px}.spark{right:-5px;font-size:48px}.brand{font-size:22px}header{position:static}.topline h2{font-size:30px}.hero .eyebrow{font-size:9px}.grid{gap:13px}.grid .card{padding:22px}}

.recit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}.recit-badge{display:inline-block;background:#fff1d6;border:1px solid #e9c98a;border-radius:20px;padding:4px 14px;font-size:14px}.recit-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 26px}.recit-item{display:grid;grid-template-columns:1fr 220px;gap:10px;align-items:start;margin:8px 0}.recit-item textarea{min-height:70px}.recit-qa .quote{margin-bottom:10px}.recit-answer{border-left:4px solid var(--green);padding:6px 14px;margin:12px 0;background:#fbfaf6;border-radius:0 12px 12px 0}.recit-answer.off{opacity:.55;border-left-color:#bbb}.recit-answer mark{background:#ffe7a3;border-radius:4px;padding:0 3px}.recit-audio{border:1px dashed var(--line);border-radius:16px;padding:12px 16px;margin:16px 0}.recit-consent{display:flex;gap:10px;align-items:flex-start;font-weight:normal}.recit-consent input{width:auto;margin-top:6px}.recit-rec{color:#b3261e;font-weight:700}.recit-table{overflow-x:auto}.recit-table table{border-collapse:collapse;width:100%;min-width:760px;background:white}.recit-table td,.recit-table th{border:1px solid var(--line);padding:8px;vertical-align:top;font-size:14px}.recit-table select,.recit-in{width:100%;margin:3px 0}.recit-chk{display:flex;gap:6px;align-items:center;font-weight:normal;font-size:13px}.recit-chk input{width:auto}.recit-unc{background:#fff8e1}.recit-ind{padding:8px 0;border-bottom:1px solid var(--line)}.recit-ai pre{white-space:pre-wrap;font:inherit;background:#f5f2ea;padding:12px;border-radius:12px}@media (max-width:700px){.recit-item{grid-template-columns:1fr}}@media print{header,footer,.recit-tabs,.actions,button{display:none!important}}

</style></head><body><header></header><main id="app"></main><footer></footer><script>const CONTENT={"fr": {"scenarios": [["Vous voyez votre partenaire au restaurant avec quelqu’un", "Une sortie à deux", "Je t’ai vu sortir du restaurant avec cette personne. Dans quel contexte vous connaissez-vous ?", "Une sortie peut être amicale, familiale, professionnelle ou amoureuse. Le lieu et le genre de la personne ne suffisent pas à conclure."], ["Vous voyez votre partenaire sortir d’un hôtel avec quelqu’un", "Un contexte à clarifier", "Je t’ai vu sortir de cet hôtel avec cette personne. Dans quel contexte étiez-vous là ?", "Un hôtel peut accueillir des réunions, visites ou séjours. Cette observation ne démontre pas un rapport sexuel."], ["Quelqu’un vient de déposer votre partenaire en voiture", "Quelqu’un raccompagne votre partenaire", "Qui t’a raccompagné ? Comment s’est passée ta sortie ?", "Un trajet partagé ne renseigne pas sur une relation intime."], ["Vous apercevez votre partenaire embrasser quelqu’un", "Vérifier ce qui a été vu", "J’ai aperçu ce qui m’a semblé être un baiser sur la bouche. Est-ce bien ce qui s’est passé ?", "Une vision à distance peut être ambiguë. Un baiser amoureux confirmé peut franchir une limite convenue, sans prouver un rapport sexuel."], ["Votre partenaire refuse de montrer ses conversations privées", "Vie privée et confiance", "Je respecte ton espace privé. Comment parler de ce qui m’inquiète et de nos limites dans les échanges avec les autres ?", "Refuser une fouille du téléphone ne démontre pas une infidélité. L’accès doit être librement consenti, jamais imposé."], ["Votre partenaire sort sans vous expliquer ses projets", "Se prévenir sans se surveiller", "Peut-on convenir de se prévenir lors d’une sortie et de donner une heure approximative de retour ?", "Cherchez une règle réciproque qui respecte l’autonomie de chacun."], ["Votre partenaire devient nerveux pendant votre discussion", "Accueillir le malaise", "Cette discussion semble te mettre mal à l’aise. Est-ce mon ton, le sujet ou autre chose ?", "La nervosité ne permet pas de détecter un mensonge. Une pause peut faciliter l’échange."], ["Votre partenaire se fait beau ou belle pour une sortie ordinaire", "L’apparence et ses interprétations", "Tu as choisi une jolie tenue aujourd’hui. Une occasion particulière ?", "Se faire beau ou belle peut simplement procurer du plaisir. Ce n’est pas une preuve d’infidélité."], ["Le récit de votre partenaire contient une contradiction", "Clarifier sans piéger", "Tout à l’heure, tu as dit X, et maintenant Y. Peux-tu m’aider à comprendre cette différence ?", "La mémoire, une incompréhension ou un changement de plan peuvent expliquer une différence. Restez sur les faits précis."], ["Votre partenaire souhaite moins de contacts intimes", "Écouter les besoins", "Comment te sens-tu dans notre intimité ? Y a-t-il quelque chose dont tu aurais besoin ?", "Le désir et le besoin de proximité varient. Chacun peut refuser un contact, sans avoir à prouver sa fidélité."], ["Votre partenaire échange de nombreux messages avec quelqu’un", "Définir les limites ensemble", "Quelles limites souhaitons-nous pour les échanges amicaux, amoureux ou sexuels avec d’autres personnes ?", "La fréquence des messages seule ne révèle pas leur contenu. Évitez les accès clandestins aux comptes."], ["Votre partenaire reconnaît une relation avec une autre personne", "Choisir la suite", "J’ai besoin de comprendre ce qui s’est passé et de réfléchir à ce que je souhaite pour la suite. Pouvons-nous en parler calmement ?", "Vous pouvez demander du temps, choisir une séparation ou envisager une réparation. Le pardon ne se commande pas."], ["Vous soupçonnez souvent une tromperie sans fait nouveau", "Comprendre son inquiétude", "Je remarque que mes inquiétudes reviennent souvent. Peut-on parler de ce qui nourrit cette insécurité ?", "Distinguez les observations actuelles des peurs et des expériences passées. Un accompagnement individuel peut aider."], ["Votre discussion sur la fidélité se transforme en dispute", "Prendre de la distance", "Je préfère qu’on fasse une pause. Reprenons quand nous pourrons parler sans crier.", "Si vous avez peur, êtes menacé ou empêché de partir, privilégiez votre sécurité et contactez une personne de confiance."], ["Vous n’avez pas le même accord sur l’exclusivité", "Clarifier l’exclusivité", "Qu’est-ce que notre engagement signifie pour chacun de nous aujourd’hui ?", "Les accords peuvent différer entre couples. Définissez explicitement les comportements acceptés et les limites."], ["Votre partenaire refuse de parler de vos doutes", "Respect et besoins personnels", "Je respecte que tu ne veuilles pas en parler maintenant. Quand pourrions-nous reprendre cette discussion ?", "Un refus n’est pas un aveu. Vous pouvez exprimer vos besoins et décider si la relation vous convient."], ["Votre partenaire reconnaît avoir effacé des messages pour vous les cacher", "Suppression reconnue, contenu à clarifier", "Tu dis avoir effacé ces messages pour me les cacher. Que concernaient-ils et quel accord cela touche-t-il ?", "La dissimulation est reconnue, pas nécessairement une liaison. Effacer des messages, sans contexte établi, peut aussi relever d’un usage ordinaire."], ["Votre partenaire vous parle d’un compte de messagerie non déclaré", "Compte distinct, usage à clarifier", "À quoi sert ce compte et quelles limites souhaitons-nous pour les échanges amoureux avec d’autres ?", "Un compte professionnel ou privé n’est pas une preuve. Discutez de l’usage reconnu, sans chercher à forcer l’accès."], ["Votre partenaire reconnaît une intimité affective cachée avec quelqu’un", "Lien émotionnel et limites du couple", "Quelle place a cette relation et qu’avons-nous convenu concernant les liens amoureux ou émotionnels avec d’autres ?", "Une amitié proche n’est pas automatiquement une infidélité. Clarifiez le caractère amoureux, le secret reconnu et vos accords."], ["Votre partenaire reconnaît utiliser une application de rencontres", "Usage actuel, statut et intention", "Quel usage fais-tu actuellement de cette application et comment cela s’accorde-t-il avec notre engagement ?", "Un ancien profil ne prouve pas un usage actuel. Un usage reconnu doit être discuté selon votre accord, sans présumer de rencontres physiques."], ["Votre partenaire reconnaît avoir inventé une sortie ou un déplacement", "Un faux récit reconnu", "Tu reconnais que cette explication était inventée. Que s’est-il passé et de quoi ai-je besoin pour décider de la suite ?", "Le mensonge reconnu concerne ce récit précis. Il ne prouve pas à lui seul un rapport sexuel ou une autre liaison."], ["Votre partenaire admet des échanges sexuels en ligne mais dit « ce n’est que virtuel »", "Définir ensemble l’infidélité numérique", "Pour moi, ces échanges touchent notre engagement. Quelles limites pensions-nous avoir et que voulons-nous maintenant ?", "L’absence de contact physique ne règle pas la question des limites. Le désaccord doit porter sur les faits reconnus et les accords du couple."], ["Votre partenaire reconnaît avoir caché une dépense liée à quelqu’un", "Secret financier, motif à comprendre", "Quelle était cette dépense et quel accord avons-nous concernant l’argent partagé et les cadeaux ?", "Une dépense cachée peut poser un problème financier sans prouver une liaison. Ne contrôlez pas les comptes privés ; abordez les responsabilités partagées."], ["Votre partenaire reconnaît s’être présenté comme célibataire", "Statut de couple nié auprès d’un tiers", "Tu reconnais avoir dit être célibataire. Dans quel contexte, et qu’est-ce que cela signifie pour notre engagement ?", "Le fait reconnu est ce mensonge sur le statut. Il ne confirme pas une relation sexuelle ; discutez de ses conséquences et de vos limites."]], "signs": [["Regard détourné", "Timidité, réflexion, fatigue, gêne ou habitudes culturelles.", "Qu’est-ce qui te mettrait plus à l’aise pour parler ?"], ["Bras croisés ou posture fermée", "Confort, froid, tension ou besoin de distance.", "Souhaites-tu qu’on change de cadre ou qu’on fasse une pause ?"], ["Rougeur ou transpiration", "Chaleur, effort, stress ou émotion.", "Est-ce que tu as besoin d’un moment ?"], ["Voix tremblante ou hésitations", "Stress, peur du conflit, émotion ou recherche des mots.", "Prends ton temps, je t’écoute."], ["Sourire ou rire nerveux", "Gêne, politesse ou manière de réguler la tension.", "Comment vis-tu cette conversation ?"], ["Colère ou ton défensif", "Sentiment d’être accusé, frustration ou désaccord.", "Peut-on reprendre avec un ton plus calme ?"], ["Silence ou réponse courte", "Fatigue, besoin de réflexion ou difficulté à parler.", "Préfères-tu répondre plus tard ou par écrit ?"], ["Changement de proximité physique", "Besoin d’espace, fatigue, humeur ou difficultés relationnelles.", "Quel niveau de proximité te convient maintenant ?"], ["Cheveux ou vêtements dérangés", "Vent, trajet, travail ou activité quotidienne.", "Aucune conclusion sur une activité sexuelle ne peut être tirée de cette apparence."], ["Respiration plus rapide ou cœur qui bat vite", "Réactions physiologiques non spécifiques : elles ne permettent pas d’établir la cause ou de confirmer une activité sexuelle.", "Ne mesurez pas le corps de votre partenaire pour chercher une preuve."], ["Lubrification ou érection", "Une réaction corporelle ne prouve ni rapport sexuel récent, ni désir pour une personne précise, ni consentement.", "Le consentement se demande explicitement et peut être retiré."], ["Sécrétions, odeur ou saignement", "Les sécrétions peuvent varier normalement. Leur aspect ne permet pas de conclure à une infidélité.", "Si un changement inhabituel ou une douleur inquiète la personne, elle peut demander un avis médical. Ne pratiquez pas d’inspection."], ["Hymen ou apparence génitale", "L’apparence de l’hymen ne permet pas de prouver des rapports vaginaux.", "Aucun test de virginité. Voir la déclaration de l’OMS dans Mon contexte."], ["Expressions très brèves", "Expressions ambiguës et dépendantes du contexte.", "Les microexpressions ne constituent pas un détecteur fiable de mensonge."]], "dangerItems": [["Menaces de mort ou arme utilisée pour intimider", "Des paroles ou gestes qui font craindre une blessure ou la mort. Il n’est pas nécessaire d’attendre un passage à l’acte."], ["Pression sur le cou ou suffocation", "Toute compression du cou ou entrave à la respiration est grave, même sans marque visible. Une évaluation médicale rapide est nécessaire."], ["Contrôle des déplacements et du téléphone", "Imposer des mots de passe, une géolocalisation ou des comptes rendus sous menace dépasse une demande de communication."], ["Isolement", "Empêcher les contacts avec les proches, le travail ou les soutiens extérieurs réduit l’autonomie."], ["Violence ou coercition sexuelle", "Imposer un contact, poursuivre après un refus, ou faire pression pour obtenir un acte sexuel. Le couple ne remplace pas le consentement."], ["Harcèlement ou surveillance après une rupture", "Suivre la personne, multiplier les contacts non souhaités ou apparaître régulièrement à ses lieux de vie."], ["Contrôle économique ou administratif", "Confisquer l’argent ou les documents, empêcher de travailler, ou utiliser le statut migratoire comme menace."], ["Humiliation et intimidation répétées", "Rabaisser, effrayer, détruire des objets ou menacer les proches pour obtenir l’obéissance."], ["Escalade", "Des violences qui deviennent plus fréquentes, des menaces plus précises ou l’usage d’une arme appellent une aide spécialisée."], ["Refus de respecter les limites", "Punir un refus, empêcher de partir ou imposer des règles unilatérales par la peur."]]}, "en": {"scenarios": [["You see your partner at a restaurant with someone", "A meal together", "I saw you leaving the restaurant with that person. How do you know each other?", "The outing may be friendly, family-related, professional or romantic. The location and the person’s gender do not establish what happened."], ["You see your partner leaving a hotel with someone", "Clarify the context", "I saw you leaving that hotel with someone. What was the context?", "Hotels host meetings, visits and overnight stays. Leaving one does not prove sexual activity."], ["Someone has just driven your partner home", "Someone drives your partner", "Who gave you a ride? How was your outing?", "Sharing a ride does not establish an intimate relationship."], ["You see your partner kissing someone", "Check what you saw", "I saw what looked like a kiss on the lips. Is that what happened?", "A distant view may be ambiguous. A confirmed romantic kiss may cross an agreed boundary, but does not prove sex."], ["Your partner refuses to show private conversations", "Privacy and trust", "I respect your privacy. How can we discuss my worries and our boundaries with other people?", "Refusing a phone search does not prove cheating. Access must be freely agreed, never forced."], ["Your partner goes out without explaining their plans", "Communicate without monitoring", "Could we agree to let each other know when we go out and give an approximate return time?", "Find a mutual agreement that respects each person’s independence."], ["Your partner becomes nervous during your conversation", "Make room for discomfort", "This conversation seems uncomfortable for you. Is it my tone, the topic or something else?", "Nervousness is not a lie detector. A pause may help."], ["Your partner dresses up for an ordinary outing", "Appearance and assumptions", "You chose a lovely outfit today. Any particular occasion?", "Dressing well may simply feel good. It is not reliable evidence of cheating."], ["Your partner’s account contains a contradiction", "Clarify without trapping", "Earlier you said X, and now Y. Can you help me understand the difference?", "Memory, misunderstanding or changed plans may explain a difference. Focus on specific facts."], ["Your partner wants less intimate contact", "Listen to needs", "How do you feel about our intimacy? Is there anything you need?", "Desire and closeness vary. Anyone can decline contact without having to prove fidelity."], ["Your partner exchanges many messages with someone", "Agree on boundaries", "What boundaries do we want for friendly, romantic or sexual exchanges with other people?", "Message frequency alone does not reveal the content. Do not secretly access accounts."], ["Your partner acknowledges a relationship with another person", "Choose what comes next", "I need to understand what happened and think about what I want next. Can we talk calmly?", "You can ask for time, separate or consider repair. Forgiveness cannot be demanded."], ["You often suspect cheating without new facts", "Understand your worry", "My worries keep coming back. Can we talk about what is feeding this insecurity?", "Separate present observations from fears and past experiences. Individual support may help."], ["Your conversation about fidelity turns into an argument", "Take a step back", "I would prefer a pause. Let’s return when we can speak without shouting.", "If you are afraid, threatened or prevented from leaving, prioritize safety and contact someone you trust."], ["You do not share the same agreement on exclusivity", "Clarify exclusivity", "What does our commitment mean to each of us today?", "Relationship agreements differ. Define accepted behavior and boundaries explicitly."], ["Your partner refuses to discuss your doubts", "Respect and personal needs", "I respect that you don’t want to discuss this now. When could we return to it?", "A refusal is not an admission. You can express your needs and decide whether the relationship works for you."], ["Your partner acknowledges deleting messages to hide them from you", "Acknowledged deletion, content to clarify", "You say you deleted these messages to hide them from me. What were they about, and which agreement does this affect?", "Concealment is acknowledged, not necessarily an affair. Deleting messages without established context may also be ordinary use."], ["Your partner tells you about an undisclosed messaging account", "A separate account, usage to clarify", "What is this account for, and what boundaries do we want for romantic exchanges with others?", "A work or private account is not proof. Discuss acknowledged use without forcing access."], ["Your partner acknowledges hidden emotional intimacy with someone", "An emotional bond and relationship boundaries", "What place does this relationship have, and what have we agreed about romantic or emotional bonds with others?", "A close friendship is not automatically cheating. Clarify romantic involvement, acknowledged secrecy and your agreements."], ["Your partner acknowledges using a dating app", "Current use, status and intention", "How are you currently using this app, and how does that fit our commitment?", "An old profile does not prove current use. Discuss acknowledged use according to your agreement without assuming physical meetings."], ["Your partner acknowledges inventing an outing or trip", "An acknowledged false account", "You acknowledge that explanation was invented. What happened, and what do I need to decide what comes next?", "The acknowledged lie concerns this specific account. It alone does not prove sex or another relationship."], ["Your partner admits online sexual exchanges but says “it’s only virtual”", "Define digital infidelity together", "For me, these exchanges affect our commitment. What boundaries did we think we had, and what do we want now?", "No physical contact does not settle the boundary question. Discuss acknowledged facts and your relationship agreements."], ["Your partner acknowledges hiding a spending item involving someone", "A financial secret, motive to understand", "What was this expense, and what agreement do we have about shared money and gifts?", "Hidden spending can be a financial problem without proving an affair. Do not control private accounts; discuss shared responsibilities."], ["Your partner acknowledges telling someone they are single", "Denying relationship status to another person", "You acknowledge saying you were single. What was the context, and what does that mean for our commitment?", "The acknowledged fact is the lie about relationship status. It does not confirm sex; discuss its consequences and your boundaries."]], "signs": [["Looking away", "Shyness, thinking, tiredness, discomfort or cultural habits may explain it.", "What would help you feel more comfortable talking?"], ["Crossed arms or closed posture", "Comfort, cold, tension or a need for distance.", "Would you like a different setting or a pause?"], ["Blushing or sweating", "Heat, exertion, stress or emotion.", "Do you need a moment?"], ["A shaky voice or hesitation", "Stress, fear of conflict, emotion or searching for words.", "Take your time. I’m listening."], ["Smiling or nervous laughter", "Discomfort, politeness or regulating tension.", "How are you experiencing this conversation?"], ["Anger or a defensive tone", "Feeling accused, frustration or disagreement.", "Can we continue in a calmer tone?"], ["Silence or short answers", "Tiredness, reflection or difficulty talking.", "Would you prefer to reply later or in writing?"], ["A change in physical closeness", "A need for space, tiredness, mood or relationship difficulties.", "What level of closeness feels right now?"], ["Messy hair or clothes", "Wind, travel, work or everyday activities.", "Appearance cannot establish recent sexual activity."], ["Faster breathing or heartbeat", "These physical reactions have many causes; they do not establish sexual activity.", "Do not measure your partner’s body to seek proof."], ["Lubrication or an erection", "A bodily response does not prove recent sex, desire for a particular person or consent.", "Ask for consent explicitly. It can be withdrawn."], ["Discharge, odor or bleeding", "Discharge can vary normally. Its appearance does not establish cheating.", "If a change or pain worries the person, they can seek medical advice. Do not perform inspections."], ["Hymen or genital appearance", "Hymen appearance cannot prove vaginal intercourse.", "No virginity testing. See the WHO statement under My context."], ["Brief facial expressions", "Expressions are ambiguous and context-dependent.", "Microexpressions are not a reliable lie detector."]], "dangerItems": [["Death threats or a weapon used to intimidate", "Words or actions that make you fear injury or death. You do not have to wait for an assault."], ["Pressure on the neck or suffocation", "Any restriction of breathing or pressure on the neck is serious, even without visible marks. Seek prompt medical assessment."], ["Control of movement and phone use", "Demanding passwords, location tracking or reports under threat goes beyond communication."], ["Isolation", "Preventing contact with friends, family, work or outside support reduces independence."], ["Sexual violence or coercion", "Forcing contact, continuing after a refusal or pressuring someone into sexual activity. A relationship never replaces consent."], ["Stalking after separation", "Following someone, repeated unwanted contact or repeatedly appearing at their regular locations."], ["Economic or administrative control", "Taking money or documents, blocking employment or using immigration status as a threat."], ["Repeated humiliation and intimidation", "Belittling, frightening, destroying property or threatening loved ones to obtain compliance."], ["Escalation", "More frequent violence, more specific threats or weapon use call for specialist support."], ["Disregard for boundaries", "Punishing a refusal, preventing departure or imposing one-sided rules through fear."]]}, "es": {"scenarios": [["Ves a tu pareja en un restaurante con alguien", "Una comida en compañía", "Te vi salir del restaurante con esa persona. ¿Cómo se conocen?", "Puede ser una salida amistosa, familiar, profesional o romántica. El lugar y el género de la persona no permiten concluir nada."], ["Ves a tu pareja salir de un hotel con alguien", "Aclarar el contexto", "Te vi salir de ese hotel con alguien. ¿En qué contexto estaban allí?", "Los hoteles acogen reuniones, visitas y estancias. Salir de uno no demuestra una relación sexual."], ["Alguien acaba de llevar a tu pareja en coche", "Alguien lleva a tu pareja", "¿Quién te trajo? ¿Cómo fue la salida?", "Compartir un viaje no demuestra una relación íntima."], ["Ves a tu pareja besar a alguien", "Comprobar lo observado", "Vi lo que parecía un beso en los labios. ¿Fue eso lo que pasó?", "Una visión lejana puede ser ambigua. Un beso romántico confirmado puede cruzar un límite acordado, pero no demuestra una relación sexual."], ["Tu pareja se niega a mostrar conversaciones privadas", "Privacidad y confianza", "Respeto tu privacidad. ¿Cómo podemos hablar de mis preocupaciones y de nuestros límites con otras personas?", "Negarse a una revisión del teléfono no demuestra infidelidad. El acceso debe ser libremente consentido, nunca impuesto."], ["Tu pareja sale sin explicar sus planes", "Comunicarse sin vigilar", "¿Podemos acordar avisarnos al salir y dar una hora aproximada de regreso?", "Busquen un acuerdo mutuo que respete la autonomía de cada persona."], ["Tu pareja se pone nerviosa durante la conversación", "Dar espacio al malestar", "Esta conversación parece incomodarte. ¿Es mi tono, el tema u otra cosa?", "El nerviosismo no detecta mentiras. Una pausa puede ayudar."], ["Tu pareja se arregla para una salida cotidiana", "Apariencia e interpretaciones", "Hoy elegiste un conjunto bonito. ¿Hay alguna ocasión especial?", "Arreglarse puede simplemente hacer sentir bien. No es una prueba fiable de infidelidad."], ["El relato de tu pareja contiene una contradicción", "Aclarar sin tender trampas", "Antes dijiste X y ahora Y. ¿Puedes ayudarme a entender la diferencia?", "La memoria, un malentendido o cambios de planes pueden explicar una diferencia. Céntrate en hechos concretos."], ["Tu pareja desea menos contacto íntimo", "Escuchar las necesidades", "¿Cómo te sientes con nuestra intimidad? ¿Necesitas algo?", "El deseo y la cercanía varían. Cualquiera puede rechazar un contacto sin tener que demostrar fidelidad."], ["Tu pareja intercambia muchos mensajes con alguien", "Acordar límites", "¿Qué límites queremos para los intercambios amistosos, románticos o sexuales con otras personas?", "La frecuencia de mensajes no revela su contenido. No accedas a cuentas a escondidas."], ["Tu pareja reconoce una relación con otra persona", "Elegir cómo seguir", "Necesito comprender lo ocurrido y pensar qué quiero hacer. ¿Podemos hablar con calma?", "Puedes pedir tiempo, separarte o considerar una reparación. El perdón no se exige."], ["Sospechas a menudo una infidelidad sin hechos nuevos", "Comprender la preocupación", "Mis preocupaciones vuelven a menudo. ¿Podemos hablar de lo que alimenta esta inseguridad?", "Distingue las observaciones actuales de los temores y experiencias pasadas. El apoyo individual puede ayudar."], ["La conversación sobre fidelidad se convierte en discusión", "Tomar distancia", "Prefiero hacer una pausa. Volvamos a hablar cuando podamos hacerlo sin gritar.", "Si tienes miedo, recibes amenazas o te impiden salir, prioriza tu seguridad y contacta a alguien de confianza."], ["No tienen el mismo acuerdo sobre exclusividad", "Aclarar la exclusividad", "¿Qué significa hoy nuestro compromiso para cada uno?", "Los acuerdos varían entre parejas. Definan explícitamente los comportamientos aceptados y los límites."], ["Tu pareja se niega a hablar de tus dudas", "Respeto y necesidades personales", "Respeto que no quieras hablar ahora. ¿Cuándo podríamos retomar la conversación?", "Negarse no es confesar. Puedes expresar tus necesidades y decidir si la relación te conviene."], ["Tu pareja reconoce haber borrado mensajes para ocultártelos", "Borrado reconocido, contenido por aclarar", "Dices que borraste esos mensajes para ocultármelos. ¿De qué trataban y qué acuerdo afecta esto?", "Se reconoce la ocultación, no necesariamente una aventura. Borrar mensajes sin contexto establecido también puede ser un uso cotidiano."], ["Tu pareja te habla de una cuenta de mensajería no declarada", "Otra cuenta, uso por aclarar", "¿Para qué sirve esta cuenta y qué límites queremos para los intercambios románticos con otras personas?", "Una cuenta laboral o privada no es una prueba. Hablen del uso reconocido sin forzar el acceso."], ["Tu pareja reconoce intimidad emocional oculta con alguien", "Un vínculo emocional y los límites de la pareja", "¿Qué lugar tiene esa relación y qué acordamos sobre vínculos románticos o emocionales con otras personas?", "Una amistad cercana no es automáticamente infidelidad. Aclaren el carácter romántico, el secreto reconocido y sus acuerdos."], ["Tu pareja reconoce usar una aplicación de citas", "Uso actual, estado e intención", "¿Cómo usas actualmente esta aplicación y cómo encaja con nuestro compromiso?", "Un perfil antiguo no demuestra uso actual. Hablen del uso reconocido según su acuerdo, sin suponer encuentros físicos."], ["Tu pareja reconoce haber inventado una salida o viaje", "Un relato falso reconocido", "Reconoces que esa explicación era inventada. ¿Qué pasó y qué necesito para decidir cómo seguir?", "La mentira reconocida concierne a ese relato concreto. No demuestra por sí sola sexo ni otra relación."], ["Tu pareja admite intercambios sexuales en línea pero dice «solo es virtual»", "Definir juntos la infidelidad digital", "Para mí, esos intercambios afectan nuestro compromiso. ¿Qué límites creíamos tener y qué queremos ahora?", "La ausencia de contacto físico no resuelve los límites. Hablen de los hechos reconocidos y de sus acuerdos."], ["Tu pareja reconoce ocultar un gasto relacionado con alguien", "Un secreto financiero, motivo por comprender", "¿Qué fue ese gasto y qué acuerdo tenemos sobre dinero compartido y regalos?", "Un gasto oculto puede ser un problema financiero sin demostrar una aventura. No controles cuentas privadas; hablen de responsabilidades compartidas."], ["Tu pareja reconoce haberse presentado como soltera", "Negar la relación ante otra persona", "Reconoces que dijiste estar sin pareja. ¿En qué contexto y qué significa para nuestro compromiso?", "El hecho reconocido es la mentira sobre el estado de pareja. No confirma sexo; hablen de sus consecuencias y límites."]], "signs": [["Desviar la mirada", "Timidez, reflexión, cansancio, incomodidad o hábitos culturales.", "¿Qué te ayudaría a hablar con más comodidad?"], ["Brazos cruzados o postura cerrada", "Comodidad, frío, tensión o necesidad de distancia.", "¿Prefieres otro lugar o una pausa?"], ["Rubor o sudor", "Calor, esfuerzo, estrés o emoción.", "¿Necesitas un momento?"], ["Voz temblorosa o vacilaciones", "Estrés, miedo al conflicto, emoción o búsqueda de palabras.", "Tómate tu tiempo. Te escucho."], ["Sonrisa o risa nerviosa", "Incomodidad, cortesía o regulación de la tensión.", "¿Cómo estás viviendo esta conversación?"], ["Enojo o tono defensivo", "Sentirse acusado, frustración o desacuerdo.", "¿Podemos seguir con un tono más tranquilo?"], ["Silencio o respuestas breves", "Cansancio, reflexión o dificultad para hablar.", "¿Prefieres responder más tarde o por escrito?"], ["Cambio de cercanía física", "Necesidad de espacio, cansancio, estado de ánimo o dificultades de pareja.", "¿Qué cercanía te resulta cómoda ahora?"], ["Cabello o ropa desordenados", "Viento, viajes, trabajo o actividades diarias.", "La apariencia no permite establecer una actividad sexual reciente."], ["Respiración o pulso acelerados", "Son reacciones físicas inespecíficas que no demuestran actividad sexual.", "No midas el cuerpo de tu pareja para buscar pruebas."], ["Lubricación o erección", "Una respuesta corporal no demuestra sexo reciente, deseo por alguien concreto ni consentimiento.", "El consentimiento se pide explícitamente y puede retirarse."], ["Secreciones, olor o sangrado", "Las secreciones pueden variar normalmente. Su aspecto no demuestra infidelidad.", "Si un cambio o dolor preocupa a la persona, puede consultar a un profesional. No realices inspecciones."], ["Himen o apariencia genital", "El aspecto del himen no permite demostrar relaciones vaginales.", "No a las pruebas de virginidad. Consulta la declaración de la OMS en Mi contexto."], ["Expresiones faciales breves", "Las expresiones son ambiguas y dependen del contexto.", "Las microexpresiones no detectan mentiras de forma fiable."]], "dangerItems": [["Amenazas de muerte o uso intimidatorio de armas", "Palabras o actos que hacen temer lesiones o la muerte. No hace falta esperar una agresión."], ["Presión en el cuello o asfixia", "Cualquier presión en el cuello o restricción de la respiración es grave, incluso sin marcas. Busca atención médica pronta."], ["Control de movimientos y teléfono", "Exigir contraseñas, ubicación o explicaciones bajo amenaza va más allá de comunicarse."], ["Aislamiento", "Impedir el contacto con familiares, amistades, el trabajo o apoyos externos reduce la autonomía."], ["Violencia o coacción sexual", "Forzar contacto, continuar tras una negativa o presionar para obtener actos sexuales. La pareja no sustituye el consentimiento."], ["Acoso después de una separación", "Seguir a la persona, insistir con contactos no deseados o aparecer repetidamente en sus lugares habituales."], ["Control económico o administrativo", "Retener dinero o documentos, impedir trabajar o amenazar con el estatus migratorio."], ["Humillación e intimidación repetidas", "Menospreciar, asustar, romper objetos o amenazar a seres queridos para obtener obediencia."], ["Escalada", "Violencia más frecuente, amenazas más concretas o uso de armas requieren apoyo especializado."], ["No respetar los límites", "Castigar una negativa, impedir salir o imponer reglas unilaterales mediante el miedo."]]}, "ht": {"scenarios": [["Ou wè patnè w nan restoran ak yon lòt moun", "Yon manje ansanm", "Mwen wè w ap soti nan restoran an ak moun sa a. Kijan nou konnen youn lòt?", "Se kapab yon sòti ant zanmi, fanmi, kòlèg oswa yon randevou damou. Kote a ak sèks moun nan pa sifi pou tire konklizyon."], ["Ou wè patnè w soti nan otèl ak yon lòt moun", "Klarifye sitiyasyon an", "Mwen wè w ap soti nan otèl sa a ak yon moun. Nan ki okazyon nou te la?", "Otèl resevwa reyinyon, vizit ak moun k ap pase nwit. Soti nan otèl pa pwouve te gen relasyon seksyèl."], ["Yon moun fèk depoze patnè w nan machin", "Yon moun mennen patnè w", "Kiyès ki mennen w? Kijan sòti a te pase?", "Pataje yon woulib pa pwouve yon relasyon entim."], ["Ou wè patnè w ap bo yon lòt moun", "Verifye sa ou wè", "Mwen wè sa ki te sanble yon bo sou bouch. Èske se sa ki te pase?", "Sa ou wè lwen ka pa klè. Yon bo damou ki konfime ka depase yon limit nou te dakò sou li, men li pa pwouve te gen sèks."], ["Patnè w refize montre konvèsasyon prive li yo", "Vi prive ak konfyans", "Mwen respekte vi prive w. Kijan nou ka pale sou enkyetid mwen ak limit nou genyen ak lòt moun?", "Refize fouye telefòn pa pwouve enfidelite. Moun nan dwe bay aksè lib, san fòse."], ["Patnè w soti san li pa esplike plan li yo", "Kominike san siveye", "Èske nou ka dakò pou n avèti youn lòt lè n ap soti epi bay yon lè retou apeprè?", "Chèche yon antant ki mache pou nou toude epi ki respekte endepandans chak moun."], ["Patnè w vin nève pandan konvèsasyon an", "Bay malèz la plas", "Sanble konvèsasyon sa a mete w malalèz. Èske se ton mwen, sijè a oswa yon lòt bagay?", "Lè yon moun nève, sa pa pwouve l ap bay manti. Yon poz ka ede."], ["Patnè w abiye byen pou yon sòti òdinè", "Aparans ak entèpretasyon", "Ou chwazi yon bèl rad jodi a. Èske gen yon okazyon espesyal?", "Abiye byen ka senpleman fè moun nan santi l byen. Sa pa prèv enfidelite."], ["Istwa patnè w rakonte a gen yon kontradiksyon", "Klarifye san pyèj", "Talè a ou te di X, kounye a ou di Y. Èske w ka ede m konprann diferans lan?", "Memwa, yon malantandi oswa chanjman plan ka esplike yon diferans. Rete sou enfòmasyon presi."], ["Patnè w vle mwens kontak entim", "Koute bezwen yo", "Kijan ou santi w ak entimite nou? Èske gen yon bagay ou bezwen?", "Dezi ak bezwen pwoksimite ka varye. Tout moun gen dwa refize kontak san yo pa bezwen pwouve fidelite yo."], ["Patnè w voye anpil mesaj ak yon moun", "Dakò sou limit yo", "Ki limit nou vle pou mesaj zanmitay, damou oswa seksyèl ak lòt moun?", "Kantite mesaj pa revele sa ki ladan yo. Pa antre nan kont moun nan an kachèt."], ["Patnè w rekonèt li gen yon relasyon ak yon lòt moun", "Chwazi sa k ap vini apre", "Mwen bezwen konprann sa ki pase a epi reflechi sou sa m vle fè. Èske nou ka pale ak kalm?", "Ou ka mande tan, separe oswa konsidere rebati relasyon an. Pèsonn pa ka fòse padon."], ["Ou sispèk enfidelite souvan san nouvo enfòmasyon", "Konprann enkyetid ou", "Enkyetid mwen yo toujou ap retounen. Èske nou ka pale sou sa ki lakòz ensekirite sa a?", "Separe sa ou wè kounye a ak laperèz oswa eksperyans pase. Sipò endividyèl ka ede."], ["Konvèsasyon sou fidelite a tounen diskisyon", "Pran distans", "Mwen ta pito fè yon poz. Ann reprann lè nou ka pale san rele.", "Si w pè, si yo menase w oswa anpeche w soti, mete sekirite w an premye epi kontakte yon moun ou fè konfyans."], ["Nou pa gen menm antant sou fidelite", "Klarifye fidelite a", "Kisa angajman nou vle di pou chak moun jodi a?", "Antant yo diferan selon koup la. Defini klèman konpòtman nou aksepte ak limit nou yo."], ["Patnè w refize pale sou dout ou yo", "Respè ak bezwen pèsonèl", "Mwen respekte ou pa vle pale kounye a. Kilè nou ta ka reprann konvèsasyon an?", "Refize pale pa yon konfesyon. Ou ka esplike bezwen w epi deside si relasyon an bon pou ou."], ["Patnè w rekonèt li te efase mesaj pou kache yo pou ou", "Li rekonèt efase yo, sa ki te ladan yo pou klarifye", "Ou di ou te efase mesaj sa yo pou kache yo pou mwen. Sou kisa yo te pale epi ki antant sa touche?", "Li rekonèt kache mesaj, sa pa nesesèman yon relasyon. Efase mesaj san kontèks klè ka yon abitid òdinè tou."], ["Patnè w pale w de yon k bout other events.", "styleAdvice": "Ask what time and format work best.;Offer thinking time and a quiet setting, if preferred.;Allow speaking time, then take turns summarizing.;Ask what format works today without fixing a personality label.;Offer writing, without demanding immediate replies or private message access.;Ask one clear, respectful question at a time.", "wordAdvice": "Use short sentences and one question at a time.;Describe the fact, its effect on you and your specific request.;Choose a language both understand and check meaning by rephrasing.", "countryNoScore": "Country does not change the level of conclusion.", "contextQuestion": "What habits and boundaries matter to you in our relationship?", "safetyEyebrow": "Recognize concerning behavior", "safetyTitle": "Love should not make you afraid.", "safetyIntro": "These guides apply to every gender and orientation. They concern actions, not a “criminal type.” Appearance, culture and astrology cannot predict homicide.", "helpUS": "In the United States: immediate danger, call 911. Confidential support: 1-800-799-7233 or text START to 88788. Elsewhere, contact local services. Use a safe device if yours is monitored.", "helpTitle": "What support comes first?", "notAssessment": "This is not a validated clinical assessment. It does not diagnose anyone or predict violence. Answers are not saved.", "immediate": "Do you fear immediate danger, a weapon threat or being prevented from leaving?", "neck": "Has there recently been pressure on the neck or suffocation?", "control": "Are there threats, sexual coercion, forced monitoring or violence?", "yesNo": "I don’t know;Yes;No", "seeSteps": "See next steps", "ifAfraid": "If you are afraid", "safetyAdvice": "Do not seek a confession or confront the person alone. Seek individual specialist support.;Preparing a separation may involve a safe place, documents, transport and a trusted person, without increasing danger.;Do not use this journal if someone can read your browser. o describe lo conocido y lo que falta discutir, sin notas de fidelidad ni porcentajes inventados.", "possibleNote": "«Posible» no significa «probable». «Confirmado» se refiere solo a un hecho concreto, nunca a deducciones corporales o perfiles.", "cultureTitle": "India, Estados Unidos… y tu historia", "cultureIntro": "No existe un único modelo de pareja por país. Mejor pregunta:", "cultureQuestions": "¿Qué lugar deben tener nuestras familias?;¿Qué muestras de afecto te resultan cómodas en público?;¿Cómo definimos amistad, coqueteo y un límite traspasado?;¿Qué espacio privado quieres conservar?", "sources": "Referencias y fuentes", "sourceWHO": "OMS: pruebas de virginidad sin validez científica", "sourceNHS": "NHS: secreciones vaginales", "sourceReview": "Revisión: límites de las señales no verbales", "qualitative": "Orientación cualitativa · Sin porcentaje", "levels": "Información insuficiente;Situación por aclarar;Afirmaciones por aclarar;Hecho concreto declarado como confirmado", "levelTexts": "Estos elementos no permiten concluir infidelidad ni actividad sexual.;Hay distintas explicaciones posibles. Describe lo observado y pide contexto.;Repite las afirmaciones exactas. Una contradicción por sí sola no confirma infidelidad.;La aplicación no verifica tu relato. La confirmación se limita al hecho descrito, sin deducir otros sucesos.", "styleAdvice": "Pregunta qué momento y formato convienen.;Ofrece tiempo para pensar y un lugar tranquilo, si lo prefiere.;Deja tiempo para hablar y luego resuman por turnos.;Pregunta qué formato sirve hoy, sin encasillar.;Propón escribir, sin exigir respuestas inmediatas ni acceso a mensajes privados.;Haz una pregunta clara y respetuosa a la vez.", "wordAdvice": "Usa frases cortas y una pregunta a la vez.;Describe el hecho, su efecto en ti y tu petición concreta.;Elijan un idioma que ambos entiendan y comprueben el sentido reformulando.", "countryNoScore": "El país no cambia el nivel de conclusión.", "contextQuestion": "¿Qué hábitos y límites son importantes para ti en nuestra relación?", "safetyEyebrow": "Reconocer conductas preocupantes", "safetyTitle": "El amor no debe darte miedo.", "safetyIntro": "Estas orientaciones sirven para todos los géneros y orientaciones. Se centran en actos, no en un «tipo criminal». La apariencia, la cultura y la astrología no predicen un homicidio.", "helpUS": "En Estados Unidos: peligro inmediato, llama al 911. Apoyo confidencial: 1-800-799-7233 o envía START al 88788. En otros países, contacta servicios locales. Usa un dispositivo seguro si el tuyo está vigilado.", "helpTitle": "¿Qué ayuda priorizar?", "notAssessment": "Este recorrido no es una escala clínica validada. No diagnostica a nadie ni predice violencia. Las respuestas no se guardan.", "immediate": "¿Temes un peligro inmediato, una amenaza con armas o que te impidan salir?", "neck": "¿Ha habido recientemente presión en el cuello o asfixia?", "control": "¿Hay amenazas, coacción sexual, vigilancia impuesta o violencia?", "yesNo": "No lo sé;Sí;No", "seeSteps": "Ver próximos pasos", "ifAfraid": "Si tienes miedo", "safetyAdvice": "No busques una confesión ni confrontes a la persona a solas. Busca apoyo individual especializado.;Preparar una separación puede requerir un lugar seguro, documentos, transporte y una persona de confianza, sin aumentar el peligro.;No uses este diario si alguien puede leer tu navegador. Cerrar una página no borra el historial.;No eres responsable de la violencia ajena. Un acto grave basta para pedir ayuda.", "behaviorsTitle": "Conductas que deben tomarse en serio", "observable": "Conducta observable", "historyTitle": "Un caso documentado", "historyTag": "Clare Wood · Inglaterra · 2009", "historyHeading": "Antecedentes de violencia, no un perfil físico", "historyText": "Clare Wood fue asesinada por su expareja en 2009. Su caso dio nombre a «Clare’s Law», un sistema de divulgación de antecedentes de violencia de pareja implantado en Inglaterra y Gales en 2014. Es propio de esa jurisdicción.", "historyLesson": "Los antecedentes documentados y las conductas actuales pueden justificar apoyo especializado. Parecerse a un agresor no permite predecir la conducta individual.", "officialDoc": "Leer el documento oficial británico", "sourceDOJ": "Justicia estadounidense: violencia de pareja", "sourceWarning": "The Hotline: señales de abuso", "sourceEscalation": "Escalada", "sourceStalking": "Acoso y plan de seguridad", "sourceNeck": "NHS: lesiones del cuello, a veces sin marcas", "reviewDate": "Fuentes consultadas el 17 de octubre de 2026.", "noGuarantee": "La ausencia de respuestas afirmativas no garantiza seguridad.", "emergencyResult": "Prioridad inmediata: ve a un lugar seguro si es posible y llama a emergencias locales (911 en EE. UU.). No retrases la llamada para terminar este cuestionario.", "neckResult": "Busca atención médica pronta tras presión en el cuello, incluso sin marcas. Dificultad respiratoria, pérdida de conocimiento o síntomas neurológicos: emergencias de inmediato.", "controlResult": "Busca apoyo individual especializado y un plan de seguridad personalizado. No confrontes a tu pareja para ponerla a prueba.", "unknownResult": "Este cuestionario no descarta peligro. Si tienes miedo o dudas, puedes pedir apoyo especializado sin pruebas ni certeza.", "contactHelp": "Contactar apoyo confidencial en Estados Unidos", "unsavedWarning": "Hay texto sin guardar. Cambiar de idioma borrará los campos no guardados. ¿Continuar?", "navGuide": "Cómo usar", "helpTitleGuide": "Un paso a la vez.", "guideIntro": "Elige lo que corresponda a tus necesidades. No tienes que completar todos los módulos.", "guideTitles": "1. Revisar tu seguridad;2. Elegir una situación;3. Leer antes de hablar;4. Seguir las respuestas;5. Adaptar al contexto;6. Escribir o hacer una pausa", "guideTexts": "Si tienes miedo, abre Señales de peligro. En peligro inmediato, contacta emergencias en lugar de iniciar una conversación.;En Explorar, busca lo observado: restaurante, hotel, beso, teléfono, etc. Abre Preparar la conversación.;Lee las posibles explicaciones y comprueba lo observado. Pregunta si es buen momento y luego usa la pregunta propuesta.;Elige la categoría que describe la respuesta: explicación, contradicción concreta, negativa o límite reconocido. Lee el consejo y elige cómo seguir. La aplicación no verifica la respuesta.;En Mi contexto, indica hábitos conocidos y preferencias de comunicación. Obtén una formulación adaptada sin puntuación de fidelidad.;En Mi diario, separa observación, interpretación, emociones y necesidades. Guarda, exporta o elimina. En Hacer una pausa, tómate un minuto antes de continuar.", "guideScenario": "Para cada situación", "guideScenarioText": "Observación → Pregunta abierta → Escucha → Aclaración si hace falta → Acuerdo o decisión personal. Una reacción corporal o negativa no es una confesión.", "observedLabel": "Lo que observas", "conclusionLabel": "Lo que permite concluir", "doubtIntro": "¿Te preguntas si tu pareja te es infiel? Elige la escena que realmente observaste. La aplicación te ayuda a comprenderla y hablar de ella; no detecta infidelidad.", "contextualLabel": "Comprender en su contexto", "confirmedLabel": "Hecho reconocido, límites por aclarar", "communicationLabel": "Dificultad de comunicación", "researchTitle": "Ocultación: lo que describe la investigación", "researchIntro": "Las ocho escenas nuevas son ejemplos educativos redactados para esta aplicación sobre temas investigados. No reproducen relatos de participantes ni son una lista diagnóstica.", "researchLimits": "Estos estudios dependen de autoinformes y muestras y contextos limitados. No indican la probabilidad de infidelidad de tu pareja ni validan estas guías de conversación.", "noSnooping": "No uses estos ejemplos para registrar, seguir ni tender trampas. Parte de hechos conocidos o reconocidos libremente.", "newLabel": "Nuevo · Ejemplo educativo", "studyContext": "Tema de investigación relacionado", "research1": "Ocultar una aven ut;Esplikasyon detaye;Chwazi yon lang nou toude konprann", "education": "Diplòm pa mezire onètete ni konpreyansyon. Chwazi pawòl ki bon pou nou toude.", "identityTitle": "Oryantasyon, fòm kò ak astwoloji", "identityText": "Okenn oryantasyon seksyèl ni fòm kò pa predi fidelite. Pa devine oryantasyon patnè w. Siy astwolojik pa sèvi isit la pou predi konpòtman oswa konpatibilite; nou ka pale sou sa yo vle di pou nou.", "evidence": "Sou kisa kesyon w baze?", "evidences": "Aparans, kò, entwisyon oswa pwofil;Sa ou wè ki pa klè: sòti, woulib, otèl…;Pawòl presi pou klarifye;Yon zak presi yo rekonèt klèman oswa ou wè san dout", "specific": "Dekri sèlman zak presi a", "specificHint": "Egzanp: yon bo li rekonèt. Sa pa konfime relasyon seksyèl.", "contextPrivacy": "Repons sa yo pa anrejistre epi yo efase lè w kite modil la. Se sèlman nòt jounal yo ki rete lokalman.", "contextResultTitle": "Yon konklizyon ki mache ak enfòmasyon yo", "contextResultIntro": "Rezilta a dekri sa ou konnen ak sa pou n diskite, san nòt fidelite ni pousantaj envante.", "possibleNote": "«Posib» pa vle di «pwobab». «Konfime» konsène sèlman yon zak presi, pa yon dediksyon sou kò oswa pwofil.", "cultureTitle": "End, Etazini… ak istwa pa w", "cultureIntro": "Pa gen yon sèl modèl koup pou yon peyi. Olye sa, mande:", "cultureQuestions": "Ki plas nou vle bay fanmi nou?;Ki afeksyon ki bon pou ou an piblik?;Kijan nou defini zanmitay, flè ak yon limit ki depase?;Ki espas prive ou vle konsève?", "sources": "Referans ak sous", "sourceWHO": "OMS: tès vijinite pa gen baz syantifik", "sourceNHS": "NHS: sekresyon vajinal", "sourceReview": "Revizyon: limit siy ki pa vèbal", "qualitative": "Gid kalitatif · San pousantaj", "levels": "Enfòmasyon pa sifi;Sitiyasyon pou klarifye;Pawòl pou klarifye;Yon zak presi ou rapòte kòm konfime", "levelTexts": "Eleman sa yo pa ka pwouve enfidelite ni aktivite seksyèl.;Plizyè esplikasyon posib. Dekri sa ou wè epi mande kontèks la.;Repete pawòl egzak yo. Yon kontradiksyon pou kont li pa konfime enfidelite.;Aplikasyon an pa verifye istwa w. Konfimasyon an limite ak zak ou dekri a, san devine lòt bagay.", "styleAdvice": "Mande ki lè ak ki fason ki pi bon.;Pwopoze tan pou reflechi ak yon kote kalm, si li pito sa.;Bay tan pou pale, apre sa repete sa nou konprann youn apre lòt.;Mande ki fason ki bon jodi a, san kole etikèt sou moun nan.;Pwopoze ekri, san egzije repons touswit ni aksè nan mesaj prive.;Poze yon sèl kesyon klè ak respè chak fwa.", "wordAdvice": "Sèvi ak fraz kout epi yon kesyon chak fwa.;Dekri zak la, efè li sou ou ak demann presi ou.;Chwazi yon lang nou toude konprann epi verifye sans lan ak pwòp mo nou.", "countryNoScore": "Peyi a pa chanje nivo konklizyon an.", "contextQuestion": "Ki abitid ak limit ki enpòtan pou ou nan relasyon nou?", "safetyEyebrow": "Rekonèt konpòtman ki bay enkyetid", "safetyTitle": "Lanmou pa dwe fè w pè.", "safetyIntro": "Gid sa yo konsène tout moun ak tout oryantasyon. Yo pale sou zak, pa yon «tip kriminèl». Aparans, kilti ak astwoloji pa ka predi yon asasina.", "helpUS": "Ozetazini: danje imedya, rele 911. Èd konfidansyèl: 1-800-799-7233 oswa voye START pa SMS nan 88788. Lòt kote, kontakte sèvis lokal yo. Sèvi ak yon aparèy ki an sekirite si y ap siveye pa w la.", "helpTitle": "Ki èd pou chèche an premye?", "notAssessment": "Sa a pa yon echèl klinik valide. Li pa fè dyagnostik moun ni predi vyolans. Repons yo pa anrejistre.", "immediate": "Èske w pè yon danje imedya, menas ak zam oswa yo anpeche w soti?", "neck": "Èske dènyèman te gen presyon nan kou oswa yo te anpeche w respire?", "control": "Èske gen menas, presyon seksyèl, siveyans fòse oswa vyolans?", "yesNo": "Mwen pa konnen;Wi;Non", "seeSteps": "Gade pwochen etap yo", "ifAfraid": "Si w pè", "safetyAdvice": "Pa chèche jwenn konfesyon ni konfwonte moun nan poukont ou. Chèche sipò endividyèl espesyalize.;Prepare yon separasyon ka mande kote ki an sekirite, papye, transpò ak yon moun ou fè konfyans, san ogmante danje.;Pa sèvi ak jounal sa a si yon moun ka li navigatè w. Fèmen yon paj pa efase istorik la.;Ou pa responsab vyolans lòt moun nan. Yon sèl zak grav sifi pou mande èd.", "behaviorsTitle": "Konpòtman pou pran oserye", "observable": "Konpòtman ou ka obsève", "historyTitle": "Yon ka ki dokimante", "historyTag": "Clare Wood · Angletè · 2009", "historyHeading": "Istwa vyolans, pa pwofil fizik", "historyText": "Ansyen patnè Clare Wood te touye l an 2009. Ka li a bay «Clare’s Law» non li, yon sistèm pou divilge istwa vyolans nan koup ki te deplwaye ann Angletè ak nan peyi Gal an 2014. Sistèm sa a konsène jiridiksyon sa a.", "historyLesson": "Istwa ki dokimante ak konpòtman aktyèl ka jistifye èd espesyalize. Resanblans ak yon moun ki fè krim pa pèmèt predi sa yon lòt moun ap fè.", "officialDoc": "Li dokiman ofisyèl britanik la", "sourceDOJ": "Depatman Jistis Etazini: vyolans nan koup", "sourceWarning": "The Hotline: siy abi", "sourceEscalation": "Vyolans k ap ogmante", "sourceStalking": "Asèlman ak plan sekirite", "sourceNeck": "NHS: blesi nan kou ka pa gen mak", "reviewDate": "Sous yo verifye 17 oktòb 2026.", "noGuarantee": "Menm si pa gen repons wi, sa pa garanti sekirite.", "emergencyResult": "Priyorite imedya: ale yon kote ki an sekirite si sa posib epi rele sèvis ijans lokal yo (911 Ozetazini). Pa tann fini kesyonè sa a pou rele.", "neckResult": "Chèche yon evalyasyon medikal rapid apre presyon nan kou, menm san mak. Difikilte pou respire, pèdi konesans oswa pwoblèm newolojik: rele ijans touswit.", "controlResult": "Chèche sipò endividyèl espesyalize ak yon plan sekirite pou sitiyasyon pa w. Pa konfwonte patnè w pou teste l.", "unknownResult": "Kesyonè sa a pa ka di pa gen danje. Si w pè oswa ou pa sèten, ou ka kontakte èd espesyalize san prèv ni sètitid.", "contactHelp": "Kontakte èd konfidansyèl Ozetazini", "unsavedWarning": "Ou gen tèks ki poko anrejistre. Chanje lang ap efase chan ou poko anrejistre yo. Kontinye?", "navGuide": "Kijan pou itilize", "helpTitleGuide": "Yon etap chak fwa.", "guideIntro": "Chwazi sa ki mache ak bezwen w. Ou pa oblije fini tout modil yo.", "guideTitles": "1. Verifye sekirite w;2. Chwazi yon sitiyasyon;3. Li anvan w pale;4. Swiv repons yo;5. Adapte ak kontèks la;6. Ekri oswa fè yon poz", "guideTexts": "Si w pè, ouvri Siy danje. Si danje a imedya, kontakte ijans olye w kòmanse yon diskisyon.;Nan Eksplore, chèche sitiyasyon ou wè a: restoran, otèl, bo, telefòn, elatriye. Ouvri Prepare konvèsasyon an.;Li esplikasyon posib yo epi verifye sa ou obsève. Mande si se yon bon moman, apre sa sèvi ak kesyon yo pwopoze a.;Chwazi kategori ki dekri repons lan: esplikasyon, kontradiksyon presi, refi oswa limit li rekonèt li depase. Li konsèy la epi chwazi pwochen etap la. Aplikasyon an pa verifye repons lan.;Nan Kontèks mwen, mete abitid ou konnen ak fason nou pito kominike. Jwenn pawòl ki adapte, san nòt fidelite.;Nan Jounal mwen, separe sa ou obsève, sa ou panse, sa ou santi ak bezwen w. Anrejistre, ekspòte oswa efase. Nan Fè yon poz, pran yon minit anvan ou reprann.", "guideScenario": "Pou chak sitiyasyon", "guideScenarioText": "Obsèvasyon → Kesyon ouvè → Koute → Klarifye si sa nesesè → Antant oswa desizyon pèsonèl. Yon reyaksyon kò oswa refi pa yon konfesyon.", "observedLabel": "Sa ou obsève", "conclusionLabel": "Sa ou ka konkli", "doubtIntro": "Ou ap mande si patnè w ap twonpe w? Chwazi sa ou te obsève vre. Aplikasyon an ede w konprann sitiyasyon an epi pale sou li; li pa detekte enfidelite.", "contextualLabel": "Pou konprann nan kontèks li", "confirmedLabel": "Zak li rekonèt, limit pou klarifye", "communicationLabel": "Difikilte kominikasyon", "researchTitle": "Kache enfòmasyon: sa rechèch dekri", "researchIntro": "Uit nouvo sèn yo se egzanp edikatif nou ekri pou aplikasyon an sou sijè rechèch etidye. Yo pa kopi istwa patisipan yo ni yon lis dyagnostik.", "researchLimits": "Etid sa yo baze sou deklarasyon moun, echantiyon ak kontèks limite. Yo pa bay pwobabilite patnè w ap twonpe w ni valide gid konvèsasyon sa yo.", "noSnooping": "Pa sèvi ak egzanp sa yo p const app=document.querySelector('#app'),langs=['fr','en','es','ht'],localeTags={fr:'fr-FR',en:'en-US',es:'es-ES',ht:'ht-HT'};let lang='fr';try{const l=localStorage.getItem('soutien-language');if(langs.includes(l))lang=l}catch{}let current='home',chosen=0,step=0,answerKey=null,timerId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=k=>UI[lang][k],arr=k=>t(k).split(';'),content=()=>CONTENT[lang];function options(key){return arr(key).map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}function quote(text){return `<div class="quote">“${esc(text)}”</div>`}function btn(text,action,primary=false){return `<button ${primary?'class="primary"':''} onclick="${action}">${esc(text)}</button>`}function field(id,key,type='textarea',opts=''){return `<label for="${id}">${esc(t(key))}</label>`+(type==='select'?`<select id="${id}">${options(opts)}</select>`:`<textarea id="${id}" maxlength="3000"></textarea>`)}function sourceLinks(safety=false){const sources=safety?[['sourceDOJ','https://www.justice.gov/ovw/domestic-violence'],['sourceWarning','https://www.thehotline.org/identify-abuse/domestic-abuse-warning-signs/'],['sourceEscalation','https://www.thehotline.org/resources/escalation/'],['sourceStalking','https://www.thehotline.org/resources/stalking-safety-planning/'],['sourceNeck','https://www.gloshospitals.nhs.uk/your-visit/patient-information-leaflets/injury-to-the-throat/']]:[['sourceWHO','https://www.who.int/publications/i/item/WHO-RHR-18.15'],['sourceNHS','https://www.nhs.uk/symptoms/vaginal-discharge/'],['sourceReview','https://pubmed.ncbi.nlm.nih.gov/30609913/']];return `<article class="card" style="margin-top:20px"><h3>${t('sources')}</h3>${sources.map(([key,url])=>`<p><a href="${url}" target="_blank" rel="noopener">${t(key)}</a></p>`).join('')}<small>${t('reviewDate')}</small></article>`}

const RECIT_KEY = 'soutien-recit-v1';

/* ---------- stockage ---------- */
function recitLoad() {
  try { return JSON.parse(localStorage.getItem(RECIT_KEY)) || { dossiers: [] }; } catch { return { dossiers: [] }; }
}
function recitSave(db) {
  try { localStorage.setItem(RECIT_KEY, JSON.stringify(db)); return true; } catch { alert(R('saveFailed')); return false; }
}
function recitUid(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
function recitGet(db, id) { return db.dossiers.find((d) => d.id === id); }
function recitBump(d) { d.version = (d.version || 0) + 1; d.updated = new Date().toISOString(); }
function recitDate(iso) { try { return new Date(iso).toLocaleString(localeTags[lang]); } catch { return iso; } }

function recitIdb(fn) {
  return new Promise((ok, ko) => {
    try {
      const rq = indexedDB.open('soutien-recit-audio', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('audio');
      rq.onsuccess = () => { const tx = rq.result.transaction('audio', 'readwrite'); fn(tx.objectStore('audio'), ok); tx.onerror = () => ko(tx.error); };
      rq.onerror = () => ko(rq.error);
    } catch (e) { ko(e); }
  });
}
const recitAudioPut = (id, blob) => recitIdb((s, ok) => { s.put(blob, id); ok(); });
const recitAudioGet = (id) => recitIdb((s, ok) => { const r = s.get(id); r.onsuccess = () => ok(r.result); });
const recitAudioDel = (id) => recitIdb((s, ok) => { s.delete(id); ok(); });
